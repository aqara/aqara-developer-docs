          example: 9.221
        year:
          type: number
          format: double
          description: 近 365 天能耗（kWh）
          example: 230.229

    EmsSpaceSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsSummaryData'
            type:
              type: string
              enum:
              - EmsSpaceSummaryResponse
