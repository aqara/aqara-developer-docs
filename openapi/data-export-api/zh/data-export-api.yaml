    UpgradableFirmwareInfo:
      type: object
      required: [firmwareVersion, filePath, fileSize, firmwareMd5, firmwareCRC32, firmwareType, isNecessary, isForce, state]
      properties:
        firmwareVersion:
          type: string
          description: 固件版本号
        intVersion:
          type: integer
          nullable: true
          description: Matter 类型固件整型版本号
        filePath:
          type: string
          description: 固件文件地址
        fileSize:
          type: integer
          format: int64
          description: 固件文件大小（byte）
        firmwareMd5:
          type: string
          description: 固件文件 MD5
        firmwareCRC32:
          type: string
          description: 固件文件 CRC32
        firmwareSha256:
          type: string
          nullable: true
          description: 固件文件 SHA256
        firmwareType:
          $ref: '#/components/schemas/UpgradableFirmwareType'
        updateLog:
          type: string
          nullable: true
          description: 固件升级说明
        model:
          type: string
          nullable: true
          description: 设备型号
        isNecessary:
          type: boolean
          description: 是否必经版本。true 表示必经，false 表示非必经
        isForce:
          type: boolean
          description: 是否强制升级
        state:
          type: integer
          description: 固件状态。<br />1：测试中，<br />2：灰度，<br />3：已上线，<br />5：beta 版本
          enum: [1, 2, 3, 5]
        releaseTime:
          type: integer
          format: int64
          nullable: true
          description: 固件上线生效时间（毫秒时间戳）

    UpgradableDeviceFirmwareItem:
      type: object
      required:
      - deviceId
      - deviceName
      - state
      - upgradableFirmwares
      - currentFirmwareVersion
      properties:
        deviceId:
          type: string
          description: 设备ID
        deviceName:
          type: string
          description: 设备名称
        state:
          type: boolean
          description: 设备在线状态
        space:
          $ref: '#/components/schemas/DeviceSpace'
          description: 设备关联的空间
        upgradableFirmwares:
          type: array
          description: 设备可升级固件列表
          items:
            $ref: '#/components/schemas/UpgradableFirmwareInfo'
        currentFirmwareVersion:
          type: string
          description: 设备当前固件版本。

    # ── Automation ────────────────────────────────────────────────
    AutomationSummary:
      type: object
      required:
      - automationId
      - name
      - enabled
      - definitionType
      - createTime
      - spaces
      properties:
        automationId:
          type: string
          description: 自动化 ID。
        name:
          type: string
          description: 自动化名称。
        enabled:
          type: boolean
          description: 是否启用。true：启用；false：禁用。
        definitionType:
          type: string
          enum: [SCRIPT_JSON, SCRIPT_TEXT, WHEN_IF_THEN, LEGACY_FLOW, LEGACY_LINKAGE, OTHER]
          description: |
            自动化类型，说明如下： <br />
            - SCRIPT_JSON：通过 API 创建的 Flow 自动化。  
            - SCRIPT_TEXT：通过 Aqara Studio Web 页面创建的 Flow 自动化。  
            - WHEN_IF_THEN：Classic 自动化。  
            - LEGACY_FLOW：Flow 自动化（旧版）。  
            - LEGACY_LINKAGE：Logic 自动化。  
            - OTHER：其他自动化类型。
        createTime:
          type: integer
          format: int64
          description: 创建时间（毫秒级 UTC 时间戳）
        space:
          anyOf:
          - $ref: '#/components/schemas/SpaceNode'
          - type: object
            nullable: true
            enum:
            - null
          description: 兼容单空间字段，等于 spaces 的第一项；无可解析关联时省略，可兼容按 null 处理。
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: includeMetadata=true 时返回的对象用户 metadata；与 config.metadata 不同。
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: 全部可解析的关联空间，按 spaceId 去重；无关联时为 []。没有有效直接关联时沿用原有父级空间回退。

    AutomationDetails:
      allOf:
      - $ref: '#/components/schemas/AutomationSummary'
      - type: object
        properties:
          configFormat:
            type: string
            nullable: true
            enum:
            - JSON_AUTOMATION
            - FLOW_CANONICAL
            - null
            description: configText 能无损导出公共 DSL 时为 JSON_AUTOMATION，否则完整回退 FLOW_CANONICAL；读取不改写持久图。
          config:
            nullable: true
            description: 详情定义。按 configFormat 解析；FLOW_CANONICAL 不作为公共 JSON 更新输入。
            anyOf:
            - $ref: '#/components/schemas/JsonAutomationConfig'
            - $ref: '#/components/schemas/FlowCanonicalConfig'
            - type: object
              nullable: true
              enum:
              - null
          issues:
            type: array
            readOnly: true
            description: 仅用于读取的自动化诊断，与 config 同级；path 相对自动化 config（例如 automations[0].actions[0].value）。健康详情返回 []，列表省略；不写入 configText，也不放宽创建和更新校验。含诊断的历史只读目标须修复后才能回写，结构无法投影时仍回退 FLOW_CANONICAL。
            items:
              type: object
              required:
              - code
              - path
              - message
              properties:
                code:
                  type: string
                path:
                  type: string
                message:
                  type: string

    JsonAutomationConfig:
      description: 公共自动化 DSL；事件或定时触发。多条规则合并为同一个自动化对象；回读按执行语义规范化，不保证原分组或画布布局。
      type: object
      required:
      - automations
      properties:
        metadata:
          $ref: '#/components/schemas/AutomationDslMetadata'
        automations:
          type: array
          description: 一个 Open 自动化包含一条或多条规则，共用配置变量，各自保留触发与执行关系
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAutomation'
      additionalProperties: false

    FlowCanonicalConfig:
      type: object
      description: Studio 前端画布使用的完整自动化定义。
      properties:
        kind:
          type: string
          enum: [flow.canonical]
        flowVersion:
          type: string
          description: 画布定义版本，当前实现默认值为 2.0
        registryVersion:
          type: string
          description: 节点注册表版本，当前实现默认值为 2.0
        metadata:
          $ref: '#/components/schemas/FlowCanonicalMetadata'
        variables:
          type: array
          description: 画布变量声明；不是触发器、条件或动作列表
          items:
            $ref: '#/components/schemas/FlowCanonicalVariable'
        nodes:
          type: array
          description: >-
            全部流程节点。通过 type 前缀识别语义：event.* 为触发器，condition.* 为条件，action.* 为动作；
            数组顺序不代表执行顺序。
          items:
            $ref: '#/components/schemas/FlowCanonicalNode'
        edges:
          type: array
          description: 节点端口之间的连线，是判断触发器、条件和动作执行关系的依据
          items:
            $ref: '#/components/schemas/FlowCanonicalEdge'
        editor:
          $ref: '#/components/schemas/FlowCanonicalEditorState'

    FlowCanonicalMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    FlowCanonicalVariable:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: true

    FlowCanonicalNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: 节点ID，同时被 edges 和 editor 的映射引用
        type:
          type: string
          description: 节点类型；event.* 表示触发器，condition.* 表示条件，action.* 表示动作
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        config:
          type: object
          description: 节点类型专属配置，字段随 type 变化
          additionalProperties: true
        title:
          type: string
          nullable: true

    FlowCanonicalEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/FlowCanonicalPortRef'
        target:
          $ref: '#/components/schemas/FlowCanonicalPortRef'

    FlowCanonicalPortRef:
      type: object
      required: [node, port]
      properties:
        node:
          type: string
          description: FlowCanonicalNode.id
        port:
          type: string
          description: 节点输入或输出端口名

    FlowCanonicalEditorState:
      type: object
      description: 前端画布显示状态，不用于判断自动化执行顺序
      properties:
        positions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalPosition'
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalEditorNode'

    FlowCanonicalPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    FlowCanonicalEditorNode:
      type: object
      properties:
        summary:
          type: string
        description:
          type: string
        label:
          type: string
        icon:
          type: string
        iconColor:
          type: string
        detail:
          type: object
          additionalProperties: true
        hidden:
          type: boolean

    AutomationListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: 满足条件的自动化总数。
        pageNum:
          type: integer
          description: 当前页码。
        pageSize:
          type: integer
          description: 当前页大小。
        data:
          type: array
          description: 自动化列表。
     
          items:
            $ref: '#/components/schemas/AutomationSummary'

    CreateAutomationRequest:
      type: object
      required:
      - config
      properties:
        name:
          type: string
          nullable: true
          description: 非空 name 优先；省略、null 或空白时回退到非空 config.metadata.name。
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: 名称重名处理策略。未传或为 true 时自动添加 (1)、(2) 等后缀；为 false 时返回名称重复错误
        definitionType:
          type: string
          enum:
          - SCRIPT_JSON
          default: SCRIPT_JSON
          description: 旧输入兼容字段，新调用方可省略。
        config:
          $ref: '#/components/schemas/JsonAutomationConfig'
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: 可选的初始空间关联；传入多个 ID，服务端去重。省略、null 或空数组时不建立直接关联。

    UpdateAutomationRequest:
      type: object
      required:
      - automationId
      - updateMask
      properties:
        name:
          type: string
          description: 新名称。
          nullable: true
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: 名称重名处理策略。未传或为 true 时自动添加 (1)、(2) 等后缀；为 false 时返回名称重复错误。该字段不需要加入 updateMask。
        enabled:
          type: boolean
          nullable: true
        config:
          anyOf:
          - $ref: '#/components/schemas/JsonAutomationConfig'
          - type: object
            nullable: true
            enum:
            - null
          description: 完整替换公共配置；允许替换可导出或回退原图的 CfgFlowLogic，不以 SCRIPT_JSON 分类作为更新资格。
        updateMask:
          type: array
          description: 非空数组，支持 name、enabled、config、spaceIds；被选字段必须有效，未选字段不发送非 null 值。
          items:
            type: string
            enum:
            - name
            - enabled
            - config
            - spaceIds
          minItems: 1
          uniqueItems: true
        automationId:
          type: string
          minLength: 1
          description: 目标 automationId，放在请求体中。
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: 选中 updateMask 的 spaceIds 时必须提供非 null 数组；整组替换而非追加，空数组清空直接关联。不更新空间时省略此字段及其掩码。
      allOf:
      - oneOf:
        - properties:
            updateMask:
              type: array
              items:
                type: string
                enum:
                - name
                - enabled
                - config
            spaceIds:
              type: array
              nullable: true
              enum:
              - null
        - required:
          - spaceIds
          properties:
            updateMask:
              type: array
              not:
                items:
                  not:
                    enum:
                    - spaceIds
            spaceIds:
              type: array
              items:
                type: string
                minLength: 1
                pattern: \S

    UpdateAutomationStatusRequest:
      type: object
      required: [automationIds, enabled]
      properties:
        automationIds:
          type: array
          description: 自动化 ID 列表。
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
          description: 是否启用。true：启用；false：禁用。

    UpdateAutomationSpaceRequest:
      type: object
      required:
      - automationIds
      properties:
        spaceId:
          type: string
          minLength: 1
          description: 旧单空间参数；等价于仅含该 ID 的 spaceIds，与非 null 的 spaceIds 互斥。
        automationIds:
          type: array
          minItems: 1
          description: 要更新空间关联的自动化 ID 列表。
          items:
            type: string
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: \S
          description: 目标空间 ID 数组；整组替换而非追加，服务端去重；空数组清空直接关联。
      example:
        spaceIds:
        - space-livingroom-001
        - space-bedroom-001
        automationIds:
        - auto_01HXYZABCDEF1234567890
      description: 替换每个对象的整组直接空间关联。spaceId 与 spaceIds 必须且只能提供一种非 null 形式；spaceIds=[] 清空直接关联。
      oneOf:
      - required:
        - spaceId
        properties:
          spaceId:
            type: string
            minLength: 1
            pattern: \S
          spaceIds:
            type: array
            nullable: true
            enum:
            - null
      - required:
        - spaceIds
        properties:
          spaceIds:
            type: array
            items:
              type: string
              minLength: 1
              pattern: \S
          spaceId:
            type: string
            nullable: true
            enum:
            - null

    DeleteAutomationsRequest:
      type: object
      required: [automationIds]
      properties:
        automationIds:
          type: array
          description: 自动化 ID 列表。
          minItems: 1
          items:
            type: string

    AutomationBatchFailure:
      type: object
      required: [automationId, code, message]
      properties:
        automationId:
          type: string
          description: 处理失败的自动化 ID。
        code:
          type: integer
          description: 失败项错误码。
        message:
          type: string
          description: 失败项错误信息。

    AutomationBatchResultData:
      type: object
      required: [successIds, failedItems]
      properties:
        successIds:
          type: array
          description: 批量处理成功的自动化 ID 列表。
          items:
            type: string
        failedItems:
          type: array
          description: 批量处理失败项列表。
          items:
            $ref: '#/components/schemas/AutomationBatchFailure'

    CreateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: 创建成功后的自动化 ID。
            type:
              type: string
              enum:
              - CreateAutomationResponse
              
    UpdateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              nullable: true
              example: ""

    DeleteAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
            type:
              type: string
              enum:
              - DeleteAutomationResponse

    UpdateAutomationStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
            type:
              type: string
              enum:
              - UpdateAutomationStatusResponse

    UpdateAutomationSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
            type:
              type: string
              enum:
              - UpdateAutomationSpaceResponse
      example:
        type: UpdateAutomationSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000026"
        code: 0
        message: success
        data:
          successIds: ["auto_01HXYZABCDEF1234567890"]
          failedItems: []

    AutomationDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationDetails'
              nullable: true
            type:
              type: string
              enum:
              - GetAutomationDetailsResponse
    AutomationListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationListData'
            type:
              type: string
              enum:
              - GetAutomationListResponse

    AutomationCapabilitiesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationCapabilitiesData'
            type:
              type: string
              enum:
              - QueryAutomationCapabilitiesResponse
      example:
        type: QueryAutomationCapabilitiesResponse
        version: v1
        msgId: "52ebd835-1b8d-48f7-ab30-741d7c1ae0ee"
        code: 0
        message: success
        data:
          devices:
            - deviceId: "lumi3.a61fca0f4da1a0bd"
              deviceName: "Edge Hub M300"
              endpoints:
                - endpointName: "Root"
                  endpointId: 1
                  properties:
                    - deviceType: "Root"
                      functionCode: "GeneralDiagnostics"
                      functionName: "GeneralDiagnostics"
                      traitCode: "AntiDeletionNotification"
                      traitName: "Accidental Deletion Prevention notification (child device)"
                      valueType: "event"
                      semanticRole: ["starter"]
                      valueRange:
                        enumRange:
                          - value: "1"
                            key: "trigger"

    AutomationCapabilitiesData:
      type: object
      nullable: true
      properties:
        devices:
          type: array
          description: 可用于自动化编排的设备能力列表
          items:
            $ref: '#/components/schemas/AutomationCapabilityDevice'
      description: 设备能力按当前权限实时发现；公共 DSL 结构见 JsonAutomationConfig。客户端允许额外发现字段。
      additionalProperties: true

    AutomationCapabilityDevice:
      type: object
      required: [deviceId, deviceName, endpoints]
      properties:
        deviceId:
          type: string
          description: 设备ID
        deviceName:
          type: string
          description: 设备名称
        endpoints:
          type: array
          description: 设备端点列表
          items:
            $ref: '#/components/schemas/AutomationCapabilityEndpoint'

    AutomationCapabilityEndpoint:
      type: object
      required: [endpointName, endpointId, properties]
      properties:
        endpointName:
          type: string
          description: 端点名称
        endpointId:
          type: integer
          description: 端点ID
        properties:
          type: array
          description: 端点可用能力列表（功能点/事件/命令）
          items:
            $ref: '#/components/schemas/AutomationCapabilityProperty'

    AutomationCapabilityProperty:
      type: object
      required: [deviceType, functionCode, functionName, valueType, semanticRole]
      properties:
        deviceType:
          type: string
          description: 设备类型
        functionCode:
          type: string
          description: 功能编码
        functionName:
          type: string
          description: 功能名称
        traitCode:
          type: string
          description: 功能点代码（valueType 非 cmd 时常见）
        traitName:
          type: string
          description: 功能点名称
        commandCode:
          type: string
          description: 命令编码（valueType 为 cmd 时常见）
        commandName:
          type: string
          description: 命令名称
        valueType:
          type: string
          description: 值类型（如 boolean/number/enum/event/cmd）
        semanticRole:
          type: array
          description: 自动化环节角色
          items:
            type: string
            enum: [starter, condition, action]
        unit:
          type: string
          description: 单位（如 %, °C, lx 等）
        valueRange:
          $ref: '#/components/schemas/AutomationCapabilityValueRange'

    AutomationCapabilityValueRange:
      type: object
      description: 数值范围或枚举范围
      properties:
        min:
          type: number
          format: double
          description: 最小值
        max:
          type: number
          format: double
          description: 最大值
        enumRange:
          type: array
          items:
            $ref: '#/components/schemas/AutomationCapabilityEnumItem'

    AutomationCapabilityEnumItem:
      type: object
      description: 枚举范围
      required: [value, key]
      properties:
        value:
          type: string
          description: 枚举值（接口返回中通常为字符串）
        key:
          type: string
          description: 枚举显示文案

    # ── EMS (Energy Management System) ────────────────────────────
    EmsTrendDeviceRequest:
      type: object
      required: [startTime, endTime, deviceId, dimension]
      properties:
        startTime:
          type: integer
          format: int64
          description: 查询起始时间（UTC 毫秒时间戳）。
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: 查询结束时间（UTC 毫秒时间戳）。
          example: 1704153600000
        deviceId:
          type: string
          description: 设备 ID。
          example: "device_001"
        dimension:
          type: string
          description: 聚合维度。
          enum: ["1h", "1d", "month"]
          example: "1h"

    EmsTrendSpaceRequest:
      type: object
      required: [startTime, endTime, spaceId, dimension]
      properties:
        startTime:
          type: integer
          format: int64
          description: 查询起始时间（UTC 毫秒时间戳）。
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: 查询结束时间（UTC 毫秒时间戳）。
          example: 1706745600000
        spaceId:
          type: string
          description: 空间 ID。
          example: "room_001"
        dimension:
          type: string
          description: 聚合维度。
          enum: ["1h", "1d", "month"]
          example: "1d"

    EmsTotalDeviceRequest:
      type: object
      required: [startTime, endTime, deviceId]
      properties:
        startTime:
          type: integer
          format: int64
          description: 查询起始时间（UTC 毫秒时间戳）。
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: 查询结束时间（UTC 毫秒时间戳）。
          example: 1704153600000
        deviceId:
          type: string
          description: 设备 ID。
          example: "device_001"

    EmsTotalSpaceRequest:
      type: object
      required: [startTime, endTime, spaceId]
      properties:
        startTime:
          type: integer
          format: int64
          description: 查询起始时间（UTC 毫秒时间戳）。
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: 查询结束时间（UTC 毫秒时间戳）。
          example: 1706745600000
        spaceId:
          type: string
          description: 空间 ID。
          example: "home_001"

    EmsTrendPoint:
      type: object
      required: [startTime, value]
      properties:
        startTime:
          type: string
          description: |
            时间范围的起始时间，格式取决于查询维度：
            - 1h: yyyyMMddHH
            - 1d: yyyyMMdd
            - month: yyyyMM
          example: "2024010100"
        value:
          type: number
          format: double
          description: 该时间范围内的能耗值（kWh）
          example: 1.5

    EmsTotalData:
      type: object
      required: [totalValue]
      properties:
        totalValue:
          type: number
          format: double
          description: 该时间范围内的能耗总量（kWh）
          example: 45.6

    EmsDeviceTrendResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EmsTrendPoint'
            type:
              type: string
              enum:
              - EmsDeviceTrendResponse
      example:
        type: EmsDeviceTrendResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f010"
        code: 0
        message: success
        data:
          - startTime: "2024010100"
            value: 1.5
          - startTime: "2024010101"
            value: 2.3

    EmsSpaceTrendResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/EmsTrendPoint'
            type:
              type: string
              enum:
              - EmsSpaceTrendResponse
      example:
        type: EmsSpaceTrendResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f011"
        code: 0
        message: success
        data:
          - startTime: "20240101"
            value: 12.5
          - startTime: "20240102"
            value: 15.3

    EmsDeviceTotalResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsTotalData'
            type:
              type: string
              enum:
              - EmsDeviceTotalResponse
      example:
        type: EmsDeviceTotalResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f012"
        code: 0
        message: success
        data:
          totalValue: 45.6

    EmsSpaceTotalResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsTotalData'
            type:
              type: string
              enum:
              - EmsSpaceTotalResponse
      example:
        type: EmsSpaceTotalResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f013"
        code: 0
        message: success
        data:
          totalValue: 156.2

    EmsSummarySpaceRequest:
      type: object
      required: [spaceId]
      properties:
        spaceId:
          type: string
          description: 空间 ID。
          example: "home_001"

    EmsSummaryDeviceItem:
      type: object
      required: [did]
      properties:
        did:
          type: string
          description: 设备 ID。
          example: "device_001"
        endpointId:
          type: array
          items:
            type: integer
          description: 端点 ID 列表，为空或不传时，则查询该设备全部端点的能耗摘要。
