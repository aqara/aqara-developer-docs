      properties:
        functionCode:
          type: string
          description: 功能编码（如 LevelControl, ColorControl, Output）
        traits:
          type: array
          description: 功能点列表
          items:
            $ref: '#/components/schemas/Trait'
        commands:
          type: array
          description: 命令列表
          items:
            $ref: '#/components/schemas/Command'

    FlexibleValue:
      oneOf:
      - type: boolean
      - type: number
        format: double
      - type: string
      description: '动态值，具体类型取决于 trait/command 定义。

        推荐值类型来源规则：

        1) trait 场景优先读取同级 parameter.type；

        2) command 场景优先读取对应 field 的 parameter.type；

        3) 当 parameter.type=Enum 时，值类型是string；

        4) 若缺少 parameter 或类型未识别，按 string 兜底并保留原始值。

        '
    Trait:
      type: object
      required: [traitCode, parameter]
      properties:
        traitCode:
          type: string
          description: 功能点编码（如 CurrentLevel, ColorTemperature, OnOff）
        parameter:
          $ref: '#/components/schemas/TraitParameter'
          description: 功能点参数。
        value:
          $ref: '#/components/schemas/FlexibleValue'
          description: 当前值。类型与 parameter.type 的值保持一致。
        time:
          type: integer
          format: int64
          description: 值更新时间（毫秒级 UTC 时间戳）。

    Command:
      type: object
      required: [commandCode]
      properties:
        commandCode:
          type: string
          description: 命令编码（如 MoveToXYColor）
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CommandField'
          description: 命令参数字段列表

    CommandField:
      type: object
      required: [fieldCode, parameter]
      properties:
        fieldCode:
          type: string
          description: 参数字段编码（如 ColorX, ColorY, Time）
        parameter:
          $ref: '#/components/schemas/CommandFieldParameter'

    BaseParameter:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: |
            数据类型。<br />
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>类型</th>
                  <th>说明</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>Bool</td>
                  <td>布尔型</td>
                  <td>真或假（true/false）。</td>
                </tr>
                <tr>
                  <td>Integer</td>
                  <td>整型</td>
                  <td>整数类型。</td>
                </tr>
                <tr>
                  <td>Float</td>
                  <td>浮点型</td>
                  <td>带小数的数字。</td>
                </tr>
                <tr>
                  <td>String</td>
                  <td>字符型</td>
                  <td>字符串。</td>
                </tr>
                <tr>
                  <td>Struct</td>
                  <td>结构体</td>
                  <td>Aqara 自定义的结构数据，形式为 JSON 字符串。<br />可以包含多种类型字段。</td>
                </tr>
                <tr>
                  <td>Enum</td>
                  <td>枚举</td>
                  <td>枚举类型，定义有限个取值。</td>
                </tr>
                <tr>
                  <td>List[X]</td>
                  <td>列表</td>
                  <td>元素类型为 X 的列表，形式为 JSON 字符串。<br />X 可为 Integer、Float、String、Struct、Enum。</td>
                </tr>
                <tr>
                  <td>Data</td>
                  <td>数据块</td>
                  <td>16 进制字符串（Hex String），如 "0x01AB3F"。</td>
                </tr>
              </tbody>
            </table>
          enum: [Bool, Float, Integer, Enum, String, Struct, "List[X]", Data]
        min:
          type: number
          description: 最小值
          format: double
          nullable: true
        max:
          type: number
          description: 最大值
          format: double
          nullable: true
        supportedValues:
          description: 枚举值列表。仅当 parameter.type 为 Enum 时，此字段有意义。
          type: array
          items:
            $ref: '#/components/schemas/KeyValue'
          nullable: true
        unit:
          description: 单位。仅当 parameter.type 为 Integer 或 Float 时，此字段有意义。
          type: string
          nullable: true
        step:
          description: 步长。仅当 parameter.type 为 Integer 或 Float 时，此字段有意义。
          type: number
          format: double
          nullable: true

    TraitParameter:
      description: 功能点属性
      allOf:
        - $ref: '#/components/schemas/BaseParameter'
        - type: object
          required: [readable, writable, subscribable]
          properties:
            readable:
              type: boolean
              description: 是否可读。
              default: true
            writable:
              type: boolean
              description: 是否可写。
              default: false
            subscribable:
              type: boolean
              description: 是否可订阅。
              default: false
            dynamicSchema:
              type: object
              nullable: true
              additionalProperties: true
              description: 可选的动态候选值发现描述，用于解析当前可选值；候选列表不是控制值白名单。按 dynamicSchema 指引查询，不得自行构造候选。

    CommandFieldParameter:
      allOf:
      - $ref: '#/components/schemas/BaseParameter'
      - type: object
        required:
        - mandatory
        properties:
          mandatory:
            type: boolean
            description: 是否必填
          dynamicSchema:
            type: object
            nullable: true
            additionalProperties: true
            description: 可选的动态候选值发现描述，用于解析当前可选值；候选列表不是控制值白名单。按 dynamicSchema 指引查询，不得自行构造候选。

    KeyValue:
      type: object
      description: 键值对。
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: 键。
        value:
          type: string
          description: 值。

