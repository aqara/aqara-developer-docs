  # ────────────────────────────────────────────────────────────────
  /history/device-point-values/query:
    post:
      tags: [History]
      summary: 查询设备 Trait 值变化历史
      description: |
        本接口适用于查询多个设备的多个 Trait 在一定时间内的变化历史。支持通过分页游标 `cursor` 连续获取历史记录。
        
        查询最新变化时应省略 `cursor` 发起新查询，不要沿用翻页游标轮询。

        使用最新返回的 `nextCursor` 查询下一页时可以调整 `pageSize`。仅支持最近一次续页请求的原样重试，`cursor`、`pageSize` 及其他查询参数必须一致；继续前进后不支持回读更早的 `cursor`。

        参数或 `cursor` 无效时返回 `400`；游标过期或失效后应省略 `cursor` 重新查询，不会自动从头续接。查询暂时繁忙返回 `503` 时可重试。
      operationId: queryDevicePointHistory
      x-skill-intent: history.device_point_values.query
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePointHistoryQueryRequest'
            examples:
              queryLatestChanges:
                value:
                  deviceIds: ["device-001", "device-002"]
                  traitCodes: ["OnOff"]
                  startTime: 1770114300000
                  endTime: 1770639900000
                  descending: true
                  pageSize: 50
      responses:
