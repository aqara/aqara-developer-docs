  # ────────────────────────────────────────────────────────────────
  # 查询设备匹配能力
  # ────────────────────────────────────────────────────────────────
  /devices/capabilities:
    post:
      tags:
      - Device
      summary: 批量查询设备匹配能力及 trait 当前值
      description: '按显式 deviceIds 批量查询匹配能力，固定返回设备数组，不分页。deviceIds 必填且原始数组最多 20 项（重复项也计数）；trim 后按首次出现顺序去重查询。

        functionCodes、traitCodes、commandCodes 至少提供一种非空列表。列表项不得为空白，数组元素不按逗号拆分；未知字段及 pageNum/pageSize 返回 400。

        所有设备使用同一组条件，匹配规则与 GET 完全相同：不同类别条件按 AND 组合，trait/command 的 and 要求同一个 function 内匹配全部编码。

        只传 functionCodes 时返回命中功能下完整 traits/commands；传叶子条件时只保留命中叶子。traitCodes 与 commandCodes 同传要求 function 同时满足两类条件，并非并集。

        设备可访问但能力未命中时保留设备且 endpoints=[]；设备不存在或不可访问时省略；全部省略时 data=[]。结果按请求 ID 首次出现顺序排列，无 hasMore，不静默截断。

        trait 当前值读取 Studio 当前控制点，不主动向物理设备刷新，不保证跨设备同时刻快照。可取得时返回 value/time；空值字段可能省略，false 和 0 正常返回。command 无当前值。

        定义沿用普通 DeviceDefinition，不含数字 functionId/traitId/commandId/fieldId。请求体直接为 JSON 对象，不包 data；请求文本最多 1 Mi 个字符。

        POST 需要独立接口访问授权，只有 GET 权限不会隐式放行。参数错误整批返回 400；未处理的查询异常沿用统一错误响应，不伪装成成功的部分结果。'
      operationId: batchDeviceCapabilities
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters: 
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeviceCapabilitiesRequest'
            examples:
              traits:
                summary: 查询两台设备的开关 trait（示例编码）
                value:
                  deviceIds:
                  - device-a
                  - device-b
                  functionCodes:
                  - OnOff
                  traitCodes:
                  - OnOff
                  traitCodesMatchMode: or
              functions:
                summary: 返回命中功能下的 traits 和 commands
                value:
                  deviceIds:
                  - device-a
                  - device-b
                  functionCodes:
                  - OnOff
              commands:
                summary: 只查询指定命令（示例编码）
                value:
                  deviceIds:
                  - device-a
                  commandCodes:
                  - MoveToXYColor
      responses:
        '200':
          description: 成功；data 固定为数组，最多 20 台设备。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeviceCapabilitiesResponse'
              example:
                type: BatchDeviceCapabilitiesResponse
                version: v1
                msgId: batch-example
                code: 0
                message: success
                data:
                - deviceId: device-a
                  name: 示例灯 a
                  deviceTypesList:
                  - light
                  endpoints:
                  - endpointId: 2
                    endpointName: 主灯
                    deviceType: light
                    functions:
                    - functionCode: OnOff
                      traits:
                      - traitCode: OnOff
                        parameter:
                          type: Bool
                          readable: true
                          writable: true
                          subscribable: true
                        value: false
                        displayTags: []
                      commands: []
                - deviceId: device-b
                  name: 示例灯 b
                  deviceTypesList:
                  - light
                  endpoints:
                  - endpointId: 2
                    endpointName: 主灯
                    deviceType: light
                    functions:
                    - functionCode: OnOff
                      traits:
                      - traitCode: OnOff
                        parameter:
                          type: Bool
                          readable: true
                          writable: true
                          subscribable: true
                        value: true
                        displayTags: []
                      commands: []
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    get:
      tags: [Device]
      summary: 查询单个设备匹配能力
      description: |
        查询单个设备中符合过滤条件的能力配置，只返回命中的定义与对应 trait 当前值，不返回设备全量定义。

        :::tip   
        - `functionCodes`、`traitCodes`、`commandCodes` 之间按 AND 关系组合；如需查询 trait 或 command 任一类能力，请分开请求，或按 `functionCodes` 查询完整 function 定义。
        - 只传 `functionCodes`，不传 `traitCodes` 或 `commandCodes` 时：返回该 Function 下所有完整的 Trait 和 Command 定义（即全部叶子节点）。
        - 传入 traitCodes 或 commandCodes 时：只返回匹配这些条件的 Trait 或 Command 叶子，未匹配的叶子不返回。command 没有当前值。
        - 设备存在但能力未命中时，返回设备基础信息且 `endpoints=[]`；设备不存在或不可访问时，`data=null`。
        :::

      operationId: getMatchedDeviceCapabilities
      x-skill-intent: device.capability.match
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: deviceId
          in: query
          required: true
          description: 设备 ID（did）。
          schema:
            type: string
        - name: deviceTypesList
          in: query
          required: false
          description: |
            设备类型列表。用于先校验设备整体类型，再裁剪匹配 endpoint 类型。

            :::tip
            `deviceTypesList` 不能单独作为能力过滤条件。
            :::

          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: deviceTypesMatchMode
          in: query
          required: false
          description: |
            `deviceTypesList` 内多个设备类型的匹配方式。
            `or`：设备命中任意一个类型。
            `and`：设备必须同时命中全部类型。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: functionCodes
          in: query
          required: false
          description: |
            functionCode 列表。
            与 `traitCodes`、`commandCodes` 至少传一个。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: functionCodesMatchMode
          in: query
          required: false
          description: |
            `functionCodes` 内多个值的匹配方式。
            `or`：命中任意一个。
            `and`：裁剪后的结果必须包含全部值。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: traitCodes
          in: query
          required: false
          description: |
            traitCode 列表
            与 `functionCodes`、`commandCodes` 至少传一个。
            trait 命中时返回定义、当前值 value 与更新时间 time
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: traitCodesMatchMode
          in: query
          required: false
          description: |
            traitCodes 内多个值的匹配方式。
            `and` 表示必须在同一个 function 内同时命中全部 trait。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: commandCodes
          in: query
          required: false
          description: |
            commandCode 列表。
            与 `traitCodes`、`functionCodes` 至少传一个。
            command 只返回命令定义和字段定义，没有当前值。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: commandCodesMatchMode
          in: query
          required: false
          description: |
            commandCodes 内多个值的匹配方式。
            `and`：必须在同一个 function 内同时命中全部 command。
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: displayTags
          in: query
          required: false
          description: 设备标签列表。
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: displayTagsMatchMode
          in: query
          required: false
          description: "`displayTags` 内多个标签的匹配方式；`or` 表示命中任意一个标签，`and` 表示必须同时命中全部标签"
          schema:
            type: string
            enum:
            - or
            - and
            default: or
      responses:
        '200':
          description: 接口请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMatchedDeviceCapabilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

