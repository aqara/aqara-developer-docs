    EmsSummaryDevicesRequest:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmsSummaryDeviceItem'
          description: 设备列表

    EmsSummaryData:
      type: object
      required: [today, yesterday, week, month, year]
