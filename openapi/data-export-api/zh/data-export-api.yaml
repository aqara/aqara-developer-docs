  responses:
    BadRequestResponse:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedResponse:
      description: 未认证或认证失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            version: ''
            msgId: ''
            code: 401
            message: 'Authentication failed: Token is empty'
    ForbiddenResponse:
      description: 无权限访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            version: ''
            msgId: ''
            code: 403
            message: 无权访问该资源
    ConflictResponse:
      description: 当前资源状态与请求冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntityResponse:
      description: 请求格式正确，但协议、实体或配置不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundResponse:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000004"
              code: 404
              message: "资源不存在"
    TooManyRequestsResponse:
      description: 请求频率过高
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000005"
              code: 429
              message: "请求频率过高"
    InternalServerErrorResponse:
      description: 服务内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000006"
              code: 500
              message: "服务内部异常"
    BadGatewayResponse:
      description: Edge 或 Cloud 命令调用失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 502
              message: "Edge or Cloud command call failed"
    ServiceUnavailableResponse:
      description: 服务不可用；通常表示当前为 Edge 端，或 Cloud 端 cloudlinkcloud 服务未加载
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 503
              message: "服务暂时不可用"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <Token>"

  # 公共请求头参数（所有接口均需携带，由客户端统一附加）
  parameters:
    Lang:
      name: Lang
      in: header
      required: false
      schema:
        type: string
        example: "{{Lang}}"
      description: 语言。使用 `zh-CN` 表示中文，使用 `en-US` 表示英文。

  schemas:

    # ── 基础请求 / 响应 ──────────────────────────────────────────
    BaseResponse:
      type: object
      x-business-success-condition: code == 0
      required: [type, version, msgId, code]
      properties:
        type:
          type: string
          description: 消息类型
        version:
          type: string
          description: 接口版本
          example: v1
        msgId:
          type: string
          description: 消息 ID
        code:
          type: integer
          description: "业务状态码；仅 0 表示业务成功，HTTP 200 下的非 0 值仍表示业务失败"
        message:
          type: string
          description: 提示信息

    ApiResponseEnvelope:
      type: object
      required: [version, msgId, code, message]
      properties:
        version: { type: string, example: v1 }
        msgId: { type: string }
        code: { type: integer, example: 0 }
        message: { type: string, example: success }

    ExternalEventRequest:
      type: object
      required: [event]
      properties:
        event: { type: string, minLength: 1, description: 事件名称，用于匹配自动化触发块 }
        source: { type: string, nullable: true, description: 事件来源标识 }
        payload: { nullable: true, description: 任意 JSON 类型的事件载荷 }

    ExternalEventResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [accepted, event, seq]
              properties:
                accepted: { type: boolean, example: true }
                event: { type: string, example: ci.build.completed }
                seq: { type: integer, format: int64, description: 服务端分配的事件序列号 }

    ErrorResponse:
      description: 错误信息通过 code 与 message 提供；鉴权等直接错误响应可省略 type。
      allOf:
      - $ref: '#/components/schemas/ResponseEnvelope'
      example:
        type: ErrorMessage
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-err000000001"
        code: 400
        message: "参数 deviceId 不能为空"

    # ── Auth ─────────────────────────────────────────────────────

    StudioStatisticsDimension:
      type: string
      description: Studio 统计维度
      enum: [deviceCount, linkageCount, spaceCount, sceneCount]

    StudioStatisticsData:
      type: object
      description: Studio 统计信息；仅返回 dimensions 请求的统计字段
      properties:
        deviceCount:
          type: integer
          description: 设备数量
          example: 128
        linkageCount:
          type: integer
          description: 旧口径自动化节点数量，包含独立场景；不等于 /automations 列表数量。
          example: 24
        spaceCount:
          type: integer
          description: 空间数量
          example: 16
        sceneCount:
          type: integer
          description: 旧统计口径，不能替代独立场景 /scenes 列表的 totalCount。
          example: 12

    StudioStatisticsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudioStatisticsData'
            type:
              type: string
              enum:
              - StudioStatisticsResponse
      example:
        type: StudioStatisticsResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000021"
        code: 0
        message: success
        data:
          deviceCount: 128
          linkageCount: 24
          spaceCount: 16
          sceneCount: 12

    # ── Space ────────────────────────────────────────────────────
    SpaceNode:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: 空间 ID。
        parentSpaceId:
          type: string
          nullable: true
          description: 父空间 ID；没有父空间时省略此字段。
        name:
          type: string
          description: 空间名称。
        spatialMarking:
          type: string
          nullable: true
          description: 空间标记。
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: 子空间列表（递归结构）。

    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        parentSpaceId:
          type: string
          nullable: true
          description: 父空间 ID；为空时创建顶级空间。
        name:
          type: string
          minLength: 1
          description: 空间名称，不能为空字符串。
        spatialMarking:
          type: string
          nullable: true
          description: 空间语义标记；省略时由现有空间服务处理。
      example:
        parentSpaceId: "space-home-001"
        name: "客厅"
        spatialMarking: room

    CreateSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: 新创建的空间 ID。
            type:
              type: string
              enum:
              - CreateSpaceResponse
      example:
        type: CreateSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000006"
        code: 0
        message: success
        data: "space-livingroom-001"

    UpdateSpaceNameRequest:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: 空间 ID。
        name:
          type: string
          description: 新空间名称。
      example:
        spaceId: "space-livingroom-001"
        name: "新客厅"

    UpdateSpaceNameResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: 固定为空字符串。
            type:
              type: string
              enum:
              - UpdateSpaceNameResponse
      example:
        type: UpdateSpaceNameResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000007"
        code: 0
        message: success
        data: ""

    DeleteSpaceRequest:
      type: object
      required: [spaceId]
      properties:
        spaceId:
          type: string
          description: 空间 ID。
        deleteChildren:
          type: boolean
          default: false
          description: 是否同时删除子空间。
      example:
        spaceId: "space-livingroom-001"
        deleteChildren: false

    DeleteSpaceResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: string
            description: 删除成功后返回空字符串。
            example: ''
          type:
            type: string
            enum:
            - DeleteSpaceResponse
      example:
        type: DeleteSpaceResponse
        version: v1
        msgId: a1b2c3d4-e5f6-7890-abcd-000000000027
        code: 0
        message: success
        data: ''
    SpacesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SpaceNode'
            type:
              type: string
              enum:
              - GetSpacesResponse
      example:
        type: GetSpacesResponse
        version: v1
        msgId: a1b2c3d4-e5f6-7890-abcd-000000000005
        code: 0
        message: success
        data:
        - spaceId: space-home-001
          name: 我的家
          spatialMarking: home
          children:
          - spaceId: space-floor1-001
            parentSpaceId: space-home-001
            name: 一楼
            spatialMarking: floor
            children: []

    # ── Device ───────────────────────────────────────────────────
    DeviceType:
      type: object
      required: [deviceType, name]
      properties:
        deviceType:
          type: string
          description: 设备类型编码
        name:
          type: string
          description: 设备类型名称

    DeviceInfo:
      type: object
      required: [deviceId, deviceName, deviceTypesList, createTime, state]
      properties:
        protocolId:
          type: string
          description: 所属协议实例 ID，与 /devices/filter-options 的 protocols[].id 对应；未挂载实例时省略。用于关联实例，不是协议类型代码。
        networkProtocolMask:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          description: 所属协议实例类型的完整配置分类掩码，与筛选选项及查询参数沿用相同位定义，不是设备实时 NetworkProtocolSupport Trait 值。无所属实例、未配置掩码或仅补充响应时配置无效，均省略该字段；不以 0 表示未知，也不裁剪为查询命中的位。
        deviceId:
          type: string
          description: 业务设备 ID，与 protocol.device Resource 的 id 相同；不是 Network、Point、Job ID 或点工具的 instanceId。
        gatewayId:
          type: string
          nullable: true
          description: 所属网关 ID。
        deviceName:
          type: string
          description: 设备名称
        deviceTypesList:
          type: array
          items:
            type: string
          description: 设备类型列表
        createTime:
          type: integer
          format: int64
          description: 创建时间（毫秒级 UTC 时间戳）
        state:
          type: boolean
          description: 设备在线状态
        space:
          $ref: '#/components/schemas/DeviceSpace'

    DeviceSpace:
      type: object
      required:
      - spaceId
      - name
      properties:
        parentSpaceId:
          type: string
          nullable: true
          description: 父空间 ID；没有父空间时省略此字段。
        spaceId:
          type: string
          description: 空间 ID。
        name:
          type: string
          description: 空间名称。

    DeviceDefinition:
      type: object
      required:
      - deviceId
      - name
      - deviceTypesList
      - endpoints
      properties:
        deviceId:
          type: string
          description: 业务设备 ID，与 protocol.device Resource 的 id 相同；不是 Network、Point、Job ID 或点工具的 instanceId。
        gatewayId:
          type: string
          nullable: true
          description: |
            此设备所绑定的网关 ID。
            如果 `gatewayId` 等于 `deviceId`，表示这个设备自身是网关。
            如果 `gatewayId` 为 `null` 或空字符串，表示这个设备是不带子设备的直连网关或第三方接入设备。
        name:
          type: string
          description: 设备名称
        deviceTypesList:
          type: array
          items:
            type: string
          description: 设备类型列表
        endpoints:
          type: array
          description: 设备端点列表。
          items:
            $ref: '#/components/schemas/Endpoint'    
        capabilities:
          type: array
          items:
            type: string
          nullable: true
          description: 仅 includeCapabilities=true 时返回。
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: 仅 includeMetadata=true 时返回的用户 metadata。

    DeviceDefinitionsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceDefinition'
            type:
              type: string
              enum:
              - GetDevicesResponse
      example:
        type: GetDevicesResponse
        version: v1
        msgId: "17"
        code: 0
        message: success
        data:
          - deviceId: lumi3.86108040f2b03a4e
            name: Device-001
            gatewayId: lumi3.86108040f2b03a4e
            deviceTypesList: ["Hub"]
            endpoints:
              - endpointId: 1
                endpointName: Public
                deviceType: Public
                functions:
                  - functionCode: Identify
                    traits:
                      - traitCode: IdentifyType
                        parameter:
                          type: Enum
                          readable: true
                          writable: true
                          subscribable: true
                          supportedValues:
                            - key: None
                              value: 0
                            - key: Light
                              value: 1
                            - key: LEDIndicator
                              value: 2
                            - key: AudibleBeep
                              value: 3
                            - key: Display
                              value: 4
                            - key: Actuator
                              value: 5
                          unit: ""
                        value: 3
                        time: 0
                        pointName: Root - Identify Type
                        displayTags: ["3", "98"]
                    commands:
                      - commandCode: Identify
                        fields:
                          - fieldCode: IdentifyTime
                            parameter:
                              type: Integer
                              mandatory: false
                              min: 0
                              max: 86400
                              unit: S
                        description: Identify
                        pointName: Root - Identify
                        displayTags: ["1"]
              - endpointId: 2
                endpointName: Hub
                deviceType: Hub
                functions:
                  - functionCode: BridgeConfiguration
                    traits:
                      - traitCode: SupportedHubCapability
                        parameter:
                          type: Integer
                          readable: true
                          writable: false
                          subscribable: true
                          min: 0
                          max: 4294967295
                          unit: ""
                          step: 1
                        value: 103
                        time: 0
                        pointName: Hub - Supported Hub capability set
                        displayTags: ["98"]
                      - traitCode: BridgedNodeList
                        parameter:
                          type: List[X]
                          readable: true
                          writable: false
                          subscribable: true
                          unit: ""
                        value: ""
                        time: 0
                        pointName: Hub - Bridge Node List
                        displayTags: ["98"]
                    commands: []

    BatchDeviceCapabilitiesRequest:
      type: object
      additionalProperties: false
      required:
      - deviceIds
      anyOf:
      - required:
        - functionCodes
        properties:
          functionCodes:
            minItems: 1
      - required:
        - traitCodes
        properties:
          traitCodes:
            minItems: 1
      - required:
        - commandCodes
        properties:
          commandCodes:
            minItems: 1
      properties:
        deviceIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            pattern: \S
          description: 必填。按原始数组项数限制为 1～20 项，先校验数量再 trim、按首次出现顺序去重。重复项计入上限；空白 ID 拒绝。ID 作为不透明字符串，不按逗号拆分。
        deviceTypesList:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: 限制设备整体类型及 endpoint 类型；不能单独作为能力条件。 每项 trim 后不能为空；每个数组元素是一个完整编码，不按逗号拆分。
        deviceTypesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: 列表内匹配模式，接受大小写。
        functionCodes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: 匹配功能编码；与 traitCodes、commandCodes 至少提供一种非空列表。 每项 trim 后不能为空；每个数组元素是一个完整编码，不按逗号拆分。
        functionCodesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: 列表内匹配模式，接受大小写。
        traitCodes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: 匹配 trait 编码，返回定义及可取得的当前值。 每项 trim 后不能为空；每个数组元素是一个完整编码，不按逗号拆分。
        traitCodesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: 列表内匹配模式，接受大小写；trait/command 的 and 要求同一个 function 内满足全部编码。
        commandCodes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: 匹配 command 编码，只返回命令及字段定义，不含当前值。 每项 trim 后不能为空；每个数组元素是一个完整编码，不按逗号拆分。
        commandCodesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: 列表内匹配模式，接受大小写；trait/command 的 and 要求同一个 function 内满足全部编码。
        displayTags:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: 按 GET 相同规则筛选展示标签。 每项 trim 后不能为空；每个数组元素是一个完整编码，不按逗号拆分。
        displayTagsMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: 列表内匹配模式，接受大小写。
    BatchDeviceCapabilitiesResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        required:
        - data
        properties:
          type:
            type: string
            enum:
            - BatchDeviceCapabilitiesResponse
          data:
            type: array
            maxItems: 20
            items:
              $ref: '#/components/schemas/DeviceDefinition'
      example:
        type: BatchDeviceCapabilitiesResponse
        version: v1
        msgId: batch-example
        code: 0
        message: success
        data:
        - deviceId: device-a
          name: 示例灯 a
          deviceTypesList:
          - light
          endpoints:
          - endpointId: 2
            endpointName: 主灯
            deviceType: light
            functions:
            - functionCode: OnOff
              traits:
              - traitCode: OnOff
                parameter:
                  type: Bool
                  readable: true
                  writable: true
                  subscribable: true
                value: false
                displayTags: []
              commands: []
        - deviceId: device-b
          name: 示例灯 b
          deviceTypesList:
          - light
          endpoints:
          - endpointId: 2
            endpointName: 主灯
            deviceType: light
            functions:
            - functionCode: OnOff
              traits:
              - traitCode: OnOff
                parameter:
                  type: Bool
                  readable: true
                  writable: true
                  subscribable: true
                value: true
                displayTags: []
              commands: []

    GetMatchedDeviceCapabilitiesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceDefinition'
              nullable: true
            type:
              type: string
              enum:
              - GetMatchedDeviceCapabilitiesResponse
      example:
        type: GetMatchedDeviceCapabilitiesResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000009"
        code: 0
        message: success
        data:
          deviceId: "device-001"
          gatewayId: "gateway-001"
          name: "客厅灯"
          deviceTypesList: ["light"]
          endpoints:
            - endpointId: 1
              endpointName: "主灯"
              deviceType: "light"
              functions:
                - functionCode: "ColorControl"
                  traits:
                    - traitCode: "ColorTemperature"
                      parameter:
                        type: "Integer"
                        min: 153
                        max: 500
                        supportedValues: null
                        unit: "mireds"
                        step: 1
                        readable: true
                        writable: true
                        subscribable: true
                      value: 300
                      time: 1710001234567
                  commands:
                    - commandCode: "MoveToXYColor"
                      fields:
                        - fieldCode: "ColorX"
                          parameter:
                            type: "Float"
                            min: 0
                            max: 1
                            supportedValues: null
                            unit: null
                            step: 0.001
                            mandatory: true

    DeleteDevicePointRequest:
      type: object
      required: [deviceId, endpointId, functionCode]
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type: integer
          minimum: 0
          description: 端点 ID。
        functionCode:
          type: string
          description: 功能编码。

    DeleteDevicePointResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: 删除成功后返回空字符串。
              example: ""
            type:
              type: string
              enum:
              - DeleteDeviceObjectResponse
      example:
