          functionCode: NetworkCommissioning
          commandCode: TriggerZigbeeNetworkInfoUpload
          code: 0
          message: success
          responded: true
          commandReportValue: '{"result":"ok"}'
          responseTime: 1710001234567

    # ── Gateway ──────────────────────────────────────────────────
    GatewayInfo:
      type: object
      required: [deviceId, deviceName]
      properties:
        deviceId:
          type: string
          description: 网关设备 ID。
        deviceName:
          type: string
          description: 网关设备名称。
        supportZigbee:
          type: boolean
          description: 是否支持 Zigbee，缺省或 null 为不支持。
        supportedMatterRoles:
          type: integer
          description: |
            支持的 Matter 角色，缺少或 null 为不支持。该字段为位掩码，使用 `supportedMatterRoles & 角色值 != 0` 判断是否支持对应角色：
            - 1：Matter controller
            - 2：Matter commissioner
            - 4：Thread border router
            - 8：Matter bridge
            例如 `supportedMatterRoles & 2 != 0` 表示支持 Matter 子设备入网。
          nullable: true
        space:
          $ref: '#/components/schemas/DeviceSpace'
          nullable: true
          description: 网关所在空间。

    GatewaysResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/GatewayInfo'
            type:
              type: string
              enum:
              - GetGatewaysResponse
      example:
        type: GetGatewaysResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-00000000000e"
        code: 0
        message: success
        data:
          - deviceId: "gateway-001"
            deviceName: "客厅网关M2"
            supportZigbee: true
            supportedMatterRoles: 1

    # ── Subdevice Join ────────────────────────────────────────────
    SubdeviceJoinRequest:
      type: object
      required: [gatewayId, commandCode]
      properties:
        gatewayId:
          type: string
          description: 网关设备 ID。
        commandCode:
          type: string
          enum:
            - APIEnableSubdeviceJoining
          description: |
            入网命令编码：
            - `APIEnableSubdeviceJoining`: 标准 Zigbee 设备入网（例如通过按键触发入网模式）。
        data:
          type: object
          description: |
            入网参数（JSON 对象），根据不同的 commandCode，需传入的参数说明如下：
            - `APIEnableSubdeviceJoining`: 无需传入此字段。

    SubdeviceJoinResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
      example:
        type: SubdeviceJoinResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000011"
        code: 0
        message: success

    SubdeviceJoinStopRequest:
      type: object
      required: [gatewayId]
      properties:
        gatewayId:
          type: string
          description: 网关设备 ID。

    # ── 设备绑定结果 ────────────────────────────────────────
    GatewaySubdeviceDidFilter:
      type: object
      required: [gatewayId]
      properties:
        gatewayId:
          type: string
          description: 网关设备 ID。
        subDeviceIds:
          type: array
          nullable: true
          description: |
            子设备 ID 列表。允许为空或不传：
            - 为空或不传：查询指定网关下的全部子设备（仅按 gatewayId 过滤）
            - 非空：查询指定网关下的指定子设备（按 gatewayId + subDeviceIds 过滤）
          items:
            type: string

    DeviceBindResultRequest:
      type: object
      required: [gatewaySubdeviceFilters]
      properties:
        protocols:
          type: array
          nullable: true
          description: 指定待查询的子设备协议类型。不传时，表示不限制协议类型。
          items:
            type: string
            enum: [zigbee, matter]
        gatewaySubdeviceFilters:
          type: array
          description: gatewayId 与子设备 ID 组合的过滤条件（必填）
          items:
            $ref: '#/components/schemas/GatewaySubdeviceDidFilter'
        bindTime:
          type: integer
          format: int64
          nullable: true
          description: 入网结果查询的绑定时间，单位毫秒。

    DeviceBindResultItem:
      type: object
      required: [deviceId, protocols, gatewayId, bindTime]
      properties:
        deviceId:
          type: string
          description: 子设备 ID。
        deviceName:
          type: string
          nullable: true
          description: 子设备名称。
        space:
          $ref: '#/components/schemas/DeviceSpace'
          nullable: true
          description: 子设备所在空间。
        protocols:
          type: array
          items:
            type: string
            enum: [zigbee, matter]
          description: 入网协议集合。
        gatewayId:
          type: string
          description: 所属网关 ID。
        code:
          type: integer
          nullable: true
          description: 错误码（失败时返回）。
        message:
          type: string
          nullable: true
          description: 错误信息（失败时返回）。
        bindTime:
          type: integer
          format: int64
          description: 绑定/入网时间戳（毫秒级 UTC 时间戳）。

    DeviceBindResultResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceBindResultItem'
            type:
              type: string
              enum:
              - DeviceBindResultResponse
      example:
        type: DeviceBindResultResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000017"
        code: 0
        message: success
        data:
          - deviceId: "subdevice-001"
            deviceName: "卧室温度传感器"
            protocols: [zigbee]
            gatewayId: "gateway-001"
            code: 0
            message: null
            bindTime: 1710001235000

    DeviceTypesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/DeviceType'
            type:
              type: string
              enum:
              - GetDeviceTypeInfosResponse
      example:
        type: GetDeviceTypeInfosResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000006"
        code: 0
        message: success
        data:
          - deviceType: "light"
            name: "灯"
          - deviceType: "switch"
            name: "开关"

    DeviceProtocolOption:
      type: object
      required:
        - id
        - name
        - type
        - networkProtocolMask
      properties:
        id:
          type: string
          description: 稳定的协议实例 ID，可直接传给 /devices 的 protocolIds；实例重命名不改变 ID。
        name:
          type: string
          description: 用户设置的实例显示名称，保持原样，不自动翻译；可传给 protocolNames 完整匹配。
        type:
          type: string
          nullable: true
          description: 稳定的公开类型代码，使用小写，不做多语言翻译；未配置映射时显式为 null。可传给 protocolTypes 查询同类型的所有实例。
          example: homeassistant
        networkProtocolMask:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          maximum: 4294967295
          description: 可选的协议分类关联，未配置时显式为 null。沿用 NetworkProtocolSupport（20870）位定义；默认 Matter→Thread(2)、Zigbee→8、Aqara RS485→32。不是设备实时 Trait 值。可直接传给
            /devices 的 networkProtocolMask，多个分类按位 OR 合并。
          example: 2
    DeviceFilterOptionsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - DeviceFilterOptionsResponse
            data:
              type: object
              description: 仅包含请求的选项类别；当前仅支持 protocols。
              properties:
                protocols:
                  type: array
                  items:
                    $ref: '#/components/schemas/DeviceProtocolOption'

    DevicesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceListData'
            type:
              type: string
              enum:
              - GetDeviceInfoResponse
      example:
        type: GetDeviceInfoResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000007"
        code: 0
        message: success
        data:
          totalCount: 3
          pageNum: 1
          pageSize: 200
          data:
            - deviceId: "device-001"
              gatewayId: "gateway-001"
              protocolId: "1004"
              networkProtocolMask: 8
              deviceName: "客厅灯"
              deviceTypesList: ["light"]
              createTime: 1710001234567
              state: true
              space:
                parentSpaceId: "space-home-001"
                spaceId: "space-room-001"
                name: "客厅"

    DeviceListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: 满足条件的设备总数
          example: 3
        pageNum:
          type: integer
          description: 当前页码
          example: 1
        pageSize:
          type: integer
          description: 当前页大小
          example: 200
        data:
          type: array
          description: 当前页设备列表
          items:
            $ref: '#/components/schemas/DeviceInfo'

    # ── Firmware ───────────────────────────────────────────────────
    SearchUpgradableFirmwareByDeviceIdsRequest:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SearchUpgradableFirmwareByDeviceIdsRequestData'

    SearchUpgradableFirmwareByDeviceIdsRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: 设备 ID 列表，最少 1 个、最多 200 个，且去重。
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
        includeDeviceTypes:
          type: array
          description: 包含的设备类型列表。为空时按缺省处理（不做白名单过滤）。
          uniqueItems: true
          items:
            type: string
        excludeDeviceTypes:
          type: array
          description: 不包含的设备类型列表。为空时按缺省处理（不做黑名单过滤）。`excludeDeviceTypes` 优先级高于 `includeDeviceTypes`。
          uniqueItems: true
          items:
            type: string

    UpgradeFirmwareDevice:
      type: object
      required: [did, firmware]
      properties:
        did:
          type: string
          description: 目标设备 ID

    UpgradeFirmwareRequestData:
      type: array
      minItems: 1
      maxItems: 1
      description: upgrade_handler 流程每次处理一个设备
      items:
        $ref: '#/components/schemas/UpgradeFirmwareDevice'

    UpgradeFirmwareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              description: 升级请求结果。
              additionalProperties: false
            code:
              type: integer
              description: 请求结果码，0 表示升级请求已受理。
            type:
              type: string
              enum:
              - UpgradeFirmwareResponse
      example:
        type: UpgradeFirmwareResponse
        version: v1
        msgId: "3"
        code: 0
        message: success
        data: {}

    DevicePointHistoryQueryRequest:
      type: object
      properties:
        deviceIds:
          type: array
          description: 设备 ID 列表，最多 200 个；省略或空数组时查询当前请求上下文可访问的全部当前设备。
          maxItems: 200
          default: []
          items:
            type: string
        traitCodes:
          type: array
          description: |
            Trait（功能点）code 列表，最多支持 200 个。

            <ul><li>若未传递或传递空数组，则查询目标设备的所有开放 traitCode。</li><li>若传递了本参数，无法识别的 code 会被忽略；如全部 code 都无法识别为 trait，则响应返回参数错误。</li></ul>
       
          maxItems: 200
          default: []
          items:
            type: string
        startTime:
          type: integer
          format: int64
          minimum: 0
          description: |
            查询的起始时间，Unix 毫秒时间戳，包含该时间点。

            <ul><li>若未填写 <code>startTime</code> 和 <code>endTime</code>，默认查询最近 7 天的数据。</li><li>如仅填写其中一个参数，另一个将以 7 天为时间窗口自动推算补全。</li><li>cursor 分页时，需固定传递首次响应中的 <code>data.startTime</code> 和 <code>data.endTime</code>，保证数据连续一致。</li></ul>
        endTime:
          type: integer
          format: int64
          minimum: 0
          description: |
            查询的结束时间，Unix 毫秒时间戳，不包含该时间点。必须大于 <code>startTime</code>，最大区间长度为 7 天。

            其他规则与 <code>startTime</code> 相同。
     
        descending:
          type: boolean
          default: true
          description: |
            是否按时间倒序。分页请求时，必须保证 <code>descending</code> 参数与首次请求一致。
            
            <ul><li><code>true</code>：是，按时间倒序。</li><li><code>false</code>：否，按时间正序。</li></ul>
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: 每页最大记录数，取值范围 [1, 200]。查询下一页时可调整；原样重试最近一次续页请求时必须保持相同大小。
        cursor:
          type: string
          nullable: true
          description: |
            上一页返回的 nextCursor。<ul><li>首次请求无需传递；如需获取下一页数据，请传递上一次响应中的 nextCursor。</li><li>分页请求时，必须保证 <code>deviceIds</code>、<code>traitCodes</code>、<code>startTime</code>、<code>endTime</code> 和 <code>descending</code> 参数与首次请求一致。</li><li>首次查询、轮询最新变化或游标失效后重新查询时，可省略此字段。</li></ul>

    DevicePointHistoryItem:
      type: object
      required:
      - deviceId
      - value
      - unit
      - time
      - triggerPath
      properties:
        deviceId:
          type: string
          description: 历史记录所属设备 ID。
        deviceName:
          type: string
          nullable: true
          description: 当前设备名称；设备已删除或无法解析时省略。
        endpointId:
          type: integer
          format: int32
          nullable: true
          description: 当前点位 endpoint ID；点位已删除或重标记时省略。
        functionCode:
          type: string
          nullable: true
          description: 当前点位 function 对应的 Spec code；无法解析时省略。
        traitCode:
          type: string
          nullable: true
          description: 历史 trait 对应的 Spec code；无法解析时省略。
        value:
          description: 类型化 JSON 标量；数值、布尔值、枚举序号或字符串。NaN 和正负 Infinity 返回 null。
          oneOf:
          - type: number
          - type: boolean
          - type: string
            nullable: true
        valueName:
          type: string
          nullable: true
          description: Boolean 或枚举值对应的 trait 业务显示文本；无匹配或无翻译时省略。
        pointName:
          type: string
          nullable: true
          description: 当前点位名称；无法解析时省略。
        triggerName:
          type: string
          nullable: true
          description: 当前触发节点名称；无法解析时省略。
        unit:
          type: string
          description: 历史记录单位。
        time:
          type: integer
          format: int64
          description: 历史记录时间，Unix 毫秒时间戳。
        triggerPath:
          type: string
          default: ''
          description: 历史触发路径；无法提供时为空字符串。

    DevicePointHistoryQueryData:
      type: object
