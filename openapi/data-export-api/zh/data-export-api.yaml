          today: 0.112
          yesterday: 2.221
          week: 5.222
          month: 9.221
          year: 230.229

    EmsDevicesSummaryResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/EmsSummaryData'
            type:
              type: string
              enum:
              - EmsDevicesSummaryResponse
      example:
        type: EmsDevicesSummaryResponse
        version: v1
        msgId: "2df2f431-a58d-4fdb-b39c-4f0d29e7f010"
        code: 0
        message: success
        data:
          today: 0.112
          yesterday: 2.221
          week: 5.222
          month: 9.221
          year: 230.229

    AutomationDslMetadata:
      type: object
      description: 元数据结构，用于定义自动化的基本信息和变量。
      properties:
        name:
          type: string
          description: 配置展示名；自动化创建可从此值回退。场景名必须由请求顶层 name 提供。
        description:
          type: string
          description: 自动化的描述。
        scope:
          type: array
          description: 定义设备的属性值变量，可在整个脚本中引用。
          items:
            $ref: '#/components/schemas/AutomationDslScopeDeviceProperty'
        variables:
          type: array
          description: 定义 Flow 局部变量，可被 variable.flow 引用。每项的 value 是创建时的初值字面量，不是当前运行值，也不会在每次触发时重置。
          items:
            $ref: '#/components/schemas/AutomationDslFlowVariable'
      additionalProperties: false

    AutomationDslScopeDeviceProperty:
      type: object
      description: 在 scope 中定义的设备属性变量。
      required:
      - type
      - name
      - deviceId
      - endpointId
      - functionCode
      - traitCode
      properties:
        type:
          type: string
          description: 值固定为 `device.property`。
          enum:
          - device.property
        name:
          type: string
          description: 变量名称，在 scope 中定义时必须添加。
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type: integer
          description: 端点 ID。
        functionCode:
          type: string
          description: 功能代码（如 OnOff、LevelControl）。
        traitCode:
          type: string
          description: 功能点代码（如 OnOff、CurrentLevel）。
        valuePath:
          type: string
          minLength: 1
          default: $
          description: 结构体叶子的规范单值路径；标量和根值使用 $。
      additionalProperties: false

    AutomationDslFlowVariable:
      type: object
      description: Flow 局部变量声明。这里的 value 是创建时的初值字面量，不是当前运行值，也不会在每次触发时重置。动作和比较里同名的 value 可以是值表达式，两者含义不同。省略时不显式配置初值。
      required:
      - name
      - type
      properties:
        name:
          type: string
          minLength: 1
          description: 变量名称。
        type:
          type: string
          description: 变量类型。
          enum:
          - boolean
          - number
          - string
          - enum
        value:
          description: 创建时的初值字面量，不是当前运行值，也不会在每次触发时重置。必须匹配 type：boolean 使用布尔值，number 使用数字，string/enum 使用字符串。不接受 null、数组、对象或引用表达式。与动作、比较中可作为值表达式的 value 含义不同。建议显式填写。
          anyOf:
          - type: boolean
          - type: number
          - type: string
      additionalProperties: false
      oneOf:
      - properties:
          type:
            enum:
            - boolean
          value:
            type: boolean
      - properties:
          type:
            enum:
            - number
          value:
            type: number
      - properties:
          type:
            enum:
            - string
            - enum
          value:
            type: string

    AutomationDslDeviceProperty:
      type: object
      description: 直接引用设备的特定属性。
      required:
      - type
      - deviceId
      - endpointId
      - functionCode
      - traitCode
      properties:
        type:
          type: string
          description: 固定值 device.property。
          enum:
          - device.property
        name:
          type: string
          description: 兼容旧直接属性引用的可选标签，不参与设备定位，也不声明 scope 变量；规范回读可以省略。
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type: integer
          description: 端点 ID。
        functionCode:
          type: string
          description: 功能代码（如 OnOff、LevelControl）。
        traitCode:
          type: string
          description: 特性代码（如 OnOff、CurrentLevel）。
        valuePath:
          type: string
          minLength: 1
          default: $
          description: 结构体叶子的规范单值路径；标量和根值使用 $。
      additionalProperties: false

    AutomationDslDataRef:
      type: object
      description: 引用在 metadata.scope 中定义的变量。
      required:
      - type
      - select
      properties:
        type:
          type: string
          description: 固定值 data.ref。
          enum:
          - data.ref
        from:
          type: string
          description: 目标路径，固定值 /metadata/scope，默认可不加。
          enum:
          - /metadata/scope
        select:
          $ref: '#/components/schemas/AutomationDslSelectExpression'
      additionalProperties: false

    AutomationDslSelectExpression:
      type: object
      description: 选择表达式，用于指定要引用的变量。
      required:
      - value
      properties:
        by:
          type: string
          description: 选择方式，固定值 name。
          enum:
          - name
        value:
          type: string
          description: 要引用的变量名。不是 metadata.variables[].value 那种创建初值，也不是动作、比较里的值表达式。
      additionalProperties: false

    AutomationDslDatasource:
      description: 数据源，用于引用设备属性或变量
      oneOf:
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslDataRef'

    AutomationDslComparisonValue:
      description: 比较用的值，可以是字面量或值表达式。与 metadata.variables[].value 的创建初值字面量不是同一含义。
      oneOf:
      - type: boolean
        description: 布尔字面量。
      - type: number
        description: 数值字面量。
      - type: string
        description: 字符串字面量。
      - $ref: '#/components/schemas/AutomationDslDataRef'
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslFlowVariableRef'
      - $ref: '#/components/schemas/AutomationDslGlobalVariableRef'
      - $ref: '#/components/schemas/AutomationDslContextRef'
      - $ref: '#/components/schemas/AutomationDslNodeOutputRef'

    AutomationDslDuration:
      type: string
      description: 时间长度，至少含一个单位，如 30sec、5min、1hour、1hour10min20sec、250ms。空字符串无效。
      pattern: ^(\d+hour)?(\d+min)?(\d+sec)?(\d+ms)?$
      minLength: 1

    AutomationDslTime:
      type: string
      description: 时间点，支持24小时格式(HH:mm)、AM/PM格式(h:mm am/pm)、太阳时间(sunrise/sunset±偏移)。

    AutomationDslCron:
      type: string
      description: Cron表达式，格式：秒 分 时 日 月 周 年。

    AutomationDslAutomation:
      type: object
      description: 单个自动化定义。
      required:
      - starters
      - actions
      properties:
        starters:
          type: array
          description: 触发器列表（至少一个）。
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslStarter'
        condition:
          $ref: '#/components/schemas/AutomationDslCondition'
        actions:
          type: array
          description: 动作列表（至少一个）
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAction'
        conditions:
          type: array
          description: 多棵条件根。与 condition 互斥；每一项用 linkFrom 写明入边。
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        name:
          type: string
          description: 兼容旧规则标签，可与 metadata.name 不同；自动化展示名由 metadata.name 或创建请求 name 决定
          nullable: true
      additionalProperties: false
      allOf:
      - not:
          required:
          - condition
          - conditions

    AutomationDslLinkFrom:
      type: object
      required:
      - node
      - port
      description: 从源节点输出端口连到当前节点。省略 toPort 时目标端口为 in。
      properties:
        node:
          type: string
          minLength: 1
        port:
          type: string
          enum:
          - out
          - 'true'
          - 'false'
          - error
        toPort:
          type: string
          minLength: 1
      additionalProperties: false

    AutomationDslStarter:
      description: 触发器，定义触发自动化的条件。
      oneOf:
      - $ref: '#/components/schemas/AutomationDslPropertyEvent'
      - $ref: '#/components/schemas/AutomationDslTimeSchedule'
      - $ref: '#/components/schemas/AutomationDslAlarmEvent'
      - $ref: '#/components/schemas/AutomationDslServiceEvent'
      - $ref: '#/components/schemas/AutomationDslTimeFixed'
      - $ref: '#/components/schemas/AutomationDslTimeInterval'
      - $ref: '#/components/schemas/AutomationDslVariableChange'
      - $ref: '#/components/schemas/AutomationDslSustain'

    AutomationDslPropertyEvent:
      type: object
      description: 设备属性变化时触发。不写比较符表示任意变化都触发。for 是比较成立后持续满该时长才触发一次，失效后重新计时。suppressFor 是触发之后不再触发的时间。rising 和 falling 表示穿过比较值，不能与 for 或其他比较符同时出现。
      required:
      - type
      - source
      properties:
        type:
          type: string
          description: 固定值 property.event
          enum:
          - property.event
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDatasource'
          description: 监听的设备属性数据源。
        is:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 变成该值时触发。与其他比较符互斥。
        isNot:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 变成不是该值时触发。与其他比较符互斥。
        greaterThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 变成大于该值时触发。与其他比较符互斥。
        greaterThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 变成大于等于该值时触发。与其他比较符互斥。
        lessThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 变成小于该值时触发。与其他比较符互斥。
        lessThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 变成小于等于该值时触发。与其他比较符互斥。
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: 属性变成比较结果后，保持该结果满这段时间才触发一次。这是触发前的稳住时间。判断当前值是否已经持续，用 property.state 的 for。启动时不读当前值，用 sustain。
        suppressFor:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: 一次触发之后，在该时长内不再触发。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        rising:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 数值向上穿过该值时触发。不能与 for 或其他比较符同时使用。
        falling:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 数值向下穿过该值时触发。不能与 for 或其他比较符同时使用。
      additionalProperties: false
      not:
        anyOf:
        - required:
          - is
          - isNot
        - required:
          - is
          - greaterThan
        - required:
          - is
          - greaterThanOrEqualTo
        - required:
          - is
          - lessThan
        - required:
          - is
          - lessThanOrEqualTo
        - required:
          - is
          - rising
        - required:
          - is
          - falling
        - required:
          - isNot
          - greaterThan
        - required:
          - isNot
          - greaterThanOrEqualTo
        - required:
          - isNot
          - lessThan
        - required:
          - isNot
          - lessThanOrEqualTo
        - required:
          - isNot
          - rising
        - required:
          - isNot
          - falling
        - required:
          - greaterThan
          - greaterThanOrEqualTo
        - required:
          - greaterThan
          - lessThan
        - required:
          - greaterThan
          - lessThanOrEqualTo
        - required:
          - greaterThan
          - rising
        - required:
          - greaterThan
          - falling
        - required:
          - greaterThanOrEqualTo
          - lessThan
        - required:
          - greaterThanOrEqualTo
          - lessThanOrEqualTo
        - required:
          - greaterThanOrEqualTo
          - rising
        - required:
          - greaterThanOrEqualTo
          - falling
        - required:
          - lessThan
          - lessThanOrEqualTo
        - required:
          - lessThan
          - rising
        - required:
          - lessThan
          - falling
        - required:
          - lessThanOrEqualTo
          - rising
        - required:
          - lessThanOrEqualTo
          - falling
        - required:
          - rising
          - falling
        - required:
          - rising
          - for
        - required:
          - falling
          - for

    AutomationDslTimeSchedule:
      type: object
      description: 定时触发。cron 与 at 只能有一个，均使用站点时区，不接受 timezone 参数。repeatDays 和 location 只用于 at，location 只参与 sunrise 和 sunset。
      required:
      - type
      properties:
        type:
          type: string
          description: 固定值 time.schedule。
          enum:
          - time.schedule
        cron:
          allOf:
          - $ref: '#/components/schemas/AutomationDslCron'
          description: Cron 表达式，格式为秒 分 时 日 月 周 年。使用站点时区，与 at 互斥。
        at:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: 一天中的时间点，使用站点时区，与 cron 互斥。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        repeatDays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          minItems: 1
          uniqueItems: true
          description: 1 表示周一，7 表示周日。只用于 at，省略表示每天。不能与 cron 同时出现。
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: 日出日落计算用的经纬度。只用于 at 里的 sunrise 或 sunset。
      additionalProperties: false
      oneOf:
      - required:
        - cron
      - required:
        - at
      allOf:
      - allOf:
        - anyOf:
          - not:
              required:
              - cron
          - not:
              anyOf:
              - required:
                - repeatDays
              - required:
                - location

    AutomationDslAlarmEvent:
      type: object
      description: 告警进入指定状态时触发。alarmId 使用已有告警规则引用，不要用自动化 id 猜测。保存时不核对该引用是否存在；启动时找不到目标，这条触发不会发生。
      required:
      - type
      - alarmId
      - alarmState
      properties:
        type:
          type: string
          enum:
          - event.alarm
        alarmId:
          type: string
          minLength: 1
          description: 已有告警规则引用。
        alarmState:
          type: string
          enum:
          - active_unacked
          - active_acked
          - normal_unacked
          - normal_acked
          description: 进入该状态时触发。active_unacked 触发未确认，active_acked 触发已确认，normal_unacked 恢复未确认，normal_acked 恢复已确认。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslServiceEvent:
      type: object
      description: 外部事件或服务节点事件。serviceId 省略或为 externalEventService 时监听外部事件；其他值按内部服务节点解析，eventName 是该节点的事件属性名。保存时不核对该引用是否存在；启动时找不到目标，这条触发不会发生。
      required:
      - type
      - eventName
      properties:
        type:
          type: string
          enum:
          - event.service_call
        serviceId:
          type: string
          description: 省略或 externalEventService 表示外部事件。其他值是内部服务节点引用。
        eventName:
          type: string
          minLength: 1
          description: 事件名。内部服务节点上它是事件属性名。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslCondition:
      description: 条件，定义执行动作前需要满足的条件。
      oneOf:
      - $ref: '#/components/schemas/AutomationDslAndCondition'
      - $ref: '#/components/schemas/AutomationDslOrCondition'
      - $ref: '#/components/schemas/AutomationDslNotCondition'
      - $ref: '#/components/schemas/AutomationDslPropertyState'
      - $ref: '#/components/schemas/AutomationDslTimeBetween'
      - $ref: '#/components/schemas/AutomationDslXorCondition'
      - $ref: '#/components/schemas/AutomationDslTimeRangeFixed'
      - $ref: '#/components/schemas/AutomationDslFlowState'
      - $ref: '#/components/schemas/AutomationDslCompare'
      - $ref: '#/components/schemas/AutomationDslTriggerValueCondition'

    AutomationDslAndCondition:
      type: object
      description: 全部子条件都成立。至少两个子条件。
      required:
      - type
      - conditions
      properties:
        type:
          type: string
          description: 固定值 and。
          enum:
          - and
        conditions:
          type: array
          description: 子条件列表（至少两个）。
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按所在数组的位置接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslOrCondition:
      type: object
      description: 任一子条件成立。至少两个子条件。
      required:
      - type
      - conditions
      properties:
        type:
          type: string
          description: 固定值 or
          enum:
          - or
        conditions:
          type: array
          description: 子条件列表（至少两个）
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按所在数组的位置接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslNotCondition:
      type: object
      description: 子条件不成立。
      required:
      - type
      - condition
      properties:
        type:
          type: string
          description: 固定值 not
          enum:
          - not
        condition:
          allOf:
          - $ref: '#/components/schemas/AutomationDslCondition'
          description: 要取反的条件。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按所在数组的位置接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslPropertyState:
      type: object
      description: 检查属性当前值。必须且只能写一个比较符。for 表示该比较已经持续的时长。rising 和 falling 表示穿过比较值，不能与 for 同时使用。
      required:
      - type
      - source
      properties:
        type:
          type: string
          description: 固定值 property.state。
          enum:
          - property.state
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDatasource'
          description: 要检查的设备属性数据源。
        is:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 当前值等于该值。
        isNot:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 当前值不等于该值。
        greaterThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 当前值大于该值。
        greaterThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 当前值大于等于该值。
        lessThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 当前值小于该值。
        lessThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 当前值小于等于该值。
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: 检查时，这个比较必须已经持续满这段时间。它不发起触发。等一次变化稳住，用 property.event 的 for。启动时不读当前值，用 sustain。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略表示按位置接线；空数组表示该节点游离。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        rising:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 数值向上穿过该值。不能与 for 或其他比较符同时使用。
        falling:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: 数值向下穿过该值。不能与 for 或其他比较符同时使用。
      additionalProperties: false
      allOf:
      - oneOf:
        - required:
          - is
        - required:
          - isNot
        - required:
          - greaterThan
        - required:
          - greaterThanOrEqualTo
        - required:
          - lessThan
        - required:
          - lessThanOrEqualTo
        - required:
          - rising
        - required:
          - falling
      - not:
          anyOf:
          - required:
            - rising
            - for
          - required:
            - falling
            - for

    AutomationDslTimeBetween:
      type: object
      description: 当前时间是否在 after 与 before 之间。after 晚于 before 时表示跨午夜。repeatDays 省略表示每天。location 只用于 sunrise 和 sunset。
      required:
      - type
      - after
      - before
      properties:
        type:
          type: string
          description: 固定值 time.between
          enum:
          - time.between
        after:
          type: string
          description: 窗口开始时间。
        before:
          type: string
          description: 窗口结束时间。早于 after 时窗口跨午夜。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配
        linkFrom:
          type: array
          description: 入边。省略表示按位置接线；空数组表示该节点游离
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        repeatDays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          minItems: 1
          uniqueItems: true
          description: 1 表示周一，7 表示周日。省略表示每天。
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: 日出日落计算用的经纬度。
      additionalProperties: false

    AutomationDslEventStateHold:
      type: object
      required:
      - type
      - target
      - holdMs
      properties:
        type:
          enum:
          - action.event_state_hold
          type: string
        target:
          allOf:
          - $ref: '#/components/schemas/AutomationDslAssignmentTarget'
          description: 流程或全局布尔变量，或可写的布尔设备属性。
        holdMs:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: true
      description: 事件状态保持：每次事件将布尔变量设为 true 并续期，最后一次事件后经过 holdMs 毫秒设为 false。输入完成立即走 out；超时只修改变量。启动清为 false，停止取消并清除活动状态。

    AutomationDslTriggerValueSource:
      type: object
      description: 事件触发值的根设备点及结构体叶子地址。
      required:
      - deviceId
      - resourceId
      - valuePath
      properties:
        deviceId:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
        valuePath:
          type: string
          minLength: 1
          description: 规范单值路径；根值使用 $。
      additionalProperties: true

    AutomationDslTriggerValueExpression:
      type: object
      description: 只读地引用本次 Flow 执行入口的事件快照值。
      required:
      - type
      - eventNodeId
      - source
      - valueType
      properties:
        type:
          type: string
          enum:
          - variable.trigger
        eventNodeId:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/AutomationDslTriggerValueSource'
        unit:
          type: string
          description: 配置时的单位快照，用于后续单位迁移。
        unitId:
          type: string
          description: 配置时的 Studio 单位唯一标识，用于稳定识别单位。
        valueType:
          type: string
          enum:
          - boolean
          - number
          - string
          - enum
      additionalProperties: true

    AutomationDslTriggerValueCondition:
      type: object
      description: 比较本次执行入口的事件快照值；不会读取设备当前状态。
      required:
      - type
      - source
      - op
      - value
      properties:
        type:
          type: string
          enum:
          - condition.trigger_value
        source:
          $ref: '#/components/schemas/AutomationDslTriggerValueExpression'
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
        value:
          $ref: '#/components/schemas/AutomationDslValueExpression'
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: true

    AutomationDslAction:
      description: 动作，定义自动化触发后要执行的操作
      oneOf:
      - $ref: '#/components/schemas/AutomationDslTraitWrite'
      - $ref: '#/components/schemas/AutomationDslCommandCall'
      - $ref: '#/components/schemas/AutomationDslDelay'
      - $ref: '#/components/schemas/AutomationDslSceneExecute'
      - $ref: '#/components/schemas/AutomationDslVariableSet'
      - $ref: '#/components/schemas/AutomationDslScriptRun'
      - $ref: '#/components/schemas/AutomationDslFlowManage'
      - $ref: '#/components/schemas/AutomationDslLoopManage'
      - $ref: '#/components/schemas/AutomationDslMathAction'
      - $ref: '#/components/schemas/AutomationDslStringConcatAction'
      - $ref: '#/components/schemas/AutomationDslStringSubstringAction'
      - $ref: '#/components/schemas/AutomationDslStringAssignAction'
      - $ref: '#/components/schemas/AutomationDslStringCaseAction'
      - $ref: '#/components/schemas/AutomationDslAggregateAction'
      - $ref: '#/components/schemas/AutomationDslVariableToggle'
      - $ref: '#/components/schemas/AutomationDslMessagePush'
      - $ref: '#/components/schemas/AutomationDslDeviceBatch'
      - $ref: '#/components/schemas/AutomationDslEventStateHold'

    AutomationDslTraitWrite:
      type: object
      description: 写入设备属性。value 只能是布尔、数字或字符串。字符串 toggle 只对布尔属性取反，写到其他类型时按普通字符串处理。
      required:
      - type
      - functionCode
      - traitCode
      - targets
      - value
      properties:
        type:
          type: string
          description: 固定值 device.trait.write。
          enum:
          - device.trait.write
        functionCode:
          type: string
          description: 功能码。
        traitCode:
          type: string
          description: 属性代码。
        targets:
          type: array
          description: 要写入的设备和端点。
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslEndpointInfo'
        value:
          description: 本次要写入设备的标量。只接受布尔、数字或字符串，不接受值表达式。布尔属性上的字符串 toggle 表示对当前值取反。与变量声明里的创建初值不是同一含义。
          oneOf:
          - type: boolean
          - type: number
          - type: string
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        executionMode:
          type: string
          enum:
          - batch
          - null
          description: 旧 batch toggle 回读的兼容标记。编辑时保留 batch，保存后仍为一个批量节点；省略时使用默认设备动作分流。
          nullable: true
      additionalProperties: false

    AutomationDslEndpointInfo:
      type: object
      description: 端点信息。
      required:
      - deviceId
      - endpointIds
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        endpointIds:
          type: array
          description: 设备功能点 ID 列表。
          minItems: 1
          items:
            type: integer
      additionalProperties: false

    AutomationDslCommandCall:
      type: object
      description: 调用设备命令。参数值只能是布尔、数字或字符串。
      required:
      - type
      - functionCode
      - commandCode
      - targets
      properties:
        type:
          type: string
          description: 固定值 device.command.call。
          enum:
          - device.command.call
        functionCode:
          type: string
          description: 功能码。
        commandCode:
          type: string
          description: 命令代码。
        targets:
          type: array
          description: 要执行命令的设备和端点。
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslEndpointInfo'
        args:
          type: array
          description: 命令参数。每一项的 value 是标量。
          items:
            $ref: '#/components/schemas/AutomationDslCommandArg'
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslCommandArg:
      type: object
      description: 命令参数。
      required:
      - fieldCode
      - value
      properties:
        fieldCode:
          type: string
          description: 参数 ID。
        value:
          description: 命令参数标量。只接受布尔、数字或字符串，不接受值表达式。与变量声明里的创建初值不是同一含义。
          oneOf:
          - type: boolean
          - type: number
          - type: string
      additionalProperties: false

    AutomationDslDelay:
      type: object
      description: 等待 for 之后再执行后续动作。时长为 0 时立即继续。
      required:
      - type
      - for
      properties:
        type:
          type: string
          description: 固定值 delay。
          enum:
          - delay
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: 等待时长。0sec 表示立即继续。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslSceneExecute:
      type: object
      description: 执行 sceneId 指定的场景，然后继续下一步。不等待整个场景结束。不接受 params。
      required:
      - type
      - sceneId
      properties:
        type:
          type: string
          description: 固定值 action.scene_execute。
          enum:
          - action.scene_execute
        sceneId:
          type: string
          pattern: ^auto_[A-Za-z0-9-]+$
          description: 原样复制 list_scenes 或 get_scene_details 返回的 sceneId。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslAssignmentTarget:
      type: object
      required:
      - type
      - scope
      properties:
        type:
          type: string
          enum:
          - variable
        scope:
          type: string
          enum:
          - device
          - flow
          - global
          description: device 写设备属性，flow 写本流程变量，global 写全局变量。
        deviceId:
          type: string
          minLength: 1
          description: scope 为 device 时的设备 id。
        resourceId:
          type: string
          minLength: 1
          pattern: ^\d+\.[^.]+\.[^.]+$
          description: scope 为 device 时的端点.功能.特性。
        id:
          type: string
          minLength: 1
          description: scope 为 flow 或 global 时的变量 id。flow 使用 metadata.variables 里的 name。global 使用已有全局变量引用。
      additionalProperties: false
      oneOf:
      - properties:
          scope:
            enum:
            - device
        required:
        - deviceId
        - resourceId
        not:
          required:
          - id
      - properties:
          scope:
            enum:
            - flow
            - global
        required:
        - id
        not:
          anyOf:
          - required:
            - deviceId
          - required:
            - resourceId
      description: 赋值目标。scope 为 device 时填写 deviceId 和 resourceId，resourceId 格式是端点.功能.特性。scope 为 flow 或 global 时只填写 id。

    AutomationDslVariableSet:
      type: object
      required:
      - type
      - target
      - value
      properties:
        type:
          type: string
          enum:
          - action.variable_set
        target:
          allOf:
          - $ref: '#/components/schemas/AutomationDslAssignmentTarget'
          description: 写入位置。
        value:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 本次要写入的值，可以是字面量或值表达式。不是 metadata.variables[].value 那种创建初值。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false
      description: 把 value 写入 target。设备范围授权不能写 scope 为 global 的目标。

    AutomationDslScriptRun:
      type: object
      required:
      - type
      - script
      properties:
        type:
          type: string
          enum:
          - action.script_run
        script:
          type: string
          maxLength: 65536
          description: 要执行的 JavaScript。空白脚本不执行并继续下一步。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false
      description: 执行 JavaScript。空脚本直接继续。脚本里可用 ctx.readVar、ctx.writeVar、log.info 和 log.warn。设备范围授权不能使用。

    AutomationDslFlowManage:
      type: object
      required:
      - type
      - automationId
      - enabled
      properties:
        type:
          type: string
          enum:
          - action.flow_manage
        enabled:
          type: boolean
          description: true 启用目标，false 停用目标。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        automationId:
          type: string
          minLength: 1
          pattern: ^auto_[A-Za-z0-9-]+$
          description: 原样复制 list_automations 返回的 automationId，不自行构造。
      additionalProperties: false
      description: 持久修改目标自动化的启用状态。automationId 原样复制 list_automations 返回值。场景不支持启用状态。目标无效时停止，后续动作不执行。设备范围授权不能使用。

    AutomationDslLoopManage:
      type: object
      required:
      - type
      - loopId
      - enabled
      properties:
        type:
          type: string
          enum:
          - action.loop_manage
        loopId:
          type: string
          minLength: 1
          description: 目标 time.interval 的内部引用。
        enabled:
          type: boolean
          description: true 启动循环，false 停止循环。
        id:
          type: string
          minLength: 1
          description: 节点 id，整份脚本内唯一；省略时由导入分配。
        linkFrom:
          type: array
          description: 入边。省略时按动作数组顺序接线。空数组表示不接上游。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false
      description: 打开或关闭一个 time.interval 的运行开关，不修改配置。loopId 是该循环节点的内部引用。目标无效时停止，后续动作不执行。设备范围授权不能使用。

    AutomationDslFlowVariableRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - variable.flow
        id:
          type: string
          minLength: 1
          description: 流程变量名。
      additionalProperties: false
      description: 读取本流程变量。id 是 metadata.variables 里的 name。

    AutomationDslGlobalVariableRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - variable.global
        id:
          type: string
          minLength: 1
          description: 已有全局变量引用。
      additionalProperties: false
      description: 读取已有全局变量。设备范围授权不能使用。

    AutomationDslContextRef:
      type: object
      required:
      - type
      - path
      properties:
        type:
          type: string
          enum:
          - context
        path:
          type: string
          minLength: 1
          description: 固定为 trigger.timestamp，表示本次触发的毫秒时间戳。
          enum:
          - trigger.timestamp
      additionalProperties: false
      description: 读取本次触发的上下文。

    AutomationDslValueExpression:
      description: 动作和比较里使用的值，可以是字面量，也可以是变量引用、设备属性或节点输出。与 metadata.variables[].value 的创建初值字面量不是同一含义。
      oneOf:
      - anyOf:
        - type: boolean
        - type: number
        - type: string
        nullable: true
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslDataRef'
      - $ref: '#/components/schemas/AutomationDslFlowVariableRef'
      - $ref: '#/components/schemas/AutomationDslGlobalVariableRef'
      - $ref: '#/components/schemas/AutomationDslContextRef'
      - $ref: '#/components/schemas/AutomationDslNodeOutputRef'
      - $ref: '#/components/schemas/AutomationDslTriggerValueExpression'
  
    AutomationDslGeoLocation:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: 纬度，单位是度，范围 -90 到 90。
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: 经度，单位是度，范围 -180 到 180。
      additionalProperties: false

    AutomationDslNodeOutputRef:
      type: object
      required:
      - type
      - nodeId
      - port
      properties:
        type:
          type: string
          enum:
          - node.output
        nodeId:
          type: string
          minLength: 1
          description: 产出该值的节点 id。
        port:
          type: string
          minLength: 1
          description: 固定值 result，表示该节点算出的值。
          enum:
          - result
      additionalProperties: false
      description: 读取另一个节点算出的值。

    AutomationDslTimeFixed:
      type: object
      description: 在指定日期的时间点触发一次。date 必须是真实的 yyyy-MM-dd，否则整份配置被拒绝。location 只用于 sunrise 和 sunset。
      required:
      - type
      - date
      - time
      properties:
        type:
          type: string
          enum:
          - time.fixed
        date:
          type: string
          description: 日期，格式 yyyy-MM-dd。
          pattern: ^\d{4}-\d{2}-\d{2}$
        time:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: 当天的时间点。
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: 日出日落计算用的经纬度。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslTimeInterval:
      type: object
      description: 按固定间隔触发。for 是两次触发的间隔，不是条件需要持续的时长。loopCount 省略或为 0 时一直循环。enabled 省略时为开启。
      required:
      - type
      - for
      properties:
        type:
          type: string
          enum:
          - time.interval
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: 两次触发之间的间隔。不是属性需要保持的时长，也不是 sustain 的持续时长。
        name:
          type: string
          description: 这个循环触发器的名称。
        enabled:
          type: boolean
          description: 省略时为 true。false 表示创建后不启动，可由 action.loop_manage 打开。
        loopCount:
          type: integer
          minimum: 0
          description: 最多触发次数。省略或 0 表示不限制次数。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslVariableChange:
      type: object
      description: 变量值变化时触发。variable 必须是会变化的变量引用，字面量不会触发。
      required:
      - type
      - variable
      properties:
        type:
          type: string
          enum:
          - variable.change
        variable:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 要监听的变量。使用 variable.flow、variable.global 或 device.property。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslXorCondition:
      type: object
      description: 成立的子条件个数为奇数。至少两个子条件。
      required:
      - type
      - conditions
      properties:
        type:
          type: string
          enum:
          - xor
        conditions:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
          description: 入边。省略时按所在数组的位置接线。空数组表示不接上游。
      additionalProperties: false

    AutomationDslTimeRangeFixed:
      type: object
      description: 当前时间是否在两个日期时间之间。日期必须是真实的 yyyy-MM-dd，否则整份配置被拒绝。afterTime 和 beforeTime 支持 sunrise/sunset 及偏移；使用太阳时间时 location
        提供经纬度。
      required:
      - type
      - afterDate
      - afterTime
      - beforeDate
      - beforeTime
      properties:
        type:
          type: string
          enum:
          - time.range.fixed
        afterDate:
          type: string
          description: 日期，格式 yyyy-MM-dd。
          pattern: ^\d{4}-\d{2}-\d{2}$
        afterTime:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: 开始日期的时间点，支持固定时刻或 sunrise/sunset 及偏移。
        beforeDate:
          type: string
          description: 日期，格式 yyyy-MM-dd。
          pattern: ^\d{4}-\d{2}-\d{2}$
        beforeTime:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: 结束日期的时间点，支持固定时刻或 sunrise/sunset 及偏移。
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: 日出日落计算用的经纬度。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslFlowState:
      type: object
      description: 目标自动化当前启用状态是否等于 enabled。automationId 原样复制 list_automations 返回值。场景不支持启用状态。
      required:
      - type
      - automationId
      - enabled
      properties:
        type:
          type: string
          enum:
          - flow.state
        enabled:
          type: boolean
          description: true 表示目标必须启用。false 表示目标必须停用。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        automationId:
          type: string
          minLength: 1
          pattern: ^auto_[A-Za-z0-9-]+$
          description: 原样复制 list_automations 返回的 automationId，不自行构造。
      additionalProperties: false

    AutomationDslSustain:
      type: object
      description: 本块自己监听 source，比较成立并持续 for 之后触发一次。启动时不读当前值，下一次变化才开始计时。触发后必须先不满足，再重新持续满 for 才会再触发。op 省略时为 eq。不支持 rising 和 falling。属性变化后稳住用
        property.event 的 for；检查当前是否已持续用 property.state 的 for。
      required:
      - type
      - source
      - for
      - value
      properties:
        type:
          type: string
          enum:
          - sustain
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 被监听的值。
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: 比较成立后需要持续的时长。启动时不读当前值。触发一次后，要先不满足再重新持续满这段时间。
        op:
          type: string
          description: 比较符。省略时为 eq。不能使用 rising 或 falling。
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
        value:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 比较右值，可以是字面量或值表达式。不是 metadata.variables[].value 那种创建初值。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: 触发器不能有入边。省略，或给空数组。
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslCompare:
      type: object
      description: 比较左右两个值。eq、neq、gt、gte、lt、lte 比较当前值。rising 和 falling 表示左值穿过右值。
      required:
      - type
      - left
      - op
      - right
      properties:
        type:
          type: string
          enum:
          - compare
        left:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 左值。
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - rising
          - falling
          description: eq 到 lte 比较当前值。rising 表示左值向上穿过右值，falling 表示向下穿过。
        right:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 右值。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslMathAction:
      type: object
      description: 数值运算。abs、sqrt、floor、ceil、round、ln、log10、exp 只使用 left。除数为 0 时走错误出口。assignTo 省略时结果留在本节点。
      required:
      - type
      - op
      properties:
        type:
          type: string
          enum:
          - data.math
        op:
          type: string
          description: 运算符。
          enum:
          - add
          - sub
          - mul
          - div
          - modulus
          - pow
          - bitAnd
          - bitOr
          - bitXor
          - min
          - max
          - abs
          - sqrt
          - floor
          - ceil
          - round
          - ln
          - log10
          - exp
          - shiftLeft
          - shiftRight
        left:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 左操作数。一元运算使用它。
        right:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 右操作数。一元运算忽略它。
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: 结果写入的变量或设备属性。省略时结果留在本节点。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringConcatAction:
      type: object
      description: 把 left 和 right 连成一个字符串。省略的一侧按空字符串处理。
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - data.string.concat
        left:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 前半段。省略时为空字符串。
        right:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 后半段。省略时为空字符串。
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: 结果写入的变量或设备属性。省略时结果留在本节点。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringSubstringAction:
      type: object
      description: 从 start 起截取 length 个字符。start 为负数时从末尾倒数。length 小于等于 0 时结果为空字符串。
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - data.string.substring
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 要截取的字符串。省略时按空字符串处理。
        start:
          type: integer
          description: 起始位置，从 0 开始。负数从末尾倒数。省略时为 0。
        length:
          type: integer
          description: 截取长度。小于等于 0 时结果为空字符串。省略时为 0。
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: 结果写入的变量或设备属性。省略时结果留在本节点。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringAssignAction:
      type: object
      description: 把同一个字符串写入多个变量或设备属性。
      required:
      - type
      - targets
      properties:
        type:
          type: string
          enum:
          - data.string.assign
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 要写入的字符串。省略时按空字符串处理。
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: 写入目标。每一项是 device.property、variable.flow 或 variable.global。
          minItems: 1
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringCaseAction:
      type: object
      description: 转换目标字符串的大小写。mode 省略时转为大写。
      required:
      - type
      - targets
      properties:
        type:
          type: string
          enum:
          - data.string.case
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: 要转换并写回的变量或设备属性。
          minItems: 1
        mode:
          type: string
          enum:
          - upper
          - lower
          description: upper 转为大写，lower 转为小写。省略时为 upper。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslAggregateAction:
      type: object
      description: 对 values 做数值聚合。values 至少一项。没有可聚合的数或计算失败时走错误出口，结果不是 0。assignTo 省略时结果留在本节点。
      required:
      - type
      - op
      - values
      properties:
        type:
          type: string
          enum:
          - data.aggregate
        op:
          type: string
          enum:
          - avg
          - max
          - min
          - sum
          description: avg 平均值，max 最大值，min 最小值，sum 求和。
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 参与聚合的数值，至少一项。
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: 结果写入的变量或设备属性。省略时结果留在本节点。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslVariableToggle:
      type: object
      description: 对布尔值取反后写回。target 可以是流程变量、全局变量或设备布尔属性。
      required:
      - type
      - target
      properties:
        type:
          type: string
          enum:
          - variable.toggle
        target:
          allOf:
          - $ref: '#/components/schemas/AutomationDslAssignmentTarget'
          description: 要取反的布尔变量或设备属性。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslMessagePush:
      type: object
      description: 向钉钉或企业微信群机器人发送文本。钉钉在 secret 非空时按加签规则签名。企业微信不使用 secret。设备范围授权不能使用。
      required:
      - type
      - channel
      - webhookUrl
      - content
      properties:
        type:
          type: string
          enum:
          - message.push
        channel:
          type: string
          enum:
          - dingtalk
          - wechat
          description: dingtalk 为钉钉自定义机器人，wechat 为企业微信群机器人。
        webhookUrl:
          type: string
          description: 机器人 webhook 地址。
        secret:
          type: string
          description: 钉钉加签密钥。为空时钉钉不加签。企业微信忽略该字段。
        content:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 文本内容。发送为 {"msgtype":"text","text":{"content":...}}。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslDeviceBatchItem:
      type: object
      required:
      - deviceId
      - endpointId
      - functionCode
      properties:
        deviceId:
          type: string
          description: 设备 id。
        endpointId:
          type: integer
          description: 端点 id。
        functionCode:
          type: string
          description: 功能代码。
        traitCode:
          type: string
          description: 属性代码；仅兼容旧命令项的命令代码，新命令项使用 commandCode。
          minLength: 1
        value:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 本次要写入的值，可以是字面量或值表达式。command 不为 true 时必填。不是变量声明里的创建初值。
          not:
            enum:
            - null
            nullable: true
        command:
          type: boolean
          description: true 表示调用命令。false 或省略表示写入属性。同一 device.batch 里每一项必须相同。
        args:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslCommandArg'
          description: 命令参数。属性项仅兼容历史导出的空数组；新属性项省略此字段。
        commandCode:
          type: string
          minLength: 1
          description: 命令代码，仅 command 为 true 时使用。优先使用 commandCode；未提供 commandCode 时使用 traitCode。
      additionalProperties: false
      description: 批量中的一项。属性项使用 traitCode 和 value；命令项使用 command:true 和 commandCode，不允许 value。旧命令项 traitCode 兼容读取。
      oneOf:
      - required:
        - command
        properties:
          command:
            enum:
            - true
            type: boolean
        not:
          required:
          - value
        anyOf:
        - required:
          - commandCode
        - required:
          - traitCode
      - required:
        - traitCode
        - value
        properties:
          command:
            enum:
            - false
            type: boolean
          args:
            maxItems: 0
        not:
          required:
          - commandCode

    AutomationDslDeviceBatch:
      type: object
      description: 一次执行多项写入或多项命令。每一项使用自己的值和参数。同一块里不能同时包含属性写入和命令。
      required:
      - type
      - items
      properties:
        type:
          type: string
          enum:
          - device.batch
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslDeviceBatchItem'
          description: 要执行的项。每一项写到自己的设备点。
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslWritableTarget:
      description: 结果写入位置。省略 assignTo 时结果留在本节点，用 node.output 读取。
      oneOf:
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslFlowVariableRef'
      - $ref: '#/components/schemas/AutomationDslGlobalVariableRef'

    AutomationDslScene:
      type: object
      description: 场景动作配置，自带唯一执行入口，不接受 starters 或条件。
      required:
      - actions
      properties:
        metadata:
          $ref: '#/components/schemas/AutomationDslMetadata'
        actions:
          type: array
          description: 动作列表（至少一个）。
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAction'
        concurrencyGroup:
          type: string
          maxLength: 128
          description: 场景互斥组：同组独立新执行打断旧执行；空字符串、省略或 null 均不参加组互斥。禁止首尾空白和控制字符，最多 128 个 UTF-8 字节。子场景同时受父场景取消约束，自动化不参与。
          nullable: true
      additionalProperties: false

    JsonSceneConfig:
      type: object
      description: 场景动作配置，自带唯一执行入口，不接受 starters 或条件。
      required:
      - actions
      properties:
        metadata:
          $ref: '#/components/schemas/AutomationDslMetadata'
        actions:
          type: array
          description: 动作列表（至少一个）。
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAction'
        concurrencyGroup:
          type: string
          maxLength: 128
          description: 场景互斥组：同组独立新执行打断旧执行；空字符串、省略或 null 均不参加组互斥。禁止首尾空白和控制字符，最多 128 个 UTF-8 字节。子场景同时受父场景取消约束，自动化不参与。
          nullable: true
      additionalProperties: false

    SceneSummary:
      type: object
      required:
      - sceneId
      - name
      - createTime
      - spaces
      properties:
        name:
          type: string
          description: 自动化名称。
        createTime:
          type: integer
          format: int64
          description: 创建时间（毫秒时间戳）。
        space:
          anyOf:
          - $ref: '#/components/schemas/SpaceNode'
          - type: object
            nullable: true
            enum:
            - null
          description: 兼容单空间字段，等于 spaces 的第一项；无可解析关联时省略，可兼容按 null 处理。
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: includeMetadata=true 时返回的对象用户 metadata；与 config.metadata 不同。
        sceneId:
          type: string
          description: 独立场景 ID，值使用创建或查询返回的 auto_... 标识。
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: 全部可解析的关联空间，按 spaceId 去重；无关联时为 []。没有有效直接关联时沿用原有父级空间回退。

    SceneDetails:
      allOf:
      - $ref: '#/components/schemas/SceneSummary'
      - type: object
        properties:
          configFormat:
            type: string
            enum:
            - JSON_SCENE
            - FLOW_CANONICAL
            - null
            nullable: true
          config:
            anyOf:
            - $ref: '#/components/schemas/JsonSceneConfig'
            - $ref: '#/components/schemas/FlowCanonicalConfig'
            - type: object
              nullable: true
              enum:
              - null
            description: 可投影时返回动作配置；读取诊断见同级 issues，含只读诊断的配置不能直接作为更新输入。结构无法投影时返回完整图。
            nullable: true
          issues:
            type: array
            readOnly: true
            description: 仅用于读取的场景诊断，与 config 同级，不写入保存配置。path 相对场景 config，动作使用 actions[...]，metadata 路径保持。健康详情返回 []；列表省略该字段。诊断不放宽创建或更新校验，结构损坏时仍保持 FLOW_CANONICAL 回退。
            items:
              type: object
              required:
              - code
              - path
              - message
              properties:
                code:
                  type: string
                path:
                  type: string
                message:
                  type: string

    CreateSceneRequest:
      type: object
      required:
      - name
      - config
      properties:
        name:
          type: string
          minLength: 1
          description: 必须显式提供非空白展示名称；不从 config.metadata.name 回退。
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: 名称重名处理策略。未传或为 true 时自动添加 (1)、(2) 等后缀；为 false 时返回名称重复错误。
        config:
          $ref: '#/components/schemas/JsonSceneConfig'
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: 可选的初始空间关联；传入多个 ID，服务端去重。省略、null 或空数组时不建立直接关联。

    UpdateSceneRequest:
      type: object
      required:
      - sceneId
      - updateMask
      properties:
        name:
          type: string
          nullable: true
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: 名称重名处理策略。未传或为 true 时自动添加 (1)、(2) 等后缀；为 false 时返回名称重复错误。该字段不需要加入 updateMask。
        config:
          anyOf:
          - $ref: '#/components/schemas/JsonSceneConfig'
          - type: object
            nullable: true
            enum:
            - null
          description: 选中 config 时必须提供完整非 null 配置。
        updateMask:
          type: array
          description: 仅支持 name、config、spaceIds；场景没有 enabled。选中 spaceIds 时必须提供非 null 数组；未选时不发送非 null 值。config.metadata.name 不隐式改名。
          items:
            type: string
            enum:
            - name
            - config
            - spaceIds
          minItems: 1
          uniqueItems: true
        sceneId:
          type: string
          minLength: 1
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: 选中 updateMask 的 spaceIds 时必须提供非 null 数组；整组替换而非追加，空数组清空直接关联。不更新空间时省略此字段及其掩码。
      allOf:
      - oneOf:
        - properties:
            updateMask:
              type: array
              items:
                type: string
                enum:
                - name
                - config
            spaceIds:
              type: array
              nullable: true
              enum:
              - null
        - required:
          - spaceIds
          properties:
            updateMask:
              type: array
              not:
                items:
                  not:
                    enum:
                    - spaceIds
            spaceIds:
              type: array
              items:
                type: string
                minLength: 1
                pattern: \S

    UpdateSceneSpaceRequest:
      type: object
      required:
      - sceneIds
      properties:
        spaceId:
          type: string
          minLength: 1
          description: 旧单空间参数；等价于仅含该 ID 的 spaceIds，与非 null 的 spaceIds 互斥。
          nullable: true
        sceneIds:
          type: array
          minItems: 1
          description: 要更新空间关联的场景 ID 列表。
          items:
            type: string
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: \S
          description: 目标空间 ID 数组；整组替换而非追加，服务端去重；空数组清空直接关联。
      example:
        spaceIds:
        - space-livingroom-001
        - space-bedroom-001
        sceneIds:
        - auto_01HXYZABCDEF1234567890
      description: 替换每个对象的整组直接空间关联。spaceId 与 spaceIds 必须且只能提供一种非 null 形式；spaceIds=[] 清空直接关联。
      oneOf:
      - required:
        - spaceId
        properties:
          spaceId:
            type: string
            minLength: 1
            pattern: \S
          spaceIds:
            type: array
            nullable: true
            enum:
            - null
      - required:
        - spaceIds
        properties:
          spaceIds:
            type: array
            items:
              type: string
              minLength: 1
              pattern: \S
          spaceId:
            type: string
            nullable: true
            enum:
            - null

    DeleteScenesRequest:
      type: object
      required:
      - sceneIds
      properties:
        sceneIds:
          type: array
          minItems: 1
          items:
            type: string

    SceneBatchFailure:
      type: object
      required:
      - sceneId
      - code
      - message
      properties:
        sceneId:
          type: string
          description: 处理失败的 sceneId。
        code:
          type: integer
          description: 失败项错误码。
        message:
          type: string
          description: 失败项错误信息。

    SceneBatchResultData:
      type: object
      required:
      - successIds
      - failedItems
      properties:
        successIds:
          type: array
          description: 批量处理成功的 sceneId 列表。
          items:
            type: string
        failedItems:
          type: array
          description: 批量处理失败项列表。
          items:
            $ref: '#/components/schemas/SceneBatchFailure'

    SceneListData:
      type: object
      required:
      - totalCount
      - pageNum
      - pageSize
      - data
      properties:
        totalCount:
          type: integer
          description: 总条数。
        pageNum:
          type: integer
          description: 当前页码。
        pageSize:
          type: integer
          description: 每页条数。
        data:
          type: array
          description: 场景列表。
          items:
            $ref: '#/components/schemas/SceneSummary'

    ExecuteSceneRequest:
      type: object
      required:
      - sceneId
      additionalProperties: false
      properties:
        sceneId:
          type: string
          description: 场景 ID。
          pattern: ^auto_[A-Za-z0-9-]+$

    CreateSceneResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: string
          type:
            type: string
            enum:
            - CreateSceneResponse

    UpdateSceneResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: string
            example: ''
          type:
            type: string
            enum:
            - UpdateSceneResponse

    ExecuteSceneResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: string
            example: ''

    UpdateSceneSpaceResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SceneBatchResultData'
          type:
            type: string
            enum:
            - UpdateSceneSpaceResponse

    DeleteSceneResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SceneBatchResultData'
          type:
            type: string
            enum:
            - DeleteSceneResponse

    SceneDetailsResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SceneDetails'
          type:
            type: string
            enum:
            - GetSceneDetailsResponse

    SceneListResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/SceneListData'
          type:
            type: string
            enum:
            - GetSceneListResponse


    ResponseEnvelope:
      type: object
      x-business-success-condition: code == 0
      required:
      - version
      - msgId
      - code
      properties:
        type:
          type: string
          description: 可省略的消息类型；不能仅凭此字段判断成功，仍须检查 HTTP 状态和 code。
        version:
          type: string
          description: 接口版本
          example: v1
        msgId:
          type: string
          description: 消息ID
        code:
          type: integer
          description: 业务状态码；仅 0 表示业务成功，HTTP 200 下的非 0 值仍表示业务失败
        message:
          type: string
          description: 提示信息
      description: 不强制 type 的响应信封，用于错误响应及 REST 初始化/MCP 配置的直接 JSON 响应；正常消息业务响应仍使用 BaseResponse，要求 type。

