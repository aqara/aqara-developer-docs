    EmsTrendPoint:
      type: object
      required: [startTime, value]
      properties:
        startTime:
          type: string
          description: |
            Start time, format depends on query dimension:
            - 1h: yyyyMMddHH
            - 1d: yyyyMMdd
            - month: yyyyMM
          example: "2024010100"
        value:
          type: number
          format: double
