          - SCRIPT_JSON
        description: Automation definition type. Currently, only SCRIPT_JSON (i.e. Flow automation) is supported.
      - in: query
        name: deviceIds
        required: false
        description: List of device IDs, separated by commas or provided multiple times as query parameters.
        schema:
          type: array
          items:
            type: string
        style: form
