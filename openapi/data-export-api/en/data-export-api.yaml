          description: Optional protocol category association; explicitly null when not configured. Follows NetworkProtocolSupport (20870) bit definitions; defaults Matter→Thread(2), Zigbee→8, Aqara RS485→32. Not a real-time device Trait value. Can be passed directly to
            /devices networkProtocolMask; multiple categories are combined with bitwise OR.
          example: 2
    DeviceFilterOptionsResponse:
