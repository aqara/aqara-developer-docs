          format: int64
          description: Upgrade status update timestamp, in milliseconds

    SearchFirmwareUpgradeStatusResponseData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: List of firmware upgrade statuses
          items:
            $ref: '#/components/schemas/FirmwareUpgradeStatusItem'

    SearchFirmwareUpgradeStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SearchFirmwareUpgradeStatusResponseData'
              type: string
              enum:
              - SearchFirmwareUpgradeStatusResponse
      example:
        type: SearchFirmwareUpgradeStatusResponse
        version: v1
        msgId: "3"
        code: 0
        message: success
        data:
          items:
            - did: "device-001"
              upgradeResult: null
              progress: 50
              firmwareType: "main"
              cause: null
              time: 1710000000000
            - did: "device-002"
              upgradeResult: 0
              progress: 100
              firmwareType: "studio"
              cause: null
              time: 1710000001000

    CancelUpgradeFirmwareRequestData:
      type: object
      required: [deviceIds]
      properties:
        deviceIds:
          type: array
          description: List of device IDs, at least 1, at most 200. Duplicate IDs are not illegal, and the server will deduplicate before sending.
          minItems: 1
          maxItems: 200
          items:
            type: string

    CancelUpgradeFirmwareResultItem:
      type: object
      required: [deviceId, resultCode]
      properties:
        deviceId:
          type: string
          description: Device ID
        resultCode:
          type: integer
          description: "Cancel command dispatch result for a single device. <br />0: command was sent to gateway successfully, not that cancel succeeded on the gateway; <br />non-zero: command send failed."

    CancelUpgradeFirmwareResponseData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: List of dispatch results for single device cancel commands
          items:
            $ref: '#/components/schemas/CancelUpgradeFirmwareResultItem'

    CancelUpgradeFirmwareResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CancelUpgradeFirmwareResponseData'
            code:
              type: integer
              description: Interface result code, 0 means succeeded; check data.items[].resultCode for individual device cancel result.
      example:
        type: CancelUpgradeFirmwareResponse
        version: v1
        msgId: "4"
        code: 0
        message: success
        data:
          items:
            - deviceId: "device-001"
              resultCode: 0
            - deviceId: "device-002"
              resultCode: -1

    SearchUpgradableFirmwareByDeviceIdsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: object
              description: Search results for upgradable firmware per device
              required: [data]
              properties:
                data:
                  type: array
                  description: List of upgradable firmware results per device
                  items:
                    $ref: '#/components/schemas/UpgradableDeviceFirmwareItem'
            type:
              type: string
              enum:
              - SearchUpgradableFirmwareByDeviceIdsResponse
      example:
        type: SearchUpgradableFirmwareByDeviceIdsResponse
        version: v1
        msgId: "2"
        code: 0
        message: success
        data:
          data:
            - deviceId: "device-001"
              deviceName: "Bedroom light"
              currentFirmwareVersion: 1.0.0
              state: true
              space:
                parentSpaceId: "space-home-001"
                name: "Bedroom"
                spaceId: "15sd85"
              upgradableFirmwares:
                - firmwareVersion: "99.99.99"
                  intVersion: null
                  filePath: "https://xxx"
                  fileSize: 123456
                  firmwareMd5: "xx"
                  firmwareCRC32: "xx"
                  firmwareSha256: null
                  firmwareType: "main"
                  updateLog: "Firmware upgrade notes"
                  model: ""
                  isNecessary: false
                  isForce: false
                  state: 3
                  releaseTime: 1710001234567

    UpgradableFirmwareType:
      type: string
      description: Firmware type
      enum: [main, zigbee, ai, matter, studio, rs485]

    UpgradableFirmwareInfo:
      type: object
      required: [firmwareVersion, filePath, fileSize, firmwareMd5, firmwareCRC32, firmwareType, isNecessary, isForce, state]
      properties:
        firmwareVersion:
          type: string
          description: Firmware version number
        intVersion:
          type: integer
          nullable: true
          description: Integer version for Matter-type firmware
        filePath:
          type: string
          description: Firmware file URL
        fileSize:
          type: integer
          format: int64
          description: Firmware file size (bytes)
        firmwareMd5:
          type: string
          description: Firmware file MD5
        firmwareCRC32:
          type: string
          description: Firmware file CRC32
        firmwareSha256:
          type: string
          nullable: true
          description: Firmware file SHA256
        firmwareType:
          $ref: '#/components/schemas/UpgradableFirmwareType'
        updateLog:
          type: string
          nullable: true
          description: Firmware upgrade notes
        model:
          type: string
          nullable: true
          description: Device model
        isNecessary:
          type: boolean
          description: Whether this is a mandatory through-version. true is required, false is optional.
        isForce:
          type: boolean
          description: Whether the upgrade is forced
        state:
          type: integer
          description: Firmware state. <br />1：Testing, <br />2：Gray release, <br />3：Released, <br />5：Beta
          enum: [1, 2, 3, 5]
        releaseTime:
          type: integer
          format: int64
          nullable: true
          description: Firmware release effective time (milliseconds timestamp)

    UpgradableDeviceFirmwareItem:
      type: object
      required:
      - deviceId
      - deviceName
      - state
      - upgradableFirmwares
      - currentFirmwareVersion
      properties:
        deviceId:
          type: string
          description: Device ID
        deviceName:
          type: string
          description: Device name
        state:
          type: boolean
          description: Device online status
        space:
          $ref: '#/components/schemas/DeviceSpace'
          description: Device associated space
        upgradableFirmwares:
          type: array
          description: List of upgradable firmware for this device
          items:
            $ref: '#/components/schemas/UpgradableFirmwareInfo' 
        currentFirmwareVersion:
          type: string
          description: Current firmware version of the device.

    # ── Automation ────────────────────────────────────────────────
    AutomationSummary:
      type: object
      required:
      - automationId
      - name
      - enabled
      - definitionType
      - createTime
      - spaces
      properties:
        automationId:
          type: string
          description: Automation ID.
        name:
          type: string
          description: Automation name.
        enabled:
          type: boolean
          description: "Whether it is enabled. true: enabled; false: disabled."
        definitionType:
          type: string
          enum: [SCRIPT_JSON, SCRIPT_TEXT, WHEN_IF_THEN, LEGACY_FLOW, LEGACY_LINKAGE, OTHER]
          description: |
            Automation type, as follows: <br />
            - SCRIPT_JSON：**Flow** automation created via API.  
            - SCRIPT_TEXT：**Flow** automation created via Aqara Studio Web page.  
            - WHEN_IF_THEN：**Classic** automation.  
            - LEGACY_FLOW：**Flow** automation (legacy version).  
            - LEGACY_LINKAGE：**Logic** automation.  
            - OTHER：Other automation types.
        createTime:
          type: integer
          format: int64
          description: Creation time (UTC timestamp in milliseconds)
        space:
          anyOf:
          - $ref: '#/components/schemas/SpaceNode'
          - type: object
            nullable: true
            enum:
            - null
          description: Legacy single-space field, equal to the first item of `spaces`. Omitted when no resolvable association exists; clients may treat omission as `null`.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: The object metadata returned when includeMetadata=true; different from config.metadata.
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: All resolvable associated spaces, deduplicated by `spaceId`; `[]` when there is no association. When there is no valid direct association, falls back to the previous parent-space behavior.
   

    AutomationDetails:
      allOf:
      - $ref: '#/components/schemas/AutomationSummary'
      - type: object
        properties:
          configFormat:
            type: string
            nullable: true
            enum:
            - JSON_AUTOMATION
            - FLOW_CANONICAL
            - null
            description: |
              configText can be exported losslessly as a public DSL when it is JSON_AUTOMATION,
              otherwise it falls back to FLOW_CANONICAL; reading does not rewrite the persistent graph.
          config:
            nullable: true
            description: |
              Detailed definition. Parse according to configFormat.
              FLOW_CANONICAL should not be used as the public JSON update input.
            anyOf:
            - $ref: '#/components/schemas/JsonAutomationConfig'
            - $ref: '#/components/schemas/FlowCanonicalConfig'
            - type: object
              nullable: true
              enum:
              - null
          issues:
            type: array
            readOnly: true
            description: Read-only automation diagnostics, sibling to `config`. `path` is relative to the automation `config` (for example, `automations[0].actions[0].value`). Healthy detail responses return `[]`; list responses omit this field. It is not written into `configText` and does not relax create/update validation. Historical read-only targets that include diagnostics must be fixed before write-back; when the structure cannot be projected, it still falls back to `FLOW_CANONICAL`.
            items:
              type: object
              required:
              - code
              - path
              - message
              properties:
                code:
                  type: string
                path:
                  type: string
                message:
                  type: string

    JsonAutomationConfig:
      description: |
        Public automation DSL; triggered by event or schedule. 
        Multiple rules are merged into a single automation object; 
        reading is normalized according to execution semantics, and
        original grouping or canvas layout is not guaranteed.
      type: object
      required:
      - automations
      properties:
        metadata:
          $ref: '#/components/schemas/AutomationDslMetadata'
        automations:
          type: array
          description: |
            An Open automation contains one or more rules, sharing configuration variables but maintaining separate trigger and execution relationships.
          minItems: 1
     
          items:
            $ref: '#/components/schemas/AutomationDslAutomation'
      additionalProperties: false

    FlowCanonicalConfig:
      type: object
      description: Complete automation definition used by the Studio frontend canvas.
      properties:
        kind:
          type: string
          enum: [flow.canonical]
        flowVersion:
          type: string
          description: Canvas definition version; the current implementation defaults to 2.0
        registryVersion:
          type: string
          description: Node registry version; the current implementation defaults to 2.0
        metadata:
          $ref: '#/components/schemas/FlowCanonicalMetadata'
        variables:
          type: array
          description: Canvas variable declarations; not a list of triggers, conditions, or actions
          items:
            $ref: '#/components/schemas/FlowCanonicalVariable'
        nodes:
          type: array
          description: >-
            All flow nodes. Semantics are identified by the type prefix: event.* for
            triggers, condition.* for conditions, and action.* for actions; array order
            does not represent execution order.
          items:
            $ref: '#/components/schemas/FlowCanonicalNode'
        edges:
          type: array
          description: >-
            Connections between node ports; used to determine the execution relationships
            among triggers, conditions, and actions
          items:
            $ref: '#/components/schemas/FlowCanonicalEdge'
        editor:
          $ref: '#/components/schemas/FlowCanonicalEditorState'

    FlowCanonicalMetadata:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    FlowCanonicalVariable:
      type: object
      required: [id, type, name]
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: true

    FlowCanonicalNode:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          description: Node ID, also referenced by edges and editor mappings
        type:
          type: string
          description: >-
            Node type; event.* indicates a trigger, condition.* indicates a condition,
            and action.* indicates an action
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        config:
          type: object
          description: Configuration specific to the node type; fields vary by type
          additionalProperties: true
        title:
          type: string
          nullable: true

    FlowCanonicalEdge:
      type: object
      required: [id, source, target]
      properties:
        id:
          type: string
        source:
          $ref: '#/components/schemas/FlowCanonicalPortRef'
        target:
          $ref: '#/components/schemas/FlowCanonicalPortRef'

    FlowCanonicalPortRef:
      type: object
      required: [node, port]
      properties:
        node:
          type: string
          description: FlowCanonicalNode.id
        port:
          type: string
          description: Node input or output port name

    FlowCanonicalEditorState:
      type: object
      description: Frontend canvas display state; not used to determine automation execution order
      properties:
        positions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalPosition'
        nodes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FlowCanonicalEditorNode'

    FlowCanonicalPosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    FlowCanonicalEditorNode:
      type: object
      properties:
        summary:
          type: string
        description:
          type: string
        label:
          type: string
        icon:
          type: string
        iconColor:
          type: string
        detail:
          type: object
          additionalProperties: true
        hidden:
          type: boolean

    AutomationListData:
      type: object
      required: [totalCount, pageNum, pageSize, data]
      properties:
        totalCount:
          type: integer
          description: Total number of automations that meet the conditions
        pageNum:
          type: integer
          description: Current page number
        pageSize:
          type: integer
          description: Current page size
        data:
          type: array
          description: Automation list
          items:
            $ref: '#/components/schemas/AutomationSummary'

    CreateAutomationRequest:
      type: object
      required:
      - config
      properties:
        name:
          type: string
          nullable: true
          description: Non-empty name takes precedence; if omitted, null, or blank, fall back to non-empty config.metadata.name.
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: Name duplication handling strategy. If not passed or true, automatically add suffixes like (1), (2), etc. ; if false, return a name duplication error.
        definitionType:
          type: string
          enum:
          - SCRIPT_JSON
          default: SCRIPT_JSON
          description: Legacy input compatibility field; new callers can omit.
        config:
          $ref: '#/components/schemas/JsonAutomationConfig'
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: Optional initial space associations. Pass multiple IDs; the server deduplicates. When omitted, `null`, or an empty array, no direct association is created.

    UpdateAutomationRequest:
      type: object
      required:
      - automationId
      - updateMask
      properties:
        name:
          type: string
          description: New name.
          nullable: true
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: Name duplication handling strategy. If not passed or true, automatically add suffixes like (1), (2), etc. ; if false, return a name duplication error. This field does not need to be included in updateMask.
        enabled:
          type: boolean
          nullable: true
        config:
          anyOf:
          - $ref: '#/components/schemas/JsonAutomationConfig'
          - type: object
            nullable: true
            enum:
            - null
          description: Replace the entire public configuration; allows replacing the CfgFlowLogic that can be exported or rolled back to the original graph; does not qualify for updates based on the SCRIPT_JSON classification.
        updateMask:
          type: array
          description: Non-empty array. It supports name, enabled, config, and spaceIds; selected fields must be valid; do not send non-null values for unselected fields.
          items:
            type: string
            enum:
            - name
            - enabled
            - config
            - spaceIds
          minItems: 1
          uniqueItems: true
        automationId:
          type: string
          minLength: 1
          description: Target automationId, placed in the request body.
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
            description: Must provide a non-null array when `spaceIds` is selected in `updateMask`; replace as a whole, not append; an empty array clears direct associations. Omit this field and its mask when not updating spaces.
      allOf:
      - oneOf:
        - properties:
            updateMask:
              type: array
              items:
                type: string
                enum:
                - name
                - enabled
                - config
            spaceIds:
              type: array
              nullable: true
              enum:
              - null
        - required:
          - spaceIds
          properties:
            updateMask:
              type: array
              not:
                items:
                  not:
                    enum:
                    - spaceIds
            spaceIds:
              type: array
              items:
                type: string
                minLength: 1
                pattern: \S

    UpdateAutomationStatusRequest:
      type: object
      required: [automationIds, enabled]
      properties:
        automationIds:
          type: array
          description: List of automation IDs.
          minItems: 1
          items:
            type: string
        enabled:
          type: boolean
          description: "New enabled state. true: enabled; false: disabled."

    UpdateAutomationSpaceRequest:
      type: object
      required:
      - automationIds
      properties:
        spaceId:
          type: string
          minLength: 1
          description: Legacy single-space parameter. Equivalent to `spaceIds` containing only this ID; mutually exclusive with a non-null `spaceIds`.
        automationIds:
          type: array
          minItems: 1
          description: List of automation IDs to update the space association.
          items:
            type: string
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: \S
          description: Target space ID array. Replaces the whole set rather than appending; the server deduplicates. An empty array clears direct associations.
      example:
        spaceIds:
        - space-livingroom-001
        - space-bedroom-001
        automationIds:
        - auto_01HXYZABCDEF1234567890
      description: Replace each object's full set of direct space associations. Exactly one non-null form of `spaceId` or `spaceIds` must be provided; `spaceIds=[]` clears direct associations.
      oneOf:
      - required:
        - spaceId
        properties:
          spaceId:
            type: string
            minLength: 1
            pattern: \S
          spaceIds:
            type: array
            nullable: true
            enum:
            - null
      - required:
        - spaceIds
        properties:
          spaceIds:
            type: array
            items:
              type: string
              minLength: 1
              pattern: \S
          spaceId:
            type: string
            nullable: true
            enum:
            - null

    DeleteAutomationsRequest:
      type: object
      required: [automationIds]
      properties:
        automationIds:
          type: array
          description: List of automation IDs.
          minItems: 1
          items:
            type: string

    AutomationBatchFailure:
      type: object
      required: [automationId, code, message]
      properties:
        automationId:
          type: string
          description: ID of the failed automation.
        code:
          type: integer
          description: Error code for the failed automation.
        message:
          type: string
          description: Error message for the failed automation.

    AutomationBatchResultData:
      type: object
      required: [successIds, failedItems]
      properties:
        successIds:
          type: array
          description: List of successfully processed automation IDs.
          items:
            type: string
        failedItems:
          type: array
          description: List of failed automation items.
          items:
            $ref: '#/components/schemas/AutomationBatchFailure'

    CreateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: ID of the successfully created automation.
            type:
              type: string
              enum:
              - CreateAutomationResponse

    UpdateAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              nullable: true
              example: ""

    DeleteAutomationResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
            type:
              type: string
              enum:
              - DeleteAutomationResponse

    UpdateAutomationStatusResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
            type:
              type: string
              enum:
              - UpdateAutomationStatusResponse

    UpdateAutomationSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationBatchResultData'
            type:
              type: string
              enum:
              - UpdateAutomationSpaceResponse
      example:
        type: UpdateAutomationSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000026"
        code: 0
        message: success
        data:
          successIds: ["auto_01HXYZABCDEF1234567890"]
          failedItems: []

    AutomationDetailsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationDetails'
              nullable: true
            type:
              type: string
              enum:
              - GetAutomationDetailsResponse

    AutomationListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationListData'
            type:
              type: string
              enum:
              - GetAutomationListResponse

    AutomationCapabilitiesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AutomationCapabilitiesData'
            type:
              type: string
              enum:
              - QueryAutomationCapabilitiesResponse
      example:
        type: QueryAutomationCapabilitiesResponse
        version: v1
        msgId: "52ebd835-1b8d-48f7-ab30-741d7c1ae0ee"
        code: 0
        message: success
        data:
          devices:
            - deviceId: "lumi3.a61fca0f4da1a0bd"
              deviceName: "Edge Hub M300"
              endpoints:
                - endpointName: "Root"
                  endpointId: 1
                  properties:
                    - deviceType: "Root"
                      functionCode: "GeneralDiagnostics"
                      functionName: "GeneralDiagnostics"
                      traitCode: "AntiDeletionNotification"
                      traitName: "Accidental Deletion Prevention notification (child device)"
                      valueType: "event"
                      semanticRole: ["starter"]
                      valueRange:
                        enumRange:
                          - value: "1"
                            key: "trigger"

    AutomationCapabilitiesData:
      type: object
      nullable: true
      properties:
        devices:
          type: array
          description: List of device capabilities that can be used for automation orchestration
          items:
            $ref: '#/components/schemas/AutomationCapabilityDevice'
      description: Device capabilities discovered in real time according to current permissions; the public DSL structure is JsonAutomationConfig. The client allows additional discovery fields.
      additionalProperties: true

    AutomationCapabilityDevice:
      type: object
      required: [deviceId, deviceName, endpoints]
      properties:
        deviceId:
          type: string
          description: Device ID
        deviceName:
          type: string
          description: Device name
        endpoints:
          type: array
          description: Endpoint list
          items:
            $ref: '#/components/schemas/AutomationCapabilityEndpoint'

    AutomationCapabilityEndpoint:
      type: object
      required: [endpointName, endpointId, properties]
      properties:
        endpointName:
          type: string
          description: Endpoint name
        endpointId:
          type: integer
          description: Endpoint ID
        properties:
          type: array
          description: List of available capabilities for the endpoint (traits/events/commands)
          items:
            $ref: '#/components/schemas/AutomationCapabilityProperty'

    AutomationCapabilityProperty:
      type: object
      required: [deviceType, functionCode, functionName, valueType, semanticRole]
      properties:
        deviceType:
          type: string
          description: Device type
        functionCode:
          type: string
          description: Function code
        functionName:
          type: string
          description: Function name
        traitCode:
          type: string
          description: Trait code (common when valueType is not cmd)
        traitName:
          type: string
          description: Trait name
        commandCode:
          type: string
          description: Command code (common when valueType is cmd)
        commandName:
          type: string
          description: Command name
        valueType:
          type: string
          description: Value type (e.g. boolean/number/enum/event/cmd)
        semanticRole:
          type: array
          description: Automation roles
          items:
            type: string
            enum: [starter, condition, action]
        unit:
          type: string
          description: Unit (e.g. %, °C, lx, etc.)
        valueRange:
          $ref: '#/components/schemas/AutomationCapabilityValueRange'

    AutomationCapabilityValueRange:
      type: object
      description: Value range or enum range
      properties:
        min:
          type: number
          format: double
          description: Minimum value
        max:
          type: number
          format: double
          description: Maximum value
        enumRange:
          type: array
          items:
            $ref: '#/components/schemas/AutomationCapabilityEnumItem'

    AutomationCapabilityEnumItem:
      type: object
      description: Enum range
      required: [value, key]
      properties:
        value:
          type: string
          description: Enum value (usually a string in the API response)
        key:
          type: string
          description: Enum display text

    # ── EMS (Energy Management System) ────────────────────────────
    EmsTrendDeviceRequest:
      type: object
      required: [startTime, endTime, deviceId, dimension]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1704153600000
        deviceId:
          type: string
          description: Device ID.
          example: "device_001"
        dimension:
          type: string
          description: Aggregation dimension.
          enum: ["1h", "1d", "month"]
          example: "1h"

    EmsTrendSpaceRequest:
      type: object
      required: [startTime, endTime, spaceId, dimension]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1706745600000
        spaceId:
          type: string
          description: Space ID (automatically identifies home or room).
          example: "room_001"
        dimension:
          type: string
          description: Aggregation dimension
          enum: ["1h", "1d", "month"]
          example: "1d"

    EmsTotalDeviceRequest:
      type: object
      required: [startTime, endTime, deviceId]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1704153600000
        deviceId:
          type: string
          description: Device ID.
          example: "device_001"

    EmsTotalSpaceRequest:
      type: object
      required: [startTime, endTime, spaceId]
      properties:
        startTime:
          type: integer
          format: int64
          description: Start time (UTC timestamp in milliseconds).
          example: 1704067200000
        endTime:
          type: integer
          format: int64
          description: End time (UTC timestamp in milliseconds).
          example: 1706745600000
        spaceId:
          type: string
          description: Space ID (It would be automatically identified as home or room).
