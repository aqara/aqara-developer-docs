# ══════════════════════════════════════════════════════════════════
# Components
# ══════════════════════════════════════════════════════════════════
components:

  parameters:
    Lang:
      name: Lang
      in: header
      required: false
      schema:
        type: string
        example: "{{Lang}}"
      description: Language. Use `en-US` for English, and `zh-CN` for Chinese.

  responses:
    BadRequestResponse:
      description: Request parameter error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnauthorizedResponse:
      description: Unauthorized or authentication expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            version: ''
            msgId: ''
            code: 401
            message: 'Authentication failed: Token is empty'
    ForbiddenResponse:
      description: No permission to access
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            version: ''
            msgId: ''
            code: 403
            message: No permission to access this resource
    ConflictResponse:
      description: The current resource state conflicts with the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntityResponse:
      description: The request format is correct, but the protocol, entity, or configuration is not supported
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000004"
              code: 404
              message: "Resource not found"
    TooManyRequestsResponse:
      description: Request frequency too high
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000005"
              code: 429
              message: "Request frequency too high"
    InternalServerErrorResponse:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000006"
              code: 500
              message: "Internal server error"
    BadGatewayResponse:
      description: Edge or Cloud command call failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 502
              message: "Edge or Cloud command call failed"
    ServiceUnavailableResponse:
      description: Service unavailable; usually indicates the current environment is Edge, or the Cloud service 'cloudlinkcloud' is not loaded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
            example:
              type: ErrorMessage
              version: v1
              msgId: "a1b2c3d4-e5f6-7890-abcd-err000000007"
              code: 503
              message: "Service temporarily unavailable"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <Token>"

  schemas:

    # ── Base Request / Response ───────────────────────────────────
    BaseResponse:
      type: object
      required: [type, version, msgId, code]
      properties:
        type:
          type: string
          description: Message type
        version:
          type: string
          description: API version
          example: v1
        msgId:
          type: string
          description: Message ID
        code:
          type: integer
          description: "Status code; only 0 indicates success. Non-zero values under HTTP 200 still indicate failure"
        message:
          type: string
          description: Message

    ApiResponseEnvelope:
      type: object
      required: [version, msgId, code, message]
      properties:
        version: { type: string, example: v1 }
        msgId: { type: string }
        code: { type: integer, example: 0 }
        message: { type: string, example: success }

    ExternalEventRequest:
      type: object
      required: [event]
      properties:
        event: { type: string, minLength: 1, description: 事件名称，用于匹配自动化触发块 }
        source: { type: string, nullable: true, description: 事件来源标识 }
        payload: { nullable: true, description: 任意 JSON 类型的事件载荷 }

    ExternalEventResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponseEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [accepted, event, seq]
              properties:
                accepted: { type: boolean, example: true }
                event: { type: string, example: ci.build.completed }
                seq: { type: integer, format: int64, description: 服务端分配的事件序列号 }

    ErrorResponse:
      description: 错误信息通过 code 与 message 提供；鉴权等直接错误响应可省略 type。
      allOf:
      - $ref: '#/components/schemas/ResponseEnvelope'
      example:
        type: ErrorMessage
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-err000000001"
        code: 400
        message: "参数 deviceId 不能为空"

    # ── Auth ─────────────────────────────────────────────────────

    StudioStatisticsDimension:
      type: string
      description: Studio statistics dimension
      enum: [deviceCount, linkageCount, spaceCount, sceneCount]

    StudioStatisticsData:
      type: object
      description: Studio statistics; only returns the statistics fields requested via dimensions
      properties:
        deviceCount:
          type: integer
          description: Device count
          example: 128
        linkageCount:
          type: integer
          description: Legacy automation node count, including standalone scenes; not equal to the /automations list count.
          example: 24
        spaceCount:
          type: integer
          description: Space count
          example: 16
        sceneCount:
          type: integer
          description: Legacy statistics metric; cannot replace the totalCount of the standalone scenes /scenes list.
          example: 12

    StudioStatisticsResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/StudioStatisticsData'
            type:
              type: string
              enum:
              - StudioStatisticsResponse
      example:
        type: StudioStatisticsResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000021"
        code: 0
        message: success
        data:
          deviceCount: 128
          linkageCount: 24
          spaceCount: 16
          sceneCount: 12
   

    # ── Space ────────────────────────────────────────────────────
    SpaceNode:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: Space ID
        parentSpaceId:
          type: string
          nullable: true
          description: Parent space ID. If there is no parent space, omit this parameter.
        name:
          type: string
          description: Space name
        spatialMarking:
          type: string
          nullable: true
          description: Space tag
        children:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: Child space list (recursive structure)

    CreateSpaceRequest:
      type: object
      required: [name]
      properties:
        parentSpaceId:
          type: string
          nullable: true
          description: Parent space ID. When empty, a top-level (root) space will be created; if not empty, a child space will be created under the specified parent space.
        name:
          type: string
          minLength: 1
          description: Space name, cannot be an empty string.
        spatialMarking:
          type: string
          nullable: true
          description: Space semantic marking. When omitted, it is handled by the existing space service.
      example:
        parentSpaceId: "space-home-001"
        name: "Living Room"
        spatialMarking: room

    CreateSpaceResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: Space ID of the newly created space.
            type:
              type: string
              enum:
              - CreateSpaceResponse
      example:
        type: CreateSpaceResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000006"
        code: 0
        message: success
        data: "space-livingroom-001"

    UpdateSpaceNameRequest:
      type: object
      required: [spaceId, name]
      properties:
        spaceId:
          type: string
          description: Space ID.
        name:
          type: string
          description: New space name.
      example:
        spaceId: "space-livingroom-001"
        name: "New Living Room"

    UpdateSpaceNameResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: string
              description: Empty string (Fixed).
            type:
              type: string
              enum:
              - UpdateSpaceNameResponse
      example:
        type: UpdateSpaceNameResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000007"
        code: 0
        message: success
        data: ""

    DeleteSpaceRequest:
      type: object
      required: [spaceId]
      properties:
        spaceId:
          type: string
          description: Space ID.
        deleteChildren:
          type: boolean
          default: false
          description: Whether to delete child spaces.
      example:
        spaceId: "space-livingroom-001"
        deleteChildren: false

    DeleteSpaceResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: string
            description: Empty string after successful deletion.
            example: ''
          type:
            type: string
            enum:
            - DeleteSpaceResponse
      example:
        type: DeleteSpaceResponse
        version: v1
        msgId: a1b2c3d4-e5f6-7890-abcd-000000000027
        code: 0
        message: success
        data: ''

    SpacesResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/SpaceNode'
            type:
              type: string
              enum:
              - GetSpacesResponse
      example:
        type: GetSpacesResponse
        version: v1
        msgId: "a1b2c3d4-e5f6-7890-abcd-000000000005"
        code: 0
        message: success
        data:
        - spaceId: space-home-001
          name: My home
          spatialMarking: home
          children:
          - spaceId: space-floor1-001
            parentSpaceId: space-home-001
            name: First floor
            spatialMarking: floor
            children: []
    # ── Device ───────────────────────────────────────────────────
    DeviceType:
      type: object
      required: [deviceType, name]
      properties:
        deviceType:
          type: string
          description: Device type code
        name:
          type: string
          description: Device type name

    DeviceInfo:
      type: object
      required: [deviceId, deviceName, deviceTypesList, createTime, state]
      properties:
        protocolId:
          type: string
          description: ID of the associated protocol instance, corresponding to protocols[].id from /devices/filter-options; omitted when no instance is attached. Used to associate an instance, not a protocol type code.
        networkProtocolMask:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          description: Full configuration category mask of the associated protocol instance type, using the same bit definitions as filter options and query parameters; not the device's real-time NetworkProtocolSupport Trait value. Omitted when there is no associated instance, the mask is not configured, or the configuration is invalid for supplemental-only responses; do not use 0 to mean unknown, and do not trim to only the bits that matched the query.
        deviceId:
          type: string
          description: Business device ID, same as the `id` of the `protocol.device` Resource; not the Network, Point, Job ID, or the point tool's `instanceId`.
        gatewayId:
          type: string
          nullable: true
          description: Gateway ID to which the device belongs
        deviceName:
          type: string
          description: Device name
        deviceTypesList:
          type: array
          items:
            type: string
          description: Device type list
        createTime:
          type: integer
          format: int64
          description: Creation time (UTC timestamp in milliseconds)
        state:
          type: boolean
          description: Online status
        space:
          $ref: '#/components/schemas/DeviceSpace'

    DeviceSpace:
      type: object
      required:
      - spaceId
      - name
      properties:
        parentSpaceId:
          type: string
          nullable: true
          description: Parent space ID; omitted when there is no parent space.
        spaceId:
          type: string
          description: Space ID
        name:
          type: string
          description: Space name

    DeviceDefinition:
      type: object
      required:
      - deviceId
      - name
      - deviceTypesList
      - endpoints
      properties:
        deviceId:
          type: string
          description: Business device ID, same as the `id` of the `protocol.device` Resource; not the Network, Point, Job ID, or the point tool's `instanceId`.
        gatewayId:
          type: string
          nullable: true
          description: |
            The gateway ID to which this device is bound.
            If `gatewayId` equals `deviceId`, it indicates that this device is itself a gateway.
            If `gatewayId` is `null` or an empty string, it means this device is a directly connected gateway without subdevices or a third-party integrated device.
        name:
          type: string
          description: Device name
        deviceTypesList:
          type: array
          items:
            type: string
          description: Device type list
        endpoints:
          type: array
          description: Endpoint list
          items:
            $ref: '#/components/schemas/Endpoint'
        capabilities:
          type: array
          items:
            type: string
          nullable: true
          description: Only returned when includeCapabilities=true.
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: User metadata returned only when includeMetadata=true.

