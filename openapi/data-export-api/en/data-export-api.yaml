openapi: 3.0.3
info:
  title: Data Export API
  termsOfService: https://domain.com/terms
  x-internal: true
  description: |
    Data Export API Documentation

    ## Common Request Headers
    All APIs require the following header parameters:
    | Header | Required | Description |
    |--------|----------|-------------|
    | Authorization | Yes | `Bearer accessToken` |
    | Content-Type | Yes | `application/json` |
  version: v1

servers:
  - url: '{host}/open/api/v1'
    description: Data Export API endpoint
    variables:
      host:
        description: |
          Please enter your Aqara Studio service address. This can be a local LAN IP (http).
          For example:
          - http://10.11.50.56
        default: '<Aqara_Studio_URL>'

# Global Security: All endpoints require Bearer Token
security:
  - BearerAuth: []

tags:
  - name: Space
    description: APIs for space hierarchy query
  - name: Device
    description: APIs for device query, attribute read/write, and command execution
  - name: Gateway
    description: APIs for gateway query
  - name: Resource
    description: APIs for Studio ANode whitelist resource directory, query, read, and secure modify
  - name: Automation
    description: APIs for automation creation, editing, querying, deletion, and capability
  - name: Firmware
    description: APIs for firmware query and upgrade
  - name: History
    description: APIs for device point value change history query
  - name: Studio
    description: APIs for studio statistic query
  - name: EMS
    description: APIs for energy management (energy trend query, total energy query, energy summary query)
  - name: Event
    description: APIs for external system event report
  - name: Alarm
    description: APIs for alarm list, confirmation, and rule query
  - name: Scene
    description: APIs for independent scene creation, editing, query, space association, execution, and deletion

paths:

  # ────────────────────────────────────────────────────────────────
  # List Spaces
  # ────────────────────────────────────────────────────────────────
  
  /events:
    post:
      tags: [Event]
      summary: Report External System Event
      description: Receive external events such as Claude/Codex hooks, CI, or monitoring alarms, and dispatch them to the automation `event.service_call` trigger block.
      operationId: reportExternalEvent
      x-idempotent: false
      x-retryable: false
      x-side-effects: event_dispatch
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalEventRequest'
            example:
              event: ci.build.completed
              source: github-actions
              payload:
                repository: aqara/example
                status: success
      responses:
        '200':
          description: The event has been received and dispatched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalEventResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  /spaces:
    get:
      tags: [Space]
      summary: List Spaces
      description: List all child spaces under the specified parent space. Optionally include the parent space itself to flexibly meet diverse hierarchical querying needs.
      operationId: getSpaces
      x-skill-intent: space.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: parentSpaceId
          in: query
          description: Parent space ID. If empty, the response will return all top-level spaces (spaces without a parent, i.e., root nodes of the space tree).
          required: false
          schema:
            type: string
        - name: needChildren
          in: query
          description: "Whether to query for child spaces under the parent space. If parentSpaceId is not empty and needChildren is false, child spaces will not be returned (the parent space itself may be returned only when `needParentSpaceSelf` is true)."
          required: false
          schema:
            type: boolean
            default: true
        - name: needParentSpaceSelf
          in: query
          description: Whether to include the parent space itself (corresponding to parentSpaceId). This takes effect only if parentSpaceId is not empty.
          required: false
          schema:
            type: boolean
            default: false
        - name: includeMetadata
          in: query
          description: Whether to include space metadata, default false.
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: The request has been successfully initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpacesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    post:
      tags: [Space]
      summary: Create A Space
      description: Create a space. When parentSpaceId is empty, a top-level (root) space will be created; if not empty, a child space will be created under the specified parent space.
      operationId: createSpace
      x-skill-intent: space.create
      x-idempotent: false
      x-retryable: false
      x-side-effects: create
      parameters:
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceRequest'
            example:
              parentSpaceId: "space-home-001"
              name: "Living Room"
      responses:
        '200':
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # Update Space Name
  # ────────────────────────────────────────────────────────────────
  /spaces/name:
    post:
      tags: [Space]
      summary: Update A Space Name
      description: Update the name of the specified space.
      operationId: updateSpaceName
      x-skill-intent: space.name.update
      x-idempotent: true
      x-retryable: true
      x-side-effects: update
      parameters: 
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSpaceNameRequest'
            example:
              spaceId: "space-livingroom-001"
              name: "New Living Room"
      responses:
        '200':
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSpaceNameResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':  
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # Delete Space
  /spaces/delete:
    post:
      tags: [Space]
      summary: Delete A Space
      description: Delete a space by space ID, optionally deleting child spaces.
      operationId: deleteSpace
      x-skill-intent: space.delete
      x-idempotent: true
      x-retryable: true
      x-side-effects: delete
      parameters:
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSpaceRequest'
            example:
              spaceId: "space-livingroom-001"
              deleteChildren: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # DeviceType Collection Query
  # ────────────────────────────────────────────────────────────────
  /devices/types:
    get:
      tags: [Device]
      summary: List Device Types
      description: Get all existing device types (DeviceType) in your Aqara Studio.
      operationId: getDeviceTypes
      x-skill-intent: device.type.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceTypesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # Get Device Filter Options
  # ────────────────────────────────────────────────────────────────
  /devices/filter-options:
    get:
      tags: [Device]
      summary: Get Device Filter Options
      description: |-
        Returns the protocol instances that have been created and are visible to the caller, which can be used as filter conditions for /devices.
        By default, all supported option categories are returned; currently, only protocols are supported. You can specify which categories to return via the 'fields' parameter; unrequested categories will not be returned. If there are no available instances, an empty array will be returned.
        Local calls can return instances that are offline or have no devices; cloud calls with device authorization enabled will only return instances associated with accessible devices. Blacklisted networks and cloud-exported networks are not returned as filter options.
        Instances without a public type or bit mask configured will still return id and name, with their type and networkProtocolMask explicitly set to null; internal framework types will not be returned.
        This API supports both local and cloud HTTP calls. Only options are returned; device counts are not provided. This API does not interlock with other device filter conditions and does not offer a WebSocket/MCP option querying entrance.
      operationId: getDeviceFilterOptions
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: fields
          required: false
          style: form
          explode: true
          description: By default, returns all supported categories, currently only "protocols". Supports repeated parameters or comma-separated values, trims whitespace and deduplicates. Explicit empty values, empty segments, or unknown categories result in 400; for example, fields=protocols, or fields=deviceTypes are invalid.
          schema:
            type: array
            minItems: 1
            items:
              type: string
              enum:
                - protocols
          example:
            - protocols
          in: query
      responses:
        '200':
          description: Success. If no available instances, data.protocols will be [].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFilterOptionsResponse'
              example:
                type: DeviceFilterOptionsResponse
                version: v1
                msgId: device-filter-options-001
                code: 0
                message: success
                data:
                  protocols:
                    - id: '1001'
                      name: Home Assistant
                      type: homeassistant
                      networkProtocolMask: null
                    - id: '1002'
                      name: Home Assistant(1)
                      type: homeassistant
                      networkProtocolMask: null
                    - id: '1003'
                      name: Matter
                      type: matter
                      networkProtocolMask: 2
                    - id: '1004'
                      name: Zigbee
                      type: zigbee
                      networkProtocolMask: 8
                    - id: '1005'
                      name: Aqara RS485
                      type: aqarars485
                      networkProtocolMask: 32
                    - id: '1006'
                      name: Custom protocol
                      type: null
                      networkProtocolMask: null
        '400':
          description: fields is empty, contains empty segments, or contains unknown categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The protocol type mapping configuration is invalid or an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'

  # ────────────────────────────────────────────────────────────────
  # Device List Query
  # ────────────────────────────────────────────────────────────────
  /devices:
    get:
      tags: [Device]
      summary: List Devices
      description: |
        Paginated device information query, supporting filter by space, online status, associated gateway, device type, and device name.
        Filtering by protocol instance ID, instance name, public protocol type, and network protocol mask is supported.

        Multiple values within the same list are combined with OR; multiple bits in the mask are OR’ed; different filter types and existing query conditions are combined with AND. Filtering is performed first, followed by totalCount calculation, sorting, and pagination.

        If no filter is provided, the default behavior is preserved; if all three lists are empty, there’s no restriction; unknown values will not match. protocolNames requires a complete and case-sensitive match; Home Assistant does not match Home Assistant(1).

        You may call /devices/filter-options first to obtain currently available instances; use the name for display, but we recommend using the stable id for persistent storage or specifying an instance. Protocol types are determined by server configuration, not all instances are required to have a type or networkProtocolMask.
        networkProtocolMask filters according to the type configuration of the instance, and does not read device's real-time NetworkProtocolSupport Trait. If omitted, there’s no restriction; if set to 0 or there’s no match, the result is empty.

        For each device, protocolId and networkProtocolMask are returned if available: the former is the associated protocol instance ID, the latter is the complete configured mask for that instance type (bits are not trimmed to match the query). If there is no associated instance, both fields are omitted; if there is an instance but no configured mask, only protocolId is returned. For ordinary queries or those filtered only by instance ID/name, an invalid mapping will only omit the mask in the response; filtering by type or nonzero mask still requires valid configuration.

        `gatewayId`—when omitted, empty, or contains only whitespace—does not participate in filtering; if a non-empty value is provided, leading and trailing whitespace are trimmed and an exact match is performed. Gateway filtering is applied together with other query conditions and takes effect before pagination.
      operationId: getDevices
      x-skill-intent: device.list
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: protocolIds
          required: false
          style: form
          explode: true
          description: 'Protocol instance IDs from /devices/filter-options protocols[].id; also supports "id:" prefix. Accepts repeated parameters or comma-separated values, trims leading/trailing spaces; values are combined by OR.'
          schema:
            type: array
            items:
              type: string
          example:
            - '1001'
            - '1002'
          in: query
        - name: protocolNames
          required: false
          style: form
          explode: true
          description: Protocol instance display name. Case-sensitive, requires exact match, preserves commas and leading/trailing spaces. Only repeated parameters are supported—no splitting by comma; values are combined by OR. After renaming, the old name no longer matches.
          schema:
            type: array
            items:
              type: string
          example:
            - Home Assistant
            - Home Assistant(1)
          in: query
        - name: protocolTypes
          required: false
          style: form
          explode: true
          description: Public protocol type code, matches all instances of this type. Trims leading/trailing spaces and is case-insensitive; supports repeated parameters or comma-separated values; values are combined by OR. Unknown codes will not match. Default supported codes include homeassistant, matter, zigbee, aqarahub, modbus, bacnet, knx, virtual, aqarars485; actual supported codes are based on server configuration and options response.
          schema:
            type: array
            items:
              type: string
          example:
            - matter
            - zigbee
          in: query
        - name: networkProtocolMask
          required: false
          allowEmptyValue: true
          description: "A single decimal Uint32 classification mask. Any bit match passes; combined with other filters using AND. Omitted means no restriction; 0 or no matches returns an empty result. Follows NetworkProtocolSupport (traitId=20870): Wi-Fi=1, Thread=2, Ethernet=4, Zigbee=8, BLE=16, Aqara RS485=32. Default mapping: Matter→Thread(2), Zigbee→8, Aqara RS485→32; passing 10 matches Thread or Zigbee. Matches server config classification, does not represent device's real-time capability. An empty value (networkProtocolMask=) or whitespace only ignores this filter (others still apply); any non-empty value must be a decimal integer. Repeated parameters (even with empty values), decimals, scientific notation, negatives, or values > 4294967295 return 400."
     
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 4294967295
          example: 10
          in: query
        - name: spaceIds
          in: query
          description: "Space ID list. Example: spaceIds=xx1,xx2 or spaceIds=xx1&spaceIds=xx2. If empty, all devices will be queried."
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: needChildren
          in: query
          description: "Whether to query devices in child spaces. Only effective when `spaceIds` is not empty."
          required: false
          schema:
            type: boolean
            default: false
        - name: spaceAssociated
          in: query
          description: "Whether to query devices under the specified `spaceIds`.<ul><li>true: Query only devices under the specified space(s).</li><li>false: Query only devices NOT under the specified space(s) (in this case, the `spaceIds` and `needChildren` parameters are ignored).</li><li>Not set:<ul><li>If `spaceIds` is empty, queries all devices by default.</li><li>If `spaceIds` is set, queries devices under the specified space(s) by default.</li></ul></li></ul>"
          required: false
          schema:
            type: boolean
            nullable: true
        - name: state
          in: query
          description: "Device online status. <ul><li>true: Query online devices.</li><li>false: Query offline devices.</li><li>Not set: Do not filter by status.</li></ul>"
          required: false
          schema:
            type: boolean
            nullable: true
        - name: gatewayId
          in: query
          description: Gateway ID. When omitted, empty, or whitespace-only, it does not affect filtering; when a value is present, leading and trailing whitespace are trimmed and an exact match is performed.
          required: false
          schema:
            type: string
          example: gateway-001
        - name: deviceTypesList
          in: query
          description: "Device type list. Example: deviceTypesList=light,switch or deviceTypesList=light&deviceTypesList=switch"
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: deviceTypesMatchMode
          in: query
          description: "Match mode for multiple device types in `deviceTypesList`: `or` means match any of the types, `and` means must match all types"
          required: false
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: deviceName
          in: query
          description: Device name fuzzy matching (case-insensitive, blank values are automatically ignored)
          required: false
          schema:
            type: string
        - name: orderBy
          in: query
          description: "Sorting method. <ul><li><code>createTime asc</code>: Sorts results by creation time in ascending order (oldest first).</li><li><code>createTime desc</code>: Sorts results by creation time in descending order (newest first).</li></ul>"
          required: false
          schema:
            type: string
            default: createTime asc
            enum: [createTime asc, createTime desc]
          example: createTime asc
        - name: pageNum
          in: query
          description: Page number
          required: false
          schema:
            type: integer
          example: 1
        - name: pageSize
          in: query
          description: Number of devices per page
          required: false
          schema:
            type: integer
          example: 200
      responses:
        '200':
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicesResponse'
              examples:
                devicesPage:
                  value:
                    type: GetDeviceInfoResponse
                    version: v1
                    msgId: "1751609244328"
                    code: 0
                    message: success
                    data:
                      totalCount: 2
                      pageNum: 1
                      pageSize: 200
                      data:
                        - deviceId: "device-001"
                          gatewayId: "gateway-001"
                          protocolId: "1004"
                          networkProtocolMask: 8                          
                          deviceName: "Living Room Light"
                          deviceTypesList: ["light"]
                          createTime: 1710001234567
                          state: true
                          space:
                            parentSpaceId: "space-home-001"
                            spaceId: "space-room-001"
                            name: "Living Room"
                        - deviceId: "device-002"
                          gatewayId: "gateway-001"
                          protocolId: "1001"
                          deviceName: "Living Room Switch"
                          deviceTypesList: ["switch"]
                          createTime: 1710002345678
                          state: true
                          space:
                            parentSpaceId: "space-home-001"
                            spaceId: "space-room-001"
                            name: "Living Room"
        '400':
          description: Query parameter error; this error is returned when networkProtocolMask is duplicated (even if containing empty values), non-empty and not a decimal integer, or out of Uint32 range. A single empty value or only whitespace will be ignored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          description: Returns 500 if protocol mapping needs to be read (when non-empty protocolTypes or non-zero networkProtocolMask are specified) and the mapping configuration is invalid; other internal errors may also result in a 500. If networkProtocolMask=0, an empty result is returned directly, and even if protocolTypes is specified, protocol mapping reading and validation are skipped—invalid mapping configuration will not cause a 500 in this case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # Query Device Definitions (Device Details)
  # ────────────────────────────────────────────────────────────────
  /devices/definitions:
    get:
      tags: [Device]
      summary: Query Device Definitions (Device Details)
      description: |
        Query device definitions (device details), including device types, endpoints, and properties.
      operationId: getDeviceDefinitions
      x-skill-intent: device.definition.get
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: deviceIds
          in: query
          required: true
          description: "Device ID list, up to 200. Example: deviceIds=xx1,xx2 or deviceIds=xx1&deviceIds=xx2"
          schema:
            type: array
            maxItems: 200
            items:
              type: string
          style: form
          explode: true
        - name: displayTags
          in: query
          required: false
          description: List of device tags.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: displayTagsMatchMode
          in: query
          description: Match mode for multiple tags in `displayTags`; `or` means any tag will match, `and` means all tags must be matched simultaneously.
          required: false
          schema:
            type: string
            enum:
            - or
            - and
            default: or
        - name: includeMetadata
          in: query
          required: false
          description: Whether to include device metadata, defaults to false.
          schema:
            type: boolean
            default: false
        - name: includeCapabilities
          in: query
          required: false
          description: Whether to include device capabilities, defaults to false.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Request succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDefinitionsResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

  # ────────────────────────────────────────────────────────────────
  # Query Device Matching Capabilities
  # ────────────────────────────────────────────────────────────────
  /devices/capabilities:
    post:
      tags:
      - Device
      summary: Batch Query Device Matching Capabilities and Current Trait Values
      description: 'Batch-query matching capabilities for the explicit `deviceIds` list. Always returns a device array, with no pagination. `deviceIds` is required, and the raw array may contain at most 20 items, including duplicates. After trimming, devices are queried in first-occurrence order with duplicates removed.

        Provide at least one non-empty list among `functionCodes`, `traitCodes`, and `commandCodes`. List items must not be blank, and array elements are not split by commas. Unknown fields and `pageNum`/`pageSize` return `400`.

        All devices use the same filter conditions. Matching rules are identical to GET: conditions of different categories are combined with AND, and an `and` match for traits or commands requires all codes to match within the same function.

        If only `functionCodes` is provided, the complete traits and commands under each matched function are returned. If leaf conditions are provided, only matched leaves are retained. Passing both `traitCodes` and `commandCodes` requires a function to satisfy both categories at the same time; this is not a union.

        If a device is accessible but no capabilities match, the device is retained with `endpoints=[]`. Devices that do not exist or are inaccessible are omitted. If all devices are omitted, `data=[]`. Results are ordered by the first occurrence of each requested ID, with no `hasMore` and no silent truncation.

        Current trait values are read from Studio''s current control points. They are not refreshed from physical devices, and a simultaneous snapshot across devices is not guaranteed. When available, `value`/`time` are returned. Null-value fields may be omitted, while `false` and `0` are returned normally. Commands have no current value.

        Definitions reuse the ordinary `DeviceDefinition` and do not include numeric `functionId`/`traitId`/`commandId`/`fieldId`. The request body is a JSON object directly and is not wrapped in `data`. The request text may contain at most 1 Mi characters.

        POST requires separate interface access authorization; GET permission alone does not implicitly grant access. Parameter errors return `400` for the whole batch. Unhandled query exceptions use the unified error response and are not disguised as successful partial results.'
      operationId: batchDeviceCapabilities
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeviceCapabilitiesRequest'
            examples:
              traits:
                summary: Query the OnOff trait for two devices (example codes)
                value:
                  deviceIds:
                  - device-a
                  - device-b
                  functionCodes:
                  - OnOff
                  traitCodes:
                  - OnOff
                  traitCodesMatchMode: or
              functions:
                summary: Return traits and commands under matched functions
                value:
                  deviceIds:
                  - device-a
                  - device-b
                  functionCodes:
                  - OnOff
              commands:
                summary: Query only the specified command (example code)
                value:
                  deviceIds:
                  - device-a
                  commandCodes:
                  - MoveToXYColor
      responses:
        '200':
          description: Success. `data` is always an array containing at most 20 devices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchDeviceCapabilitiesResponse'
              example:
                type: BatchDeviceCapabilitiesResponse
                version: v1
                msgId: batch-example
                code: 0
                message: success
                data:
                - deviceId: device-a
                  name: Example Light A
                  deviceTypesList:
                  - light
                  endpoints:
                  - endpointId: 2
                    endpointName: Main Light
                    deviceType: light
                    functions:
                    - functionCode: OnOff
                      traits:
                      - traitCode: OnOff
                        parameter:
                          type: Bool
                          readable: true
                          writable: true
                          subscribable: true
                        value: false
                        displayTags: []
                      commands: []
                - deviceId: device-b
                  name: Example Light B
                  deviceTypesList:
                  - light
                  endpoints:
                  - endpointId: 2
                    endpointName: Main Light
                    deviceType: light
                    functions:
                    - functionCode: OnOff
                      traits:
                      - traitCode: OnOff
                        parameter:
                          type: Bool
                          readable: true
                          writable: true
                          subscribable: true
                        value: true
                        displayTags: []
                      commands: []
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
    get:
      tags: [Device]
      summary: Query Single Device Matching Capabilities
      description: |
        Query the capabilities of a single device that meet the filter criteria. Only matched definitions and the current value for the corresponding traits will be returned. The full device definition will NOT be returned.

        :::tip
        - `functionCodes`, `traitCodes`, and `commandCodes` are combined using AND logic. To query for any trait or command capabilities, please send separate requests, or query the complete function definition using only `functionCodes`.
        - If only `functionCodes` are provided and neither `traitCodes` nor `commandCodes` are passed: all complete Trait and Command definitions under that Function (i.e., all leaf nodes) are returned.
        - If `traitCodes` or `commandCodes` are provided: only the Trait or Command leaves matching these criteria are returned; non-matching leaves are not returned. Commands do not include a current value.
        - If the device exists but no capabilities match, basic device info is returned with `endpoints=[]`. If the device does not exist or cannot be accessed, `data=null`.
        :::

      operationId: getMatchedDeviceCapabilities
      x-skill-intent: device.capability.match
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
        - name: deviceId
          in: query
          required: true
          description: Device ID（did）.
          schema:
            type: string
        - name: deviceTypesList
          in: query
          required: false
          description: |
            List of device types. The API first verifies the overall type of the device, and then filters endpoints by type.   

            :::tip
            `deviceTypesList` cannot be used on its own as a capability filter.
            :::

          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: deviceTypesMatchMode
          in: query
          required: false
          description: |
            Match mode for multiple types in `deviceTypesList`:
            - `or`: Device matches any of the types.
            - `and`: Device must match all specified types simultaneously.
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: functionCodes
          in: query
          required: false
          description: |
            List of function codes.
            At least one of `functionCodes`, `traitCodes`, or `commandCodes` must be provided.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: functionCodesMatchMode
          in: query
          required: false
          description: |
            Match mode for multiple `functionCodes`:
            - `or`: Match any.
            - `and`: The result must contain all specified function codes.
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: traitCodes
          in: query
          required: false
          description: |
            List of trait codes.
            At least one of `functionCodes`, `traitCodes`, or `commandCodes` must be provided.
            If matched, will return the trait definition, current value, and last updated time.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: traitCodesMatchMode
          in: query
          required: false
          description: |
            Match mode for multiple `traitCodes`:
            - `and`: All traits must be matched within the same function.
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: commandCodes
          in: query
          required: false
          description: |
            List of command codes.
            At least one of `functionCodes`, `traitCodes`, or `commandCodes` must be provided.
            If matched, will only return the command and parameter definitions (no current values).
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: commandCodesMatchMode
          in: query
          required: false
          description: |
            Match mode for multiple `commandCodes`:
            - `and`: All commands must be matched within the same function.
          schema:
            type: string
            enum: [or, and]
            default: or
          example: or
        - name: displayTags
          in: query
          required: false
          description: List of device tags.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: displayTagsMatchMode
          in: query
          required: false
          description: 'Match mode for multiple `displayTags`: `or` means any tag matches, `and` means all tags must match simultaneously.'
          schema:
            type: string
            enum:
            - or
            - and
            default: or
      responses:
        '200':
          description: Request succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMatchedDeviceCapabilitiesResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '404':
          $ref: '#/components/responses/NotFoundResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'

