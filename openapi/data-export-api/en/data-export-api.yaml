    DevicePointHistoryQueryRequest:
      type: object
      properties:
        deviceIds:
          type: array
          description: List of device IDs, up to 200; if omitted or an empty array, queries all current devices accessible in the current request context.
          maxItems: 200
          default: []
          items:
            type: string
        traitCodes:
          type: array
          description: |
            List of trait codes, up to 200.

            <ul><li>If <code>traitCodes</code> is omitted or <code>[]</code>, all traits accessible in the current request context are queried.</li>
            <li>If <code>traitCodes</code> contains traits that cannot be recognized, those traits are ignored; if all traits cannot be recognized, a parameter error is returned.</li>
            </ul>
          maxItems: 200
          default: []
          items:
            type: string
        startTime:
          type: integer
          format: int64
          minimum: 0
          description: |
            Query start time, Unix millisecond timestamp, inclusive of this time point.

            <ul><li>If both <code>startTime</code> and <code>endTime</code> are omitted, data from the most recent 7 days is queried by default.</li><li>If only one of the parameters is provided, the other is automatically inferred using a 7-day time window.</li><li>When using cursor pagination, you must pass the fixed <code>data.startTime</code> and <code>data.endTime</code> from the first response to ensure continuous and consistent data.</li></ul>
        endTime:
          type: integer
          format: int64
          minimum: 0
          description: |
            Query end time, Unix millisecond timestamp, exclusive of this time point. Must be greater than <code>startTime</code>; the maximum interval length is 7 days.

            Other rules are the same as for <code>startTime</code>.

        descending:
          type: boolean
          default: true
          description: |
            Whether to sort by time in descending order. For paginated requests, the <code>descending</code> parameter must be consistent with the first request.
            
            <ul><li><code>true</code>: Yes, sort by time in descending order.</li><li><code>false</code>: No, sort by time in ascending order.</li></ul>
        pageSize:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: Maximum number of records per page, range [1, 200]. Adjust when querying the next page; must maintain the same size when retrying the latest continuation request.
        cursor:
          type: string
          nullable: true
          description: |
            The `nextCursor` returned by the previous page.<ul><li>Omit this field for the initial request. To retrieve the next page, pass the `nextCursor` from the previous response.</li><li>For paginated requests, the <code>deviceIds</code>, <code>traitCodes</code>, <code>startTime</code>, <code>endTime</code>, and <code>descending</code> parameters must remain the same as in the initial request.</li><li>Omit this field for an initial query, when polling for the latest changes, or when starting a new query after the cursor becomes invalid.</li></ul>
    
    DevicePointHistoryItem:
      type: object
      required:
      - deviceId
      - value
      - unit
      - time
      - triggerPath
      properties:
        deviceId:
          type: string
          description: The device ID to which the historical record belongs.
