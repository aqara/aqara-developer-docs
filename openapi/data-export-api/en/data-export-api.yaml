    ResponseEnvelope:
      type: object
      x-business-success-condition: code == 0
      required:
      - version
      - msgId
      - code
      properties:
        type:
          type: string
          description: Optional message type. Don't determine success by this alone—check HTTP status and code.
        version:
          type: string
          description: API version
          example: v1
        msgId:
          type: string
          description: Message ID
        code:
          type: integer
          description: Business status code. Only 0 means success; non-zero under HTTP 200 means failure.
