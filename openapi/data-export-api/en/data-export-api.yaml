  # ────────────────────────────────────────────────────────────────
  # Query Device Trait Value Change History
  # ────────────────────────────────────────────────────────────────
  /history/device-point-values/query:
    post:
      tags: [History]
      summary: Query Device Trait Value Change History
      description: |
        This API is used to query the change history of multiple traits for multiple devices within a given time range. It supports continuous retrieval of historical records through the pagination cursor `cursor`.
        
        To query the latest changes, omit `cursor` to start a new query. Do not reuse a pagination cursor for polling.

        You may adjust `pageSize` when querying the next page with the most recently returned `nextCursor`. Only an identical retry of the latest continuation request is supported; `cursor`, `pageSize`, and all other query parameters must remain unchanged. After advancing, reading from an earlier `cursor` is not supported.

        Invalid parameters or an invalid `cursor` result in a `400` response. If the cursor expires or becomes invalid, omit `cursor` and start a new query; the query does not automatically resume from the beginning. A `503` response indicates that the query service is temporarily busy and may be retried.
      operationId: queryDevicePointHistory
      x-skill-intent: history.device_point_values.query
      x-idempotent: true
      x-retryable: true
      x-side-effects: none
      parameters:
        - $ref: '#/components/parameters/Lang'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevicePointHistoryQueryRequest'
            examples:
              queryLatestChanges:
                value:
                  deviceIds: ["device-001", "device-002"]
                  traitCodes: ["OnOff"]
                  startTime: 1770114300000
                  endTime: 1770639900000
                  descending: true
                  pageSize: 50
      responses:
        '200':
          description: Success
  
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePointHistoryQueryResponse'
        '400':
          $ref: '#/components/responses/BadRequestResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedResponse'
        '403':
          $ref: '#/components/responses/ForbiddenResponse'
        '502':
          $ref: '#/components/responses/BadGatewayResponse'
        '504':
          description: Cloud-to-Edge tunnel request timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
        '500':
          $ref: '#/components/responses/InternalServerErrorResponse'
        '503':
          description: Query service unavailable or query temporarily busy; retryable when temporarily busy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

