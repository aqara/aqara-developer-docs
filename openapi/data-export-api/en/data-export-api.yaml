    AutomationDslMetadata:
      type: object
      description: Metadata structure for defining basic information and variables of an automation.
      properties:
        name:
          type: string
          description: Display name; automation creation can fall back to this value. The scene name must be provided by the top-level 'name' in the request.
        description:
          type: string
          description: Description of the automation.
        scope:
          type: array
          description: Defines device property value variables that can be referenced throughout the script.
          items:
            $ref: '#/components/schemas/AutomationDslScopeDeviceProperty'
        variables:
          type: array
          description: Defines Flow local variables, which can be referenced by variable.flow. The value of each item is the initial literal value upon creation, not the current running value, and is not reset on each trigger.
          items:
            $ref: '#/components/schemas/AutomationDslFlowVariable'
      additionalProperties: false

    AutomationDslScopeDeviceProperty:
      type: object
      description: Device property variable defined in the scope.
      required:
      - type
      - name
      - deviceId
      - endpointId
      - functionCode
      - traitCode
      properties:
        type:
          type: string
          description: The value is fixed as `device.property`.
          enum:
          - device.property
        name:
          type: string
          description: Variable name, must be provided when defined in scope.
        deviceId:
          type: string
          description: Device ID.
        endpointId:
          type: integer
          description: Endpoint ID.
        functionCode:
          type: string
          description: Function code (e.g., OnOff, LevelControl).
        traitCode:
          type: string
          description: Trait code (e.g., OnOff, CurrentLevel).
        valuePath:
          type: string
          minLength: 1
          default: $
          description: Normalized single-value path for structure leaves; use $ for scalars and root values.
      additionalProperties: false

    AutomationDslFlowVariable:
      type: object
      description: Declaration of Flow local variable. The value here is the initial literal value at creation, not the current running value and will not be reset each time it is triggered. The value in actions and comparisons with the same name may be a value expression; they have different meanings. When omitted, the initial value is not explicitly set.
      required:
      - name
      - type
      properties:
        name:
          type: string
          minLength: 1
          description: Variable name.
        type:
          type: string
          description: Variable type.
          enum:
          - boolean
          - number
          - string
          - enum
        value:
          description: "Initial literal value at creation, not the current running value nor reset on each trigger. Must match the type: boolean for booleans, number for numbers, string/enum for strings. Null, arrays, objects, or reference expressions are not accepted. Different from value expressions in actions/comparisons. Explicit specification is recommended."
          anyOf:
          - type: boolean
          - type: number
          - type: string
      additionalProperties: false
      oneOf:
      - properties:
          type:
            enum:
            - boolean
          value:
            type: boolean
      - properties:
          type:
            enum:
            - number
          value:
            type: number
      - properties:
          type:
            enum:
            - string
            - enum
          value:
            type: string

    AutomationDslDeviceProperty:
      type: object
      description: Directly references a specific device property.
      required:
      - type
      - deviceId
      - endpointId
      - functionCode
      - traitCode
      properties:
        type:
          type: string
          description: The value is fixed as device.property.
          enum:
          - device.property
        name:
          type: string
          description: 兼容旧直接属性引用的可选标签，不参与设备定位，也不声明 scope 变量；规范回读可以省略。
        deviceId:
          type: string
          description: Device ID.
        endpointId:
          type: integer
          description: Endpoint ID.
        functionCode:
          type: string
          description: Function code (e.g., OnOff, LevelControl).
        traitCode:
          type: string
          description: Trait code (e.g., OnOff, CurrentLevel).
        valuePath:
          type: string
          minLength: 1
          default: $
          description: Normalized single-value path for structure leaves; use $ for scalars and root values.
      additionalProperties: false

    AutomationDslDataRef:
      type: object
      description: References a variable defined in metadata.scope.
      required:
      - type
      - select
      properties:
        type:
          type: string
          description: The value is fixed as `data.ref`.
          enum:
          - data.ref
        from:
          type: string
          description: Target path, fixed as /metadata/scope, can be omitted by default.
          enum:
          - /metadata/scope
        select:
          $ref: '#/components/schemas/AutomationDslSelectExpression'
      additionalProperties: false

    AutomationDslSelectExpression:
      type: object
      description: Selection expression to specify the variable to reference.
      required:
      - value
      properties:
        by:
          type: string
          description: Selection mode, fixed as name.
          enum:
          - name
        value:
          type: string
          description: Name of the variable to reference. Not the initial literal value in metadata.variables[].value nor the value expression in actions or comparisons.
      additionalProperties: false

    AutomationDslDatasource:
      description: Data source used to reference a device property or variable.
      oneOf:
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslDataRef'

    AutomationDslComparisonValue:
      description: Value for comparison, which can be a literal or a value expression. Not the same as the initial literal value in metadata.variables[].value.
      oneOf:
      - type: boolean
        description: Boolean literal.
      - type: number
        description: Number literal.
      - type: string
        description: String literal.
      - $ref: '#/components/schemas/AutomationDslDataRef'
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslFlowVariableRef'
      - $ref: '#/components/schemas/AutomationDslGlobalVariableRef'
      - $ref: '#/components/schemas/AutomationDslContextRef'
      - $ref: '#/components/schemas/AutomationDslNodeOutputRef'
 
    AutomationDslDuration:
      type: string
      description: Duration of time, must include at least one unit, e.g., 30sec, 5min, 1hour, 1hour10min20sec, 250ms. An empty string is invalid.
      pattern: ^(\d+hour)?(\d+min)?(\d+sec)?(\d+ms)?$
      minLength: 1

    AutomationDslTime:
      type: string
      description: Point in time, supports 24-hour format (HH:mm), AM/PM format (h:mm am/pm), and solar times (sunrise/sunset±offset).

    AutomationDslCron:
      type: string
      description: "Cron expression, format: second minute hour day month week year."

    AutomationDslAutomation:
      type: object
      description: Single automation definition.
      required:
      - starters
      - actions
      properties:
        starters:
          type: array
          description: List of trigger(s) (at least one required).
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslStarter'
        condition:
          $ref: '#/components/schemas/AutomationDslCondition'
        actions:
          type: array
          description: List of action(s) (at least one required)
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAction'
        conditions:
          type: array
          description: Multiple condition roots. Mutually exclusive with `condition`. Each entry specifies its inbound edges using `linkFrom`.
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        name:
          type: string
          description: Legacy rule label, can be different from `metadata.name`; the automation display name is determined by `metadata.name` or the `name` in the create request.
          nullable: true
      additionalProperties: false
      allOf:
      - not:
          required:
          - condition
          - conditions

    AutomationDslLinkFrom:
      type: object
      required:
      - node
      - port
      description: Connects the output port of the source node to the current node. If toPort is omitted, the target port defaults to "in".
      properties:
        node:
          type: string
          minLength: 1
        port:
          type: string
          enum:
          - out
          - 'true'
          - 'false'
          - error
        toPort:
          type: string
          minLength: 1
      additionalProperties: false

    AutomationDslStarter:
      description: Trigger, defining the condition(s) to trigger the automation.
      oneOf:
      - $ref: '#/components/schemas/AutomationDslPropertyEvent'
      - $ref: '#/components/schemas/AutomationDslTimeSchedule'
      - $ref: '#/components/schemas/AutomationDslAlarmEvent'
      - $ref: '#/components/schemas/AutomationDslServiceEvent'
      - $ref: '#/components/schemas/AutomationDslTimeFixed'
      - $ref: '#/components/schemas/AutomationDslTimeInterval'
      - $ref: '#/components/schemas/AutomationDslVariableChange'
      - $ref: '#/components/schemas/AutomationDslSustain'

    AutomationDslPropertyEvent:
      type: object
      description: Triggered when a device property changes. If no comparison operator is specified, any change will trigger. "for" means triggering only once after the comparison holds continuously for the given duration, with a reset if it fails. "suppressFor" is the interval during which no further triggers occur after triggering. "rising" and "falling" represent crossing the comparison value upwards or downwards; these cannot be used together with "for" or other comparison operators.
      required:
      - type
      - source
      properties:
        type:
          type: string
          description: The value is fixed as `property.event`.
          enum:
          - property.event
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDatasource'
          description: Data source of the device property to be listened to.
        is:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when property becomes this value. Mutually exclusive with other comparison operators.
        isNot:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when property becomes a value not equal to this. Mutually exclusive with other comparison operators.
        greaterThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when property becomes greater than this value. Mutually exclusive with other comparison operators.
        greaterThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when property becomes greater than or equal to this value. Mutually exclusive with other comparison operators.
        lessThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when property becomes less than this value. Mutually exclusive with other comparison operators.
        lessThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when property becomes less than or equal to this value. Mutually exclusive with other comparison operators.
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: Once the property meets the comparison result, trigger only if it holds for this duration. This is a stabilization period before triggering. To check the duration of current value, use "for" of property.state. For not reading the current value on start, use "sustain".
        suppressFor:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: Do not trigger again within this duration after a trigger.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, assigned on import.
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers cannot have inbound edges. Omit this field or use an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        rising:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when the value crosses this threshold upwards. Cannot be used with "for" or other comparison operators.
        falling:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: Trigger when the value crosses this threshold downwards. Cannot be used with "for" or other comparison operators.
     
      additionalProperties: false
      not:
        anyOf:
        - required:
          - is
          - isNot
        - required:
          - is
          - greaterThan
        - required:
          - is
          - greaterThanOrEqualTo
        - required:
          - is
          - lessThan
        - required:
          - is
          - lessThanOrEqualTo
        - required:
          - is
          - rising
        - required:
          - is
          - falling
        - required:
          - isNot
          - greaterThan
        - required:
          - isNot
          - greaterThanOrEqualTo
        - required:
          - isNot
          - lessThan
        - required:
          - isNot
          - lessThanOrEqualTo
        - required:
          - isNot
          - rising
        - required:
          - isNot
          - falling
        - required:
          - greaterThan
          - greaterThanOrEqualTo
        - required:
          - greaterThan
          - lessThan
        - required:
          - greaterThan
          - lessThanOrEqualTo
        - required:
          - greaterThan
          - rising
        - required:
          - greaterThan
          - falling
        - required:
          - greaterThanOrEqualTo
          - lessThan
        - required:
          - greaterThanOrEqualTo
          - lessThanOrEqualTo
        - required:
          - greaterThanOrEqualTo
          - rising
        - required:
          - greaterThanOrEqualTo
          - falling
        - required:
          - lessThan
          - lessThanOrEqualTo
        - required:
          - lessThan
          - rising
        - required:
          - lessThan
          - falling
        - required:
          - lessThanOrEqualTo
          - rising
        - required:
          - lessThanOrEqualTo
          - falling
        - required:
          - rising
          - falling
        - required:
          - rising
          - for
        - required:
          - falling
          - for

    AutomationDslTimeSchedule:
      type: object
      description: Scheduled trigger. Only one of cron or at can be used; both use the site time zone; the timezone parameter is not accepted. repeatDays and location are used only for at, and location is only used for sunrise and sunset.
      required:
      - type
      properties:
        type:
          type: string
          description: The value is fixed as `time.schedule`.
          enum:
          - time.schedule
        cron:
          allOf:
          - $ref: '#/components/schemas/AutomationDslCron'
          description: Cron expression, in the format "seconds minutes hours day month week year". Uses site time zone, mutually exclusive with at.
        at:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: Time point in a day, uses site time zone, mutually exclusive with cron.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers cannot have incoming sides. Omit or give an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        repeatDays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          minItems: 1
          uniqueItems: true
          description: 1 means Monday, 7 means Sunday. Only used for at. Omitted means every day. Cannot appear together with cron.
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: Latitude and longitude used for sunrise and sunset calculation. Only used for sunrise or sunset in at.
      additionalProperties: false
      oneOf:
      - required:
        - cron
      - required:
        - at
      allOf:
      - allOf:
        - anyOf:
          - not:
              required:
              - cron
          - not:
              anyOf:
              - required:
                - repeatDays
              - required:
                - location

    AutomationDslAlarmEvent:
      type: object
      description: Triggered when an alarm enters a specified state. alarmId refers to an existing alarm rule; do not guess using the automation id. When saving, the reference is not checked for existence; if the target cannot be found at startup, this trigger will not fire.
      required:
      - type
      - alarmId
      - alarmState
      properties:
        type:
          type: string
          enum:
          - event.alarm
        alarmId:
          type: string
          minLength: 1
          description: Reference to an existing alarm rule.
        alarmState:
          type: string
          enum:
          - active_unacked
          - active_acked
          - normal_unacked
          - normal_acked
          description: Triggers when entering this state. active_unacked for unacknowledged activation, active_acked for acknowledged activation, normal_unacked for unacknowledged recovery, normal_acked for acknowledged recovery.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers cannot have incoming side. Omit or give an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslServiceEvent:
      type: object
      description: External events or service node events. Omit serviceId or use externalEventService to listen for external events; other values reference internal service nodes, using eventName as the property name. The reference is not checked for existence at save time; if the target is missing at startup, this trigger will not fire.
      required:
      - type
      - eventName
      properties:
        type:
          type: string
          enum:
          - event.service_call
        serviceId:
          type: string
          description: Omitted or externalEventService represents an external event. Other values are references to internal service nodes.
        eventName:
          type: string
          minLength: 1
          description: Event name. For internal service nodes, this is the event property name.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers cannot have incoming sides. Omit or give an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslCondition:
      description: Condition, defines what must be satisfied before executing actions.
      oneOf:
      - $ref: '#/components/schemas/AutomationDslAndCondition'
      - $ref: '#/components/schemas/AutomationDslOrCondition'
      - $ref: '#/components/schemas/AutomationDslNotCondition'
      - $ref: '#/components/schemas/AutomationDslPropertyState'
      - $ref: '#/components/schemas/AutomationDslTimeBetween'
      - $ref: '#/components/schemas/AutomationDslXorCondition'
      - $ref: '#/components/schemas/AutomationDslTimeRangeFixed'
      - $ref: '#/components/schemas/AutomationDslFlowState'
      - $ref: '#/components/schemas/AutomationDslCompare'
      - $ref: '#/components/schemas/AutomationDslTriggerValueCondition'

    AutomationDslAndCondition:
      type: object
      description: All sub-conditions must be satisfied. At least two sub-conditions.
      required:
      - type
      - conditions
      properties:
        type:
          type: string
          description: The value is fixed as `and`.
          enum:
          - and
        conditions:
          type: array
          description: List of sub-conditions (at least two).
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, connection is determined by array position. Empty array means no upstream connection.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslOrCondition:
      type: object
      description: Any one of the sub-conditions is satisfied. At least two sub-conditions.
      required:
      - type
      - conditions
      properties:
        type:
          type: string
          description: The value is fixed as `or`.
          enum:
          - or
        conditions:
          type: array
          description: List of sub-conditions (at least two)
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, connection is determined by array position. Empty array means no upstream connection.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslNotCondition:
      type: object
      description: The sub-condition is not satisfied.
      required:
      - type
      - condition
      properties:
        type:
          type: string
          description: The value is fixed as `not`.
          enum:
          - not
        condition:
          allOf:
          - $ref: '#/components/schemas/AutomationDslCondition'
          description: The condition to negate.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, connection is determined by array position. Empty array means no upstream connection.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslPropertyState:
      type: object
      description: Check the current value of a property. Exactly one comparator must be used. for means the comparison must have persisted for the given duration. rising and falling indicate crossing the comparison value and cannot be used with for.
      required:
      - type
      - source
      properties:
        type:
          type: string
          description: The value is fixed as `property.state`.
          enum:
          - property.state
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDatasource'
          description: The data source of the device property to check.
        is:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The current value equals this value.
        isNot:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The current value does not equal this value.
        greaterThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The current value is greater than this value.
        greaterThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The current value is greater than or equal to this value.
        lessThan:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The current value is less than this value.
        lessThanOrEqualTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The current value is less than or equal to this value.
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: The comparison must have held for this duration when checked. It does not trigger by itself. For stabilization after a change, use property.event's for. Does not read current value on startup, use sustain.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, connection is by position; empty array means floating node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        rising:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The value crossed this value upward. Cannot be used with for or other comparators.
        falling:
          allOf:
          - $ref: '#/components/schemas/AutomationDslComparisonValue'
          description: The value crossed this value downward. Cannot be used with for or other comparators.
      additionalProperties: false
      allOf:
      - oneOf:
        - required:
          - is
        - required:
          - isNot
        - required:
          - greaterThan
        - required:
          - greaterThanOrEqualTo
        - required:
          - lessThan
        - required:
          - lessThanOrEqualTo
        - required:
          - rising
        - required:
          - falling
      - not:
          anyOf:
          - required:
            - rising
            - for
          - required:
            - falling
            - for

    AutomationDslTimeBetween:
      type: object
      description: Checks whether the current time is between after and before. If after is later than before, the window crosses midnight. repeatDays omitted means every day. location is used only for sunrise and sunset.
      required:
      - type
      - after
      - before
      properties:
        type:
          type: string
          description: The value is fixed as `time.between`.
          enum:
          - time.between
        after:
          type: string
          description: Window start time.
        before:
          type: string
          description: Window end time. If earlier than after, the window crosses midnight.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script; if omitted, one will be assigned upon import
        linkFrom:
          type: array
          description: Incoming side. If omitted, the node is connected by position; empty array means this node is floating
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        repeatDays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
          minItems: 1
          uniqueItems: true
          description: 1 means Monday, 7 means Sunday. Omitted means every day.
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: Latitude and longitude for sunrise and sunset calculations.
      additionalProperties: false

    AutomationDslEventStateHold:
      type: object
      required:
      - type
      - target
      - holdMs
      properties:
        type:
          enum:
          - action.event_state_hold
          type: string
        target:
          allOf:
          - $ref: '#/components/schemas/AutomationDslAssignmentTarget'
          description: A flow or global boolean variable, or a writable boolean device property.
        holdMs:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: true
      description: "Event state hold: each event sets the boolean variable to true and renews the hold; after `holdMs` milliseconds from the last event, it is set to false. After the input completes, proceed on `out` immediately; timeout only updates the variable. On start, clear to false; on stop, cancel and clear the active state."

    AutomationDslTriggerValueSource:
      type: object
      description: Root device point and struct leaf address of the event trigger value.
      required:
      - deviceId
      - resourceId
      - valuePath
      properties:
        deviceId:
          type: string
          minLength: 1
        resourceId:
          type: string
          minLength: 1
        valuePath:
          type: string
          minLength: 1
          description: Canonical single-value path; use `$` for the root value.
      additionalProperties: true

    AutomationDslTriggerValueExpression:
      type: object
      description: Read-only reference to the event snapshot value at this Flow execution entry.
      required:
      - type
      - eventNodeId
      - source
      - valueType
      properties:
        type:
          type: string
          enum:
          - variable.trigger
        eventNodeId:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/AutomationDslTriggerValueSource'
        unit:
          type: string
          description: Unit snapshot at configuration time, used for later unit migration.
        unitId:
          type: string
          description: Studio unit unique ID at configuration time, used for stable unit identification.
        valueType:
          type: string
          enum:
          - boolean
          - number
          - string
          - enum
      additionalProperties: true

    AutomationDslTriggerValueCondition:
      type: object
      description: Compares the event snapshot value at this execution entry; does not read the device's current state.
      required:
      - type
      - source
      - op
      - value
      properties:
        type:
          type: string
          enum:
          - condition.trigger_value
        source:
          $ref: '#/components/schemas/AutomationDslTriggerValueExpression'
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
        value:
          $ref: '#/components/schemas/AutomationDslValueExpression'
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: true  

    AutomationDslAction:
      description: Action to be executed after the automation is triggered.
      oneOf:
      - $ref: '#/components/schemas/AutomationDslTraitWrite'
      - $ref: '#/components/schemas/AutomationDslCommandCall'
      - $ref: '#/components/schemas/AutomationDslDelay'
      - $ref: '#/components/schemas/AutomationDslSceneExecute'
      - $ref: '#/components/schemas/AutomationDslVariableSet'
      - $ref: '#/components/schemas/AutomationDslScriptRun'
      - $ref: '#/components/schemas/AutomationDslFlowManage'
      - $ref: '#/components/schemas/AutomationDslLoopManage'
      - $ref: '#/components/schemas/AutomationDslMathAction'
      - $ref: '#/components/schemas/AutomationDslStringConcatAction'
      - $ref: '#/components/schemas/AutomationDslStringSubstringAction'
      - $ref: '#/components/schemas/AutomationDslStringAssignAction'
      - $ref: '#/components/schemas/AutomationDslStringCaseAction'
      - $ref: '#/components/schemas/AutomationDslAggregateAction'
      - $ref: '#/components/schemas/AutomationDslVariableToggle'
      - $ref: '#/components/schemas/AutomationDslMessagePush'
      - $ref: '#/components/schemas/AutomationDslDeviceBatch'
      - $ref: '#/components/schemas/AutomationDslEventStateHold'

    AutomationDslTraitWrite:
      type: object
      description: Write a device property. Value can only be boolean, number, or string. The string "toggle" will invert the boolean property. For other types, "toggle" will be interpreted as a normal string.
      required:
      - type
      - functionCode
      - traitCode
      - targets
      - value
      properties:
        type:
          type: string
          description: The value is fixed as `device.trait.write`.
          enum:
          - device.trait.write
        functionCode:
          type: string
          description: Function code.
        traitCode:
          type: string
          description: Property code.
        targets:
          type: array
          description: Devices and endpoints to be written.
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslEndpointInfo'
        value:
          description: Scalar value to write to the device this time. Only accepts boolean, number, or string, no value expressions. For boolean traits, the string "toggle" inverts the current value. This is not the same as the initial value in variable declarations.
          oneOf:
          - type: boolean
          - type: number
          - type: string
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        executionMode:
          type: string
          enum:
          - batch
          - null
          description: Compatibility flag for reading back the legacy batch toggle. Keep `batch` while editing; after save it remains a single batch node. When omitted, use the default device-action fan-out.
          nullable: true
      additionalProperties: false

    AutomationDslEndpointInfo:
      type: object
      description: Endpoint information.
      required:
      - deviceId
      - endpointIds
      properties:
        deviceId:
          type: string
          description: Device ID.
        endpointIds:
          type: array
          description: List of endpoint (function point) IDs of the device.
          minItems: 1
          items:
            type: integer
      additionalProperties: false

    AutomationDslCommandCall:
      type: object
      description: Call a device command. Parameter values can only be boolean, number, or string.
      required:
      - type
      - functionCode
      - commandCode
      - targets
      properties:
        type:
          type: string
          description: The value is fixed as `device.command.call`.
          enum:
          - device.command.call
        functionCode:
          type: string
          description: Function code.
        commandCode:
          type: string
          description: Command code.
        targets:
          type: array
          description: Devices and endpoints to execute the command on.
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslEndpointInfo'
        args:
          type: array
          description: Command arguments. The value of each item is a scalar.
          items:
            $ref: '#/components/schemas/AutomationDslCommandArg'
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslCommandArg:
      type: object
      description: Command argument.
      required:
      - fieldCode
      - value
      properties:
        fieldCode:
          type: string
          description: Parameter ID.
        value:
          description: Scalar value for the command argument. Only accepts boolean, number, or string, no value expressions. This is not the same as the initial value in variable declarations.
          oneOf:
          - type: boolean
          - type: number
          - type: string
      additionalProperties: false

    AutomationDslDelay:
      type: object
      description: Wait for a given duration before continuing with the next action. If duration is 0, continue immediately.
      required:
      - type
      - for
      properties:
        type:
          type: string
          description: The value is fixed as `delay`.
          enum:
          - delay
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: Wait duration. "0sec" means continue immediately.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslSceneExecute:
      type: object
      description: Execute the scene specified by sceneId, then proceed to the next step. Does not wait for the entire scene to finish. Does not accept params.
      required:
      - type
      - sceneId
      properties:
        type:
          type: string
          description: The value is fixed as `action.scene_execute`.
          enum:
          - action.scene_execute
        sceneId:
          type: string
          pattern: ^auto_[A-Za-z0-9-]+$
          description: Copy the sceneId returned by list_scenes or get_scene_details as is.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslAssignmentTarget:
      type: object
      required:
      - type
      - scope
      properties:
        type:
          type: string
          enum:
          - variable
        scope:
          type: string
          enum:
          - device
          - flow
          - global
          description: device writes to device property, flow writes to local flow variable, global writes to global variable.
        deviceId:
          type: string
          minLength: 1
          description: Device id if scope is device.
        resourceId:
          type: string
          minLength: 1
          pattern: ^\d+\.[^.]+\.[^.]+$
          description: endpoint.function.trait if scope is device.
        id:
          type: string
          minLength: 1
          description: Variable id if scope is flow or global. For flow, use the name in metadata.variables. For global, reference an existing global variable.
      additionalProperties: false
      oneOf:
      - properties:
          scope:
            enum:
            - device
        required:
        - deviceId
        - resourceId
        not:
          required:
          - id
      - properties:
          scope:
            enum:
            - flow
            - global
        required:
        - id
        not:
          anyOf:
          - required:
            - deviceId
          - required:
            - resourceId
      description: "Assignment target. If scope is device, provide deviceId and resourceId (format: endpoint.function.trait). If scope is flow or global, only provide id."

    AutomationDslVariableSet:
      type: object
      required:
      - type
      - target
      - value
      properties:
        type:
          type: string
          enum:
          - action.variable_set
        target:
          allOf:
          - $ref: '#/components/schemas/AutomationDslAssignmentTarget'
          description: Assignment destination.
        value:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Value to be assigned this time, can be a literal or a value expression. Not the same as the initial value in metadata.variables[].value.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false
      description: Write value to target. Device scope authorization cannot write to targets with scope global.

    AutomationDslScriptRun:
      type: object
      required:
      - type
      - script
      properties:
        type:
          type: string
          enum:
          - action.script_run
        script:
          type: string
          maxLength: 65536
          description: JavaScript to execute. If blank, skip and continue to the next step.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false
      description: Execute JavaScript. If script is empty, continue directly. In the script you can use ctx.readVar, ctx.writeVar, log.info, and log.warn. Not available with device scope authorization.

    AutomationDslFlowManage:
      type: object
      required:
      - type
      - automationId
      - enabled
      properties:
        type:
          type: string
          enum:
          - action.flow_manage
        enabled:
          type: boolean
          description: true to enable the target, false to disable.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the whole script; if omitted, one will be assigned upon import.
        linkFrom:
          type: array
          description: Incoming side. If omitted, wiring is by action array order. An empty array means no upstream node.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        automationId:
          type: string
          minLength: 1
          pattern: ^auto_[A-Za-z0-9-]+$
          description: Copy the automationId returned by list_automations as is; do not construct manually.
      additionalProperties: false
      description: Persistently modify the enabled state of the target automation. automationId is copied as is from list_automations return. Scenes do not support enabled state. If the target is invalid, stop and do not run subsequent actions. Not available with device scope authorization.
 
    AutomationDslLoopManage:
      type: object
      required:
      - type
      - loopId
      - enabled
      properties:
        type:
          type: string
          enum:
          - action.loop_manage
        loopId:
          type: string
          minLength: 1
          description: Internal reference of the target time.interval.
        enabled:
          type: boolean
          description: true to start the loop, false to stop the loop.
        id:
          type: string
          minLength: 1
          description: Node id, unique within the script. If omitted, assigned during import.
        linkFrom:
          type: array
          description: Incoming side. Omitted for action array order wiring. An empty array means no upstream.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false
      description: Turn on or off the operation switch of a time.interval node without modifying its configuration. loopId is the internal reference of the loop node. If the target is invalid, stop and do not run subsequent actions. Not available with device scope authorization.

    AutomationDslFlowVariableRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - variable.flow
        id:
          type: string
          minLength: 1
          description: Name of the flow variable.
      additionalProperties: false
      description: Read the variable of this flow. id is the name field in metadata.variables.

    AutomationDslGlobalVariableRef:
      type: object
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - variable.global
        id:
          type: string
          minLength: 1
          description: Reference to an existing global variable.
      additionalProperties: false
      description: Read an existing global variable. Not available with device scope authorization.

    AutomationDslContextRef:
      type: object
      required:
      - type
      - path
      properties:
        type:
          type: string
          enum:
          - context
        path:
          type: string
          minLength: 1
          description: The value is fixed as 'trigger.timestamp', means the timestamp (in ms) of the current trigger.
          enum:
          - trigger.timestamp
      additionalProperties: false
      description: Read the context of the current trigger.

    AutomationDslValueExpression:
      description: Value used in actions and comparisons. Can be a literal, a variable reference, a device property, or a node output. Not the same as the initial literal in metadata.variables[].value.
      oneOf:
      - anyOf:
        - type: boolean
        - type: number
        - type: string
        nullable: true
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslDataRef'
      - $ref: '#/components/schemas/AutomationDslFlowVariableRef'
      - $ref: '#/components/schemas/AutomationDslGlobalVariableRef'
      - $ref: '#/components/schemas/AutomationDslContextRef'
      - $ref: '#/components/schemas/AutomationDslNodeOutputRef'
      - $ref: '#/components/schemas/AutomationDslTriggerValueExpression'

    AutomationDslGeoLocation:
      type: object
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude, degrees, range -90 to 90.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude, degrees, range -180 to 180.
      additionalProperties: false

    AutomationDslNodeOutputRef:
      type: object
      required:
      - type
      - nodeId
      - port
      properties:
        type:
          type: string
          enum:
          - node.output
        nodeId:
          type: string
          minLength: 1
          description: The id of the node producing this value.
        port:
          type: string
          minLength: 1
          description: The value is fixed as 'result', means the computed result of that node.
          enum:
          - result
      additionalProperties: false
      description: Read the computed value of another node.

    AutomationDslTimeFixed:
      type: object
      description: Trigger once at a specific time on a given date. date must be valid yyyy-MM-dd, otherwise the entire config is rejected. location is only used for sunrise/sunset.
      required:
      - type
      - date
      - time
      properties:
        type:
          type: string
          enum:
          - time.fixed
        date:
          type: string
          description: Date, format yyyy-MM-dd.
          pattern: ^\d{4}-\d{2}-\d{2}$
        time:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: Time of the day.
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: Geolocation for sunrise/sunset calculation.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers must have no incoming side. Omit or provide an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslTimeInterval:
      type: object
      description: Trigger at fixed intervals. 'for' is the interval between two triggers, not the duration the condition must persist. If loopCount is omitted or 0, it loops indefinitely. If enabled is omitted, it is enabled by default.
      required:
      - type
      - for
      properties:
        type:
          type: string
          enum:
          - time.interval
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: Interval between triggers. Not the duration to hold a property or sustain period.
        name:
          type: string
          description: Name of this recurring trigger.
        enabled:
          type: boolean
          description: Defaults to true. false means not started after creation, can be started by action.loop_manage.
        loopCount:
          type: integer
          minimum: 0
          description: Maximum number of triggers. Omit or set to 0 for unlimited.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers must have no incoming side. Omit or provide an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslVariableChange:
      type: object
      description: Triggered when the value of a variable changes. The variable must be a reference that can change; literals do not trigger.
      required:
      - type
      - variable
      properties:
        type:
          type: string
          enum:
          - variable.change
        variable:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: The variable to listen to. Use variable.flow, variable.global, or device.property.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers must have no incoming side. Omit or provide an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslXorCondition:
      type: object
      description: True if an odd number of subconditions are true. Requires at least two subconditions.
      required:
      - type
      - conditions
      properties:
        type:
          type: string
          enum:
          - xor
        conditions:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/AutomationDslCondition'
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
          description: Incoming side. Omitted uses position in the array as wiring. An empty array means no upstream nodes.
      additionalProperties: false

    AutomationDslTimeRangeFixed:
      type: object
      description: Check whether the current time is between two dates and times. Dates must be valid yyyy-MM-dd, otherwise the entire config is rejected. afterTime and beforeTime support sunrise/sunset and offset; if using solar time, location provides coordinates.
      required:
      - type
      - afterDate
      - afterTime
      - beforeDate
      - beforeTime
      properties:
        type:
          type: string
          enum:
          - time.range.fixed
        afterDate:
          type: string
          description: Date, format yyyy-MM-dd.
          pattern: ^\d{4}-\d{2}-\d{2}$
        afterTime:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: Start time for the start date, supports fixed time, sunrise/sunset and offset.
        beforeDate:
          type: string
          description: Date, format yyyy-MM-dd.
          pattern: ^\d{4}-\d{2}-\d{2}$
        beforeTime:
          allOf:
          - $ref: '#/components/schemas/AutomationDslTime'
          description: End time for the end date, supports fixed time, sunrise/sunset and offset.
        location:
          allOf:
          - $ref: '#/components/schemas/AutomationDslGeoLocation'
          description: Geolocation for sunrise/sunset calculation.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslFlowState:
      type: object
      description: Whether the enabled state of the target automation equals enabled. automationId should be copied as is from the list_automations result. Scenes do not support enabled.
      required:
      - type
      - automationId
      - enabled
      properties:
        type:
          type: string
          enum:
          - flow.state
        enabled:
          type: boolean
          description: true means the target must be enabled, false means the target must be disabled.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
        automationId:
          type: string
          minLength: 1
          pattern: ^auto_[A-Za-z0-9-]+$
          description: Direct copy of automationId from list_automations return value, do not construct manually.
      additionalProperties: false

    AutomationDslSustain:
      type: object
      description: This block listens to source itself. When the comparison holds for the duration 'for', triggers once. Does not read the current value on start; waits for the next change to start timing. After triggering, must NOT satisfy, then satisfy for 'for' again to re-trigger. If op is omitted, defaults to eq. rising and falling not supported. To debounce after value change, use property.event's 'for'; to check if current value has lasted, use property.state's 'for'.
      required:
      - type
      - source
      - for
      - value
      properties:
        type:
          type: string
          enum:
          - sustain
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: The value to listen on.
        for:
          allOf:
          - $ref: '#/components/schemas/AutomationDslDuration'
          description: Duration for which the comparison must be true. Does not read current value on start. After one trigger, must become false before retriggering.
        op:
          type: string
          description: Comparison operator. Defaults to eq if omitted. Can't use rising/falling.
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
        value:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Right-hand value for the comparison. Can be literal or value expression. Is NOT the initial value in metadata.variables[].value.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          maxItems: 0
          description: Triggers must have no incoming side. Omit or provide an empty array.
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslCompare:
      type: object
      description: Compare left and right values. eq, neq, gt, gte, lt, lte compare current values. rising and falling mean left crosses right.
      required:
      - type
      - left
      - op
      - right
      properties:
        type:
          type: string
          enum:
          - compare
        left:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Left-hand value.
        op:
          type: string
          enum:
          - eq
          - neq
          - gt
          - gte
          - lt
          - lte
          - rising
          - falling
          description: eq-lte compare current value; rising means left crosses right upward; falling means downward.
        right:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Right-hand value.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslMathAction:
      type: object
      description: Math operation. abs, sqrt, floor, ceil, round, ln, log10, exp only use left. Division by 0 triggers error output. If assignTo is omitted, result is left at this node.
      required:
      - type
      - op
      properties:
        type:
          type: string
          enum:
          - data.math
        op:
          type: string
          description: Math operator.
          enum:
          - add
          - sub
          - mul
          - div
          - modulus
          - pow
          - bitAnd
          - bitOr
          - bitXor
          - min
          - max
          - abs
          - sqrt
          - floor
          - ceil
          - round
          - ln
          - log10
          - exp
          - shiftLeft
          - shiftRight
        left:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Left operand. Used for unary operations.
        right:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Right operand. Ignored for unary operations.
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: Where to write the result. If omitted, result is left at this node.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringConcatAction:
      type: object
      description: Concatenate left and right as a string. Omitted sides are treated as empty string.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - data.string.concat
        left:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Left part. Defaults to empty string if omitted.
        right:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Right part. Defaults to empty string if omitted.
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: Where to write the result. If omitted, result is left at this node.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringSubstringAction:
      type: object
      description: Take length characters from source starting from start. If start is negative, count from the end. If length <= 0, result is an empty string.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - data.string.substring
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: The string to substring. Defaults to empty string if omitted.
        start:
          type: integer
          description: Starting position, begins at 0. Negative is counted from the end. Defaults to 0 if omitted.
        length:
          type: integer
          description: Length to cut. If <= 0, result is an empty string. Defaults to 0 if omitted.
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: Where to write the result. If omitted, result is left at this node.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringAssignAction:
      type: object
      description: Write the same string to multiple variables or device properties.
      required:
      - type
      - targets
      properties:
        type:
          type: string
          enum:
          - data.string.assign
        source:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: The string to write. Defaults to empty string if omitted.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: Targets to write. Each item is device.property, variable.flow or variable.global.
          minItems: 1
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslStringCaseAction:
      type: object
      description: Change case of target strings. Defaults to upper if mode is omitted.
      required:
      - type
      - targets
      properties:
        type:
          type: string
          enum:
          - data.string.case
        targets:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: Targets to convert and write back.
          minItems: 1
        mode:
          type: string
          enum:
          - upper
          - lower
          description: "'upper' to uppercase, 'lower' to lowercase. Defaults to upper if omitted."
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslAggregateAction:
      type: object
      description: Aggregate numeric values. values must have at least one entry. If no numbers to aggregate or calculation fails, triggers error output (result is not 0). If assignTo is omitted, result is left at this node.
      required:
      - type
      - op
      - values
      properties:
        type:
          type: string
          enum:
          - data.aggregate
        op:
          type: string
          enum:
          - avg
          - max
          - min
          - sum
          description: avg - average, max - maximum, min - minimum, sum - sum.
        values:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Numeric values to aggregate, at least one.
        assignTo:
          allOf:
          - $ref: '#/components/schemas/AutomationDslWritableTarget'
          description: Where to write the result. If omitted, result is left at this node.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslVariableToggle:
      type: object
      description: Invert the boolean value and write it back. The target can be a flow variable, global variable, or device boolean property.
      required:
      - type
      - target
      properties:
        type:
          type: string
          enum:
          - variable.toggle
        target:
          allOf:
          - $ref: '#/components/schemas/AutomationDslAssignmentTarget'
          description: The boolean variable or device property to invert.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslMessagePush:
      type: object
      description: Send text to DingTalk or WeChat Work robot. If DingTalk secret is not empty, sign according to signature rule. WeChat ignores secret. Not available with device scope authorization.
      required:
      - type
      - channel
      - webhookUrl
      - content
      properties:
        type:
          type: string
          enum:
          - message.push
        channel:
          type: string
          enum:
          - dingtalk
          - wechat
          description: dingtalk means DingTalk custom robot, wechat means WeChat Work group robot.
        webhookUrl:
          type: string
          description: The webhook URL of robot.
        secret:
          type: string
          description: DingTalk signature key. If empty, no signature for DingTalk. Ignored by WeChat.
        content:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: 'The text content. Will be sent as {"msgtype":"text","text":{"content":...}}.'
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslDeviceBatchItem:
      type: object
      required:
      - deviceId
      - endpointId
      - functionCode
      properties:
        deviceId:
          type: string
          description: Device id.
        endpointId:
          type: integer
          description: Endpoint id.
        functionCode:
          type: string
          description: Function code.
        traitCode:
          type: string
          description: Trait code; only the command code for legacy command items; use `commandCode` for new command items.
          minLength: 1
        value:
          allOf:
          - $ref: '#/components/schemas/AutomationDslValueExpression'
          description: Value to write this time; can be literal or value expression. Required unless command is true. Not the initial value of variable declaration.
          not:
            enum:
            - null
            nullable: true
        command:
          type: boolean
          description: true to invoke command, false or omitted to write property. All items in one device.batch must be the same.
        args:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslCommandArg'
          description: Command parameters. For attribute items, only an empty array from historical exports is accepted for compatibility; omit this field on new attribute items.
        commandCode:
          type: string
          minLength: 1
          description: Command code, used only when `command` is true. Prefer `commandCode`; if `commandCode` is not provided, use `traitCode`.
      additionalProperties: false
      description: One item in a batch. Attribute items use `traitCode` and `value`; command items use `command:true` and `commandCode`, with no `value`. Legacy command items use `traitCode` for compatibility.
      oneOf:
      - required:
        - command
        properties:
          command:
            enum:
            - true
            type: boolean
        not:
          required:
          - value
        anyOf:
        - required:
          - commandCode
        - required:
          - traitCode
      - required:
        - traitCode
        - value
        properties:
          command:
            enum:
            - false
            type: boolean
          args:
            maxItems: 0
        not:
          required:
          - commandCode

    AutomationDslDeviceBatch:
      type: object
      description: Execute multiple property writes or commands in one go. Each item uses its own value and arguments. Do not mix property write and command in the same block.
      required:
      - type
      - items
      properties:
        type:
          type: string
          enum:
          - device.batch
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslDeviceBatchItem'
          description: Items to execute. Each item targets its own device/point.
        id:
          type: string
          minLength: 1
        linkFrom:
          type: array
          items:
            $ref: '#/components/schemas/AutomationDslLinkFrom'
      additionalProperties: false

    AutomationDslWritableTarget:
      description: Where to write result. If assignTo is omitted, result is left at this node and should be read via node.output.
      oneOf:
      - $ref: '#/components/schemas/AutomationDslDeviceProperty'
      - $ref: '#/components/schemas/AutomationDslFlowVariableRef'
      - $ref: '#/components/schemas/AutomationDslGlobalVariableRef'

    AutomationDslScene:
      type: object
      description: Scene action configuration with a built-in unique entry point. Does not accept starters or conditions.
      required:
      - actions
      properties:
        metadata:
          $ref: '#/components/schemas/AutomationDslMetadata'
        actions:
          type: array
          description: List of actions (at least one).
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAction'
        concurrencyGroup:
          type: string
          maxLength: 128
          description: "Scene concurrency group: same group interrupts previous execution; empty string, omitted, or null do not participate in group exclusivity. No leading or trailing whitespace or control characters; up to 128 UTF-8 bytes. Sub-scenes are also subject to parent scene cancellation constraints; automation does not participate."
          nullable: true
      additionalProperties: false

    JsonSceneConfig:
      type: object
      description: Scene action configuration with a built-in unique entry point. Does not accept starters or conditions.
      required:
      - actions
      properties:
        metadata:
          $ref: '#/components/schemas/AutomationDslMetadata'
        actions:
          type: array
          description: List of actions (at least one).
          minItems: 1
          items:
            $ref: '#/components/schemas/AutomationDslAction'
        concurrencyGroup:
          type: string
          maxLength: 128
          description: "Scene concurrency group: same group interrupts previous execution; empty string, omitted, or null do not participate in group exclusivity. No leading or trailing whitespace or control characters; up to 128 UTF-8 bytes. Sub-scenes are also subject to parent scene cancellation constraints; automation does not participate."
          nullable: true
      additionalProperties: false

    SceneSummary:
      type: object
      required:
      - sceneId
      - name
      - createTime
      - spaces
      properties:
        name:
          type: string
          description: Automation name.
        createTime:
          type: integer
          format: int64
          description: Creation time (milliseconds since epoch).
        space:
          anyOf:
          - $ref: '#/components/schemas/SpaceNode'
          - type: object
            nullable: true
            enum:
            - null
          description: "Legacy single-space field, equal to the first item of `spaces`. Omitted when no resolvable association exists; clients may treat omission as `null`."
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: User metadata returned when includeMetadata=true; differs from config.metadata.
        sceneId:
          type: string
          description: Unique scene ID, use the auto_... value from create/query returns.
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/SpaceNode'
          description: "All resolvable associated spaces, deduplicated by `spaceId`; `[]` when there is no association. When there is no valid direct association, falls back to the previous parent-space behavior."

    SceneDetails:
      allOf:
      - $ref: '#/components/schemas/SceneSummary'
      - type: object
        properties:
          configFormat:
            type: string
            enum:
            - JSON_SCENE
            - FLOW_CANONICAL
            - null
            nullable: true
          config:
            anyOf:
            - $ref: '#/components/schemas/JsonSceneConfig'
            - $ref: '#/components/schemas/FlowCanonicalConfig'
            - type: object
              nullable: true
              enum:
              - null
            description: "When projectable, returns the action configuration. Read diagnostics in the sibling `issues` field; configs that include read-only diagnostics must not be used directly as update input. When the structure cannot be projected, returns the full graph."
            nullable: true
          issues:
            type: array
            readOnly: true
            description: "Read-only scene diagnostics, sibling to `config`, and not written into the saved configuration. `path` is relative to the scene `config`; actions use `actions[...]`, and metadata paths are preserved. Healthy detail responses return `[]`; list responses omit this field. Diagnostics do not relax create or update validation; when the structure is damaged, `FLOW_CANONICAL` fallback is still kept."
            items:
              type: object
              required:
              - code
              - path
              - message
              properties:
                code:
                  type: string
                path:
                  type: string
                message:
                  type: string

    CreateSceneRequest:
      type: object
      required:
      - name
      - config
      properties:
        name:
          type: string
          minLength: 1
          description: "Must provide explicit, non-blank display name. Do not fall back to config.metadata.name."
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: "Name duplicate handling. If omitted or true, auto-adds (1), (2), etc. suffix; if false, returns name duplicate error."
        config:
          $ref: '#/components/schemas/JsonSceneConfig'
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: "Optional initial space associations; pass multiple IDs; the server deduplicates. When omitted, `null`, or an empty array, no direct association is created."

    UpdateSceneRequest:
      type: object
      required:
      - sceneId
      - updateMask
      properties:
        name:
          type: string
          nullable: true
        autoSuffixOnDuplicate:
          type: boolean
          default: true
          description: "Name duplicate handling. If omitted or true, auto-adds (1), (2), etc. suffix; if false, returns name duplicate error. This field does not need to be included in updateMask."
        config:
          anyOf:
          - $ref: '#/components/schemas/JsonSceneConfig'
          - type: object
            nullable: true
            enum:
            - null
          description: "Must provide complete non-null config if updating config."
        updateMask:
          type: array
          description: "Only supports `name`, `config`, and `spaceIds`. Scenes do not have `enabled`. Must provide a non-null array when `spaceIds` is selected; do not send non-null values when not selected. `config.metadata.name` does not implicitly rename."
          items:
            type: string
            enum:
            - name
            - config
            - spaceIds
          minItems: 1
          uniqueItems: true
        sceneId:
          type: string
          minLength: 1
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: '\S'
          description: Must provide a non-null array when `spaceIds` is selected in `updateMask`; replace as a whole, not append; an empty array clears direct associations. Omit this field and its mask when not updating spaces.
      allOf:
      - oneOf:
        - properties:
            updateMask:
              type: array
              items:
                type: string
                enum:
                - name
                - config
            spaceIds:
              type: array
              nullable: true
              enum:
              - null
        - required:
          - spaceIds
          properties:
            updateMask:
              type: array
              not:
                items:
                  not:
                    enum:
                    - spaceIds
            spaceIds:
              type: array
              items:
                type: string
                minLength: 1
                pattern: \S

    UpdateSceneSpaceRequest:
      type: object
      required:
      - sceneIds
      properties:
        spaceId:
          type: string
          minLength: 1
          description: Legacy single-space parameter. Equivalent to `spaceIds` containing only this ID; mutually exclusive with a non-null `spaceIds`.
        sceneIds:
          type: array
          minItems: 1
          description: List of scene IDs to update space association.
          items:
            type: string
        spaceIds:
          type: array
          nullable: true
          items:
            type: string
            minLength: 1
            pattern: \S
          description: Target space ID array. Replace as a whole, not append; the server deduplicates. An empty array clears direct associations.
      example:
        spaceIds:
        - space-livingroom-001
        - space-bedroom-001
        sceneIds:
        - auto_01HXYZABCDEF1234567890
      description: Replace each object's full set of direct space associations. Exactly one non-null form of `spaceId` or `spaceIds` must be provided; `spaceIds=[]` clears direct associations.
      oneOf:
      - required:
        - spaceId
        properties:
          spaceId:
            type: string
            minLength: 1
            pattern: \S
          spaceIds:
            type: array
            nullable: true
            enum:
            - null
      - required:
        - spaceIds
        properties:
          spaceIds:
            type: array
            items:
              type: string
              minLength: 1
              pattern: \S
          spaceId:
            type: string
            nullable: true
            enum:
            - null

