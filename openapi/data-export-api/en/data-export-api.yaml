    BatchDeviceCapabilitiesRequest:
      type: object
      additionalProperties: false
      required:
      - deviceIds
      anyOf:
      - required:
        - functionCodes
        properties:
          functionCodes:
            minItems: 1
      - required:
        - traitCodes
        properties:
          traitCodes:
            minItems: 1
      - required:
        - commandCodes
        properties:
          commandCodes:
            minItems: 1
      properties:
        deviceIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 1
            pattern: \S
          description: Required. Limited to 1–20 items by the original array length. Validate the count first, then trim and deduplicate in first-seen order. Duplicates count toward the limit; blank IDs are rejected. Each ID is an opaque string and is not split by commas.
        deviceTypesList:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: Restricts overall device types and endpoint types; cannot be used alone as a capability condition. Each item must be non-empty after trim; each array element is a complete code and is not split by commas.
        deviceTypesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: Match mode within the list; case-insensitive.
        functionCodes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: Match function codes. Provide at least one non-empty list among `functionCodes`, `traitCodes`, and `commandCodes`. Each item must be non-empty after trim; each array element is a complete code and is not split by commas.
        functionCodesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: Match mode within the list; case-insensitive.
        traitCodes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: Match trait codes and return definitions plus obtainable current values. Each item must be non-empty after trim; each array element is a complete code and is not split by commas.
        traitCodesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: Match mode within the list; case-insensitive. For trait/command, `and` requires all codes to be satisfied within the same function.
        commandCodes:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: Match command codes and return only command and field definitions, without current values. Each item must be non-empty after trim; each array element is a complete code and is not split by commas.
        commandCodesMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: Match mode within the list; case-insensitive. For trait/command, `and` requires all codes to be satisfied within the same function.
        displayTags:
          type: array
          items:
            type: string
            minLength: 1
            pattern: \S
          default: []
          description: Filter display tags using the same rules as GET. Each item must be non-empty after trim; each array element is a complete code and is not split by commas.
        displayTagsMatchMode:
          type: string
          enum:
          - or
          - and
          - OR
          - AND
          default: or
          description: Match mode within the list; case-insensitive.
