    ErrorMessage:
      name: ErrorMessage
      title: 错误响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/ErrorMessageV1'
      examples:
        - name: missingMsgId
          payload:
            type: ErrorMessage
            version: v1
            msgId: ''
            data: null
            code: 400
            message: Missing msgId

  schemas:
    MessageType:
      type: string
      description: 本文协议及共享推送 Schema 使用的消息类型；实际可用消息以对应 channel 和 operation 为准。
      enum:
        - AuthRequest
        - AuthResponse
        - ping
        - pong
        - SubscribeAllRequest
        - SubscribeAllResponse
        - UnsubscribeAllRequest
        - UnsubscribeAllResponse
        - SubscribeTraitValueRequest
        - SubscribeTraitValueResponse
        - UnsubscribeTraitValueRequest
        - UnsubscribeTraitValueResponse
        - SubscribeEventRequest
        - SubscribeEventResponse
        - UnsubscribeEventRequest
        - UnsubscribeEventResponse
        - SubscribeObjectEventRequest
        - SubscribeObjectEventResponse
        - UnsubscribeObjectEventRequest
        - UnsubscribeObjectEventResponse
        - TraitValueUpdate
        - objectEvent
        - AlarmEvent
        - ErrorMessage
    PushAlarmEventMessageV1:
      description: WebSocket 与 HTTP 共用的原始告警推送正文。WebSocket 显式订阅 ALARM 后接收，HTTP 按配置启用告警；不使用 App 通知栏 payload。
      allOf:
        - $ref: '#/components/schemas/BasePushMessage'
        - type: object
          required: [data]
          properties:
            type:
              type: string
              enum: [AlarmEvent]
            data:
              $ref: '#/components/schemas/AlarmEventDataV1'
    AlarmEventDataV1:
      type: object
      required: [uuid, deviceName, deviceId, devicePointName, alarmClass, alarmRuleName, alarmText, alarmValue, sourceState, alarmTime, localized]
      properties:
        uuid: 
          type: string
          description: 告警记录 ID；同一告警记录的后续事件可能复用，不是每次状态变化的唯一事件 ID。
        deviceName: 
          type: string
          description: 设备展示名称。
        deviceId: 
          type: string
          description: 设备 ID；无法解析到设备时可能为空字符串。
        devicePointName: 
          type: string
          description: 告警点位展示名称。
        alarmClass: 
          type: string
          description: 告警分类展示名称。
        alarmRuleName: 
          type: string
          description: 告警规则展示名称，可能使用点位名称回退。
        alarmText: 
          type: string
          description: 告警展示文本。
        alarmValue: 
          type: string
          description: 格式化后的告警值，类型为字符串。
        sourceState: 
          type: string
          description: 告警源的标准状态值，NORMAL（正常）、OFF_NORMAL（触发）、FAULT（故障）、ALERT（提醒）。按实际告警事件提供，不表示每种状态或确认操作都一定产生独立推送；接收端应兼容后续新增值。
        alarmTime: 
          type: integer
          format: int64
          description: Unix 毫秒时间戳。
        localized:
          type: object
          minProperties: 1
          description: 按语言标签提供文本；部分语言构建失败时可缺失，顶层文本使用系统默认语言或可用回退语言。
          additionalProperties:
            type: object
            required: [devicePointName, alarmText, alarmValue, sourceStateText]
            properties:
              devicePointName: 
                type: string  
                description: 告警点位展示名称。
              alarmText: 
                type: string
                description: 告警展示文本。
              alarmValue: 
                type: string
                description: 告警值。
              sourceStateText: 
                type: string
                description: 告警源状态展示文本。
    MsgId:
      type: string
      description: 请求使用的非空标识，应至少在当前连接尚未完成的请求中保持唯一；正常响应使用相同 msgId 关联，服务端推送的 msgId 仅用于链路追踪，不等同于订阅请求 msgId，也不保证全局唯一。
      minLength: 1
      maxLength: 64
    ErrorMsgId:
      type: string
      description: 能关联原请求时返回请求 msgId；服务端无法关联原请求时可能返回 UNKNOWN 或空字符串。
      minLength: 0
      maxLength: 64
    Version:
      type: string
      enum:
        - v1
    BaseRequest:
      type: object
      required:
        - type
        - version
        - msgId
      properties:
        type:
          $ref: '#/components/schemas/MessageType'
        version:
          $ref: '#/components/schemas/Version'
        msgId:
          $ref: '#/components/schemas/MsgId'
        data:
          description: 业务参数。
    BaseResponse:
      type: object
      required:
        - type
        - version
        - msgId
        - code
        - message
      properties:
        type:
          $ref: '#/components/schemas/MessageType'
        version:
          $ref: '#/components/schemas/Version'
        msgId:
          $ref: '#/components/schemas/MsgId'
        data:
          description: 响应数据。无数据时通常为空字符串或 null。
        code:
          type: integer
          format: int32
          description: 处理结果码，0 表示成功，非 0 表示失败。
        message:
          type:
            - string
            - 'null'
          description: 处理结果描述。
    BasePushMessage:
      type: object
      required:
        - type
        - version
        - msgId
        - data
        - code
        - message
      properties:
        type:
          $ref: '#/components/schemas/MessageType'
        version:
          $ref: '#/components/schemas/Version'
        msgId:
          $ref: '#/components/schemas/MsgId'
        data:
          description: 推送业务数据。
        code:
          type: integer
          format: int32
          description: 处理结果码，0 表示成功，非 0 表示失败。
        message:
          type:
            - string
            - 'null'
          description: 处理结果描述。
    AuthRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - AuthRequest
            data:
              $ref: '#/components/schemas/AuthRequestData'
    AuthRequestData:
      type: object
      required:
        - token
      properties:
        authType:
          type: string
          description: 鉴权方式。请传入 token。
          enum:
            - token
          default: token
        token:
          type: string
          description: "请使用格式：`Bearer <Token>`，其中 `<Token>` 为 Aqara Studio 获取的原始 Token。切勿将此 Token 记录或暴露于日志。"
    CommonEmptyResponse:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - data
          properties:
            data:
              type:
                - string
                - 'null'
              default: ''
    AuthResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - AuthResponse
    SubscribeAllResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - SubscribeAllResponse
    UnsubscribeAllResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UnsubscribeAllResponse
    SubscribeTraitValueResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - SubscribeTraitValueResponse
    UnsubscribeTraitValueResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UnsubscribeTraitValueResponse
    SubscribeObjectEventResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - SubscribeObjectEventResponse
    UnsubscribeObjectEventResponseMessage:
      allOf:
        - $ref: '#/components/schemas/CommonEmptyResponse'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UnsubscribeObjectEventResponse
    PingRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            type:
              type: string
              enum:
                - ping
            data:
              type:
                - string
                - 'null'
              default: null
    PongResponseMessage:
      allOf:
        - $ref: '#/components/schemas/BaseResponse'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - pong
            data:
              type: string
              enum:
                - pong
    SubscribeAllRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            type:
              type: string
              enum:
                - SubscribeAllRequest
            data:
              type:
                - array
                - 'null'
              default: null
              description: |
                设备 ID 列表。为 null、省略或空数组时表示订阅当前权限范围内全部设备数据，并清理此前的设备级订阅。
                data 不为空时会取消“订阅所有设备”状态并追加这些设备级订阅，但不会自动清理此前已追加的其他设备级订阅。
                若需要缩小或替换设备级订阅范围，应先用 UnsubscribeAllRequest 取消不再需要的设备。
                若需要清理当前连接全部设备数据和 Trait 订阅，应发送 data 为空数组或不传的 UnsubscribeAllRequest；该请求不清理独立事件或对象事件订阅。
                若当前账号或 Token 权限范围内没有可访问设备，服务端可能返回 code=0 但不会产生后续推送。
                同一连接内，SubscribeAllRequest 会覆盖并清理此前通过 SubscribeTraitValueRequest 建立的 Trait 订阅。
                若需从全部设备或指定设备订阅切换回仅 Trait 维度订阅，应先发送 UnsubscribeAllRequest 清理全量/设备级订阅。
              items:
                type: string
    UnsubscribeAllRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UnsubscribeAllRequest
            data:
              type:
                - array
                - 'null'
              default: null
              description: |
                设备 ID 列表。为空或 null 时表示取消全部设备数据和 Trait 订阅。
                若当前为全部设备订阅，按特定设备取消订阅不会生效，需传空值取消全部设备数据订阅。
                同一连接内，UnsubscribeAllRequest 会同时清理此前通过 SubscribeTraitValueRequest 建立的 Trait 订阅。
                按特定设备取消订阅只取消设备级订阅，不等同于关闭当前连接的全部推送。
                本请求不清理 SubscribeEventRequest 或 SubscribeObjectEventRequest 建立的规则，也不关闭默认 DEVICE_ADDED、DEVICE_REMOVED 推送。
              items:
                type: string
    TraitSubscriptionItem:
      type: object
      required:
        - deviceId
        - endpointId
        - functionCode
        - traitCodes
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type: integer
          format: int32
          description: 端点 ID。
        functionCode:
          type: string
          description: 功能代码。
        traitCodes:
          type: array
          description: Trait 功能点代码列表。建议传非空数组；为空数组时不会创建或取消具体 Trait 订阅，但当前实现仍可能返回成功响应。
          items:
            type: string
    SubscribeTraitValueRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - SubscribeTraitValueRequest
            data:
              type: array
              description: |
                需要订阅的 Trait 列表。建议传非空数组；省略 data 会解析失败。
                当前实现对空数组或 traitCodes 为空数组仍可能返回成功响应，但不会创建有效的 TraitValueUpdate 订阅。
              items:
                $ref: '#/components/schemas/TraitSubscriptionItem'
    UnsubscribeTraitValueRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          properties:
            type:
              type: string
              enum:
                - UnsubscribeTraitValueRequest
            data:
              type: array
              default: []
              description: |
                需要取消订阅的 Trait 列表。建议传非空数组。
                省略 data、传空数组或 traitCodes 为空数组不会取消任何 Trait 订阅，但当前实现仍可能返回成功响应。
              items:
                $ref: '#/components/schemas/TraitSubscriptionItem'
    SubscribeEventRequestMessage:
      allOf:
      - $ref: '#/components/schemas/BaseRequest'
      - type: object
        required:
        - data
        properties:
          type:
            type: string
            enum:
            - SubscribeEventRequest
          data:
            type: array
            minItems: 1
            items:
              type: string
              enum:
              - ALARM
            description: 告警使用 ALARM；不接受空数组、通配符或对象 ID 过滤。
    SubscribeEventResponseMessage:
      allOf:
      - $ref: '#/components/schemas/CommonEmptyResponse'
      - type: object
        properties:
          type:
            type: string
            enum:
            - SubscribeEventResponse
    UnsubscribeEventRequestMessage:
      allOf:
      - $ref: '#/components/schemas/BaseRequest'
      - type: object
        required:
        - data
        properties:
          type:
            type: string
            enum:
            - UnsubscribeEventRequest
          data:
            type: array
            minItems: 1
            items:
              type: string
              enum:
              - ALARM
            description: 告警使用 ALARM；不接受空数组、通配符或对象 ID 过滤。
    UnsubscribeEventResponseMessage:
      allOf:
      - $ref: '#/components/schemas/CommonEmptyResponse'
      - type: object
        properties:
          type:
            type: string
            enum:
            - UnsubscribeEventResponse
    PreciseObjectEventType:
      type: string
      enum:
        - DEVICE_SPACE_UPDATED
        - SPACE_ADDED
        - SPACE_REMOVED
        - SPACE_UPDATED
        - AUTOMATION_ADDED
        - AUTOMATION_REMOVED
        - AUTOMATION_UPDATED
        - AUTOMATION_SPACE_UPDATED
    ObjectEventSubscriptionItem:
      type: object
      required:
        - eventTypes
      properties:
        eventTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PreciseObjectEventType'
        objectIds:
          type:
            - array
            - 'null'
          maxItems: 1000
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: |
            订阅时，不传、null 或空数组表示当前权限范围内全部对象；非空时只匹配指定对象。
            取消订阅时，不传、null 或空数组表示清空对应 eventTypes，非空时只移除指定对象。
            同一 WebSocket 会话在每个 eventType 下最多累计订阅 1000 个不同 objectId。
            objectIds 非空时，同一项的 eventTypes 必须属于同一种对象类型；SPACE_ADDED、AUTOMATION_ADDED 只支持全部对象语义。
            协议不使用 scope 字段；全部对象语义统一由 objectIds 表示。
    SubscribeObjectEventRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - SubscribeObjectEventRequest
            data:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/ObjectEventSubscriptionItem'
              description: |
                必须包含 1 至 100 个订阅项。请求按会话增量合并，重复订阅幂等。
                SPACE_ADDED、AUTOMATION_ADDED 只允许 objectIds 为全部对象语义。
    UnsubscribeObjectEventRequestMessage:
      allOf:
        - $ref: '#/components/schemas/BaseRequest'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - UnsubscribeObjectEventRequest
            data:
              type: array
              minItems: 1
              maxItems: 100
              items:
                $ref: '#/components/schemas/ObjectEventSubscriptionItem'
              description: |
                必须包含 1 至 100 个取消项；空数组是参数错误，不表示取消全部事件类型。
                objectIds 不传、null 或空数组时，清除对应 eventTypes 下当前会话的全部对象规则；非空时只移除指定对象。
    PushTraitValueUpdateItem:
      type: object
      required:
        - deviceId
        - endpointId
        - functionCode
        - traitCode
        - time
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type: integer
          format: int32
          description: 端点 ID。
        functionCode:
          type: string
          description: 功能代码。
        traitCode:
          type: string
          description: Trait 功能点代码。
        value:
          description: Trait 功能点值，类型由具体功能点定义决定。
        time:
          type: integer
          format: int64
          description: 上报时间戳，单位毫秒。
    PushTraitValueUpdateMessageV1:
      allOf:
        - $ref: '#/components/schemas/BasePushMessage'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - TraitValueUpdate
            data:
              type: array
              items:
                $ref: '#/components/schemas/PushTraitValueUpdateItem'
    PushObjectEventDeviceData:
      type: object
      required:
        - deviceId
        - name
        - deviceTypesList
        - endpointIds
        - time
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        name:
          type: string
          description: 设备名称。
        deviceTypesList:
          type: array
          description: 设备类型列表。
          items:
            type: string
        endpointIds:
          type: array
          description: 端点 ID 列表。
          items:
            type: integer
            format: int32
        time:
          type: integer
          format: int64
          description: 事件发生时间戳，单位毫秒。
    TraitParameterValue:
      type: object
      properties:
        endpointId:
          type:
            - integer
            - 'null'
          format: int32
          description: 端点 ID。
        functionCode:
          type:
            - string
            - 'null'
          description: 功能代码。
        traitCode:
          type:
            - string
            - 'null'
          description: Trait 功能点代码。
        min:
          type:
            - number
            - 'null'
          description: 最小值。
        max:
          type:
            - number
            - 'null'
          description: 最大值。
        unit:
          type:
            - string
            - 'null'
          description: 单位。
        step:
          type:
            - number
            - 'null'
          description: 步长。
    PushObjectEventTraitParameterData:
      type: object
      required:
        - deviceId
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        endpointId:
          type:
            - integer
            - 'null'
          format: int32
          description: 端点 ID。
        functionCode:
          type:
            - string
            - 'null'
          description: 功能代码。
        traitCode:
          type:
            - string
            - 'null'
          description: Trait 功能点代码。
        newValue:
          anyOf:
            - $ref: '#/components/schemas/TraitParameterValue'
            - type: 'null'
          description: 更新后的 Trait 参数值；为空时序列化可能省略该字段。
        oldValue:
          anyOf:
            - $ref: '#/components/schemas/TraitParameterValue'
            - type: 'null'
          description: 更新前的 Trait 参数值；为空时序列化可能省略该字段。
    DeviceSpaceUpdateEventData:
      type: object
      required:
        - deviceId
        - oldSpaceId
        - space
      properties:
        deviceId:
          type: string
          description: 设备 ID。
        oldSpaceId:
          type:
            - string
            - 'null'
          description: 变化前空间 ID；首次关联时为 null。
        space:
          anyOf:
            - $ref: '#/components/schemas/SpaceEventData'
            - type: 'null'
          description: 关系变化时的空间摘要；解除关联时为 null。空间 ID 读取 space.spaceId，后续名称、标记或父级变化由 SPACE_UPDATED 更新统一空间缓存。
    SpaceEventData:
      type: object
      description: 空间最新摘要。客户端应按 spaceId 维护统一空间缓存，避免在设备或自动化关系数据中重复保存可能过期的名称、标记和父级；parentSpaceId 表示该摘要所属父空间，根空间为 null。
      required:
        - spaceId
        - name
        - parentSpaceId
      properties:
        spaceId:
          type: string
          description: 空间 ID。
        name:
          type: string
          description: 空间名称。
        spatialMarking:
          type:
            - string
            - 'null'
          description: 空间标记；没有标记时为 null。
        parentSpaceId:
          type:
            - string
            - 'null'
          description: 空间所属父空间 ID；根空间为 null。SPACE_ADDED 和 SPACE_UPDATED 为事件后的父空间，SPACE_REMOVED 为删除前的父空间。
    AutomationPushSnapshot:
      type: object
      description: 自动化和独立场景变化通知沿用的轻量快照，不包含完整 config。事件字段 automationId 对于已知场景是 sceneId；按查询列表识别分类，分别通过 GET /automations/{automationI 或 GET /scenes/{sceneId} 查询详情。场景列表不使用快照中的 enabled 和 definitionType。manualTriggers 为自动化内手动触发入口的完整列表，其变化也触发 AUTOMATION_UPDATED。
      required:
        - automationId
        - definitionType
        - name
        - enabled
        - createTime
      properties:
        automationId:
          type: string
          description: 自动化 ID。
        definitionType:
          type: string
          description: 自动化定义类型。
        name:
          type: string
          description: 自动化名称。
        enabled:
          type: boolean
          description: 是否启用。
        createTime:
          type: integer
          format: int64
          description: 创建时间戳，单位毫秒。
        manualTriggers:
          type: array
          default: []
          description: 自动化内手动触发入口的完整列表；添加、删除或重命名入口时通过 AUTOMATION_UPDATED 推送变化后的完整快照。接收端应整体替换缓存，空数组表示清空；缺失字段可按空数组兼容。新增使用新增后列表，删除使用删除前列表。此列表不代表独立的 /scenes 对象。
          items:
            $ref: '#/components/schemas/AutomationManualTriggerBrief'

    AutomationManualTriggerBrief:
      type: object
      description: 自动化内单个手动触发入口的摘要。
      required:
        - triggerNodeId
        - triggerName
      properties:
        triggerNodeId:
          type: string
          description: 手动触发节点 ID，与所属 automationId 一起定位入口。
        triggerName:
          type: string
          description: 手动触发入口的展示名称。
          
    AutomationSpaceUpdateEventData:
      type: object
      required:
      - automationId
      - oldSpaceId
      - space
      properties:
        automationId:
          type: string
          description: 自动化 ID。
        oldSpaceId:
          type:
          - string
          - 'null'
          description: 变化前空间 ID；首次关联时为 null。
        space:
          anyOf:
          - $ref: '#/components/schemas/SpaceEventData'
          - type: 'null'
          description: 关系变化时的空间摘要；解除关联时为 null。空间 ID 读取 space.spaceId，后续名称、标记或父级变化由 SPACE_UPDATED 更新统一空间缓存；该关系也适用于独立场景。
    KnownPushObjectEventType:
      type: string
      description: 当前版本已知的推送对象事件；用于校验已知事件的 data，不将推送侧 eventType 封闭为枚举。
      enum:
        - DEVICE_ADDED
        - DEVICE_REMOVED
        - DEVICE_ENDPOINT_ADDED
        - DEVICE_ENDPOINT_REMOVED
        - DEVICE_TRAIT_PARAMETER_UPDATE
        - DEVICE_SPACE_UPDATED
        - SPACE_ADDED
        - SPACE_REMOVED
        - SPACE_UPDATED
        - AUTOMATION_ADDED
        - AUTOMATION_REMOVED
        - AUTOMATION_UPDATED
        - AUTOMATION_SPACE_UPDATED
    PushObjectEventData:
      type: object
      description: |
        objectEvent 的通用数据。eventType 下方列出当前已知值，推送接收端应将其按可扩展字符串处理。
        选择 HTTP ALL_SUPPORTED 时，Studio 升级后可能发送未在旧版文档中列出的事件及 data 结构。
      required:
        - eventType
        - objectId
        - time
      properties:
        eventType:
          type: string
          minLength: 1
          description: 可扩展的对象事件类型；当前已知值见 KnownPushObjectEventType。
        objectId:
          type: string
          description: 对象 ID；按事件类型分别为设备、空间或自动化 ID。
        time:
          type: integer
          format: int64
          description: 事件发生时间戳，单位毫秒。
        data:
          type:
            - object
            - 'null'
          description: |
            根据 eventType 判断具体结构。当前结构分别见 PushObjectEventDeviceData、PushObjectEventTraitParameterData、
            DeviceSpaceUpdateEventData、SpaceEventData、AutomationPushSnapshot 和 AutomationSpaceUpdateEventData。
            推送侧允许后续新增结构；订阅请求中的 PreciseObjectEventType 仍是当前版本的严格枚举。
      allOf:
        - if:
            properties:
              eventType:
                enum: [DEVICE_ADDED, DEVICE_REMOVED, DEVICE_ENDPOINT_ADDED, DEVICE_ENDPOINT_REMOVED]
          then:
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/PushObjectEventDeviceData'
        - if:
            properties:
              eventType:
                enum: [DEVICE_TRAIT_PARAMETER_UPDATE]
          then:
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/PushObjectEventTraitParameterData'
        - if:
            properties:
              eventType:
                enum: [DEVICE_SPACE_UPDATED]
          then:
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/DeviceSpaceUpdateEventData'
        - if:
            properties:
              eventType:
                enum: [SPACE_ADDED, SPACE_REMOVED, SPACE_UPDATED]
          then:
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/SpaceEventData'
        - if:
            properties:
              eventType:
                enum: [AUTOMATION_ADDED, AUTOMATION_REMOVED, AUTOMATION_UPDATED]
          then:
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/AutomationPushSnapshot'
        - if:
            properties:
              eventType:
                enum: [AUTOMATION_SPACE_UPDATED]
          then:
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/AutomationSpaceUpdateEventData'
    PushObjectEventMessageV1:
      allOf:
        - $ref: '#/components/schemas/BasePushMessage'
        - type: object
          required:
            - data
          properties:
            type:
              type: string
              enum:
                - objectEvent
            data:
              $ref: '#/components/schemas/PushObjectEventData'
    ErrorMessageV1:
      type: object
      required:
        - type
        - version
        - msgId
        - code
        - message
      properties:
        type:
          type: string
          enum:
            - ErrorMessage
        version:
          $ref: '#/components/schemas/Version'
        msgId:
          $ref: '#/components/schemas/ErrorMsgId'
        data:
          type:
            - string
            - 'null'
          description: 错误响应通常不携带业务数据。
        code:
          type: integer
          format: int32
          description: 处理结果码，非 0 表示失败；不建议客户端依赖某个具体错误码判断固定业务场景。
        message:
          type:
            - string
            - 'null'
          description: 错误说明。
