asyncapi: 3.0.0
id: urn:studio:websocket:v1
info:
  title: Studio WebSocket API
  version: v1
  description: |
    本文件描述客户端与 Studio WebSocket 服务之间的异步消息：
    - 客户端发送鉴权、心跳、订阅、取消订阅请求。
    - Studio 返回请求响应，并在订阅命中或设备事件发生时主动推送消息。
    - 本契约覆盖设备、Trait、对象事件及独立告警事件的订阅、取消订阅和推送。告警通过 SubscribeEventRequest 显式订阅 ALARM。
    - Studio 局域网 Studio 环境如未在握手阶段携带 Token，可在连接建立后首包发送 `AuthRequest`。

    视角说明：本 AsyncAPI 描述客户端应用需要实现的接入行为；`send` 表示客户端发送到 Studio，`receive` 表示客户端从 Studio 接收。
defaultContentType: application/json

servers:
  lanStudio:
    host: '{localStudioEndpoint}'
    protocol: wss
    pathname: /open/ws
    description: 局域网 Studio WebSocket 服务，仅用于本地连接；地址由部署配置或服务发现结果提供，不得用于生产或云端连接。
    variables:
      localStudioEndpoint:
        default: studio.local
        description: Studio 实际主机地址以及环境需要的端口，不应在客户端硬编码固定 IP 或端口。

channels:
  studioWebSocket:
    address: null
    title: Studio WebSocket channel
    description: |
      单连接双向 JSON 文本消息通道。

      新接入统一使用 `studio-id`；服务端当前兼容 `X-Studio-Id`、`Studio-Id`、`studioId` 等历史名称。
      Studio 局域网 Studio 环境可使用握手 Header 认证；如未在握手 Header 携带 Authorization，客户端必须在连接建立后 7 秒内发送 `AuthRequest`。
      Studio 局域网 Studio 环境使用 `AuthRequest` 时，鉴权完成前只允许发送 `AuthRequest`；鉴权成功后再发送心跳、订阅、取消订阅等业务消息。
      客户端应周期性发送 `ping` 或其他业务消息保持连接活跃，发送间隔不应超过 30 秒；超过 30 秒无任何消息时，链路中的网关或代理可能主动断开 WebSocket 连接。
      使用 API AccessToken 且配置了访问范围时，设备/Trait 订阅需要授权 `POST /api/v1/devices/trait/read`，也可授权 `*`。对象事件订阅属于认证连接可用的隐藏默认能力，不要求单独配置 scope。
      WebSocket 建立后应立即启动消息接收和临时缓冲，再完成鉴权、恢复订阅和快照校准，避免遗漏认证完成后默认推送的设备增删事件。
    messages:
      AuthRequest:
        $ref: '#/components/messages/AuthRequest'
      AuthResponse:
        $ref: '#/components/messages/AuthResponse'
      PingRequest:
        $ref: '#/components/messages/PingRequest'
      PongResponse:
        $ref: '#/components/messages/PongResponse'
      SubscribeAllRequest:
        $ref: '#/components/messages/SubscribeAllRequest'
      SubscribeAllResponse:
        $ref: '#/components/messages/SubscribeAllResponse'
      UnsubscribeAllRequest:
        $ref: '#/components/messages/UnsubscribeAllRequest'
      UnsubscribeAllResponse:
        $ref: '#/components/messages/UnsubscribeAllResponse'
      SubscribeTraitValueRequest:
        $ref: '#/components/messages/SubscribeTraitValueRequest'
      SubscribeTraitValueResponse:
        $ref: '#/components/messages/SubscribeTraitValueResponse'
      UnsubscribeTraitValueRequest:
        $ref: '#/components/messages/UnsubscribeTraitValueRequest'
      UnsubscribeTraitValueResponse:
        $ref: '#/components/messages/UnsubscribeTraitValueResponse'
      SubscribeEventRequest:
        $ref: '#/components/messages/SubscribeEventRequest'
      SubscribeEventResponse:
        $ref: '#/components/messages/SubscribeEventResponse'
      UnsubscribeEventRequest:
        $ref: '#/components/messages/UnsubscribeEventRequest'
      UnsubscribeEventResponse:
        $ref: '#/components/messages/UnsubscribeEventResponse'
      AlarmEvent:
        $ref: '#/components/messages/AlarmEvent'
      SubscribeObjectEventRequest:
        $ref: '#/components/messages/SubscribeObjectEventRequest'
      SubscribeObjectEventResponse:
        $ref: '#/components/messages/SubscribeObjectEventResponse'
      UnsubscribeObjectEventRequest:
        $ref: '#/components/messages/UnsubscribeObjectEventRequest'
      UnsubscribeObjectEventResponse:
        $ref: '#/components/messages/UnsubscribeObjectEventResponse'
      TraitValueUpdate:
        $ref: '#/components/messages/TraitValueUpdate'
      ObjectEvent:
        $ref: '#/components/messages/ObjectEvent'
      ErrorMessage:
        $ref: '#/components/messages/ErrorMessage'

operations:
  sendAuthRequest:
    action: send
    description: 仅 Studio 自身域名地址和局域网 Studio 环境使用；生产或云端环境不使用 AuthRequest。
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/AuthRequest'
  receiveAuthResponse:
    action: receive
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/AuthResponse'
      - $ref: '#/channels/studioWebSocket/messages/ErrorMessage'
  sendPing:
    action: send
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/PingRequest'
  receivePong:
    action: receive
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/PongResponse'
      - $ref: '#/channels/studioWebSocket/messages/ErrorMessage'
  sendSubscriptionCommand:
    action: send
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/SubscribeAllRequest'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeAllRequest'
      - $ref: '#/channels/studioWebSocket/messages/SubscribeTraitValueRequest'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeTraitValueRequest'
      - $ref: '#/channels/studioWebSocket/messages/SubscribeEventRequest'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeEventRequest'
      - $ref: '#/channels/studioWebSocket/messages/SubscribeObjectEventRequest'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeObjectEventRequest'
  receiveSubscriptionCommandResponse:
    action: receive
    description: |
      订阅或取消订阅失败时，服务端可能返回 ErrorMessage，也可能返回与请求对应的业务响应类型且 code 非 0。
      调用端应按 msgId 关联请求，并对所有响应统一判断 code，不应只等待固定响应 type。
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/SubscribeAllResponse'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeAllResponse'
      - $ref: '#/channels/studioWebSocket/messages/SubscribeTraitValueResponse'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeTraitValueResponse'
      - $ref: '#/channels/studioWebSocket/messages/SubscribeEventResponse'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeEventResponse'
      - $ref: '#/channels/studioWebSocket/messages/SubscribeObjectEventResponse'
      - $ref: '#/channels/studioWebSocket/messages/UnsubscribeObjectEventResponse'
      - $ref: '#/channels/studioWebSocket/messages/ErrorMessage'
  receivePushMessage:
    action: receive
    channel:
      $ref: '#/channels/studioWebSocket'
    messages:
      - $ref: '#/channels/studioWebSocket/messages/TraitValueUpdate'
      - $ref: '#/channels/studioWebSocket/messages/AlarmEvent'
      - $ref: '#/channels/studioWebSocket/messages/ObjectEvent'
      - $ref: '#/channels/studioWebSocket/messages/ErrorMessage'

components:
  messages:
    AuthRequest:
      name: AuthRequest
      title: WebSocket 鉴权请求
      summary: Studio 自身域名地址和局域网 Studio 环境的首包认证方式；生产或云端环境不使用。
      payload:
        $ref: '#/components/schemas/AuthRequestMessage'
      examples:
        - name: bearerToken
          payload:
            type: AuthRequest
            version: v1
            msgId: '10001'
            data:
              authType: token
              token: '<accessToken>'
              deviceUniqueId: '<deviceUniqueId>'
              clientId: '<clientId>'
    AuthResponse:
      name: AuthResponse
      title: WebSocket 鉴权响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/AuthResponseMessage'
      examples:
        - name: success
          payload:
            type: AuthResponse
            version: v1
            msgId: '10001'
            data: ''
            code: 0
            message: Authentication successful. Welcome <username>
    PingRequest:
      name: ping
      title: 心跳请求
      payload:
        $ref: '#/components/schemas/PingRequestMessage'
      examples:
        - name: ping
          payload:
            type: ping
            version: v1
            msgId: '10002'
            data: null
    PongResponse:
      name: pong
      title: 心跳响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/PongResponseMessage'
      examples:
        - name: pong
          payload:
            type: pong
            version: v1
            msgId: '10002'
            data: pong
            code: 0
            message: success
    SubscribeAllRequest:
      name: SubscribeAllRequest
      title: 全量/设备级订阅
      payload:
        $ref: '#/components/schemas/SubscribeAllRequestMessage'
      examples:
        - name: allDevices
          payload:
            type: SubscribeAllRequest
            version: v1
            msgId: '1751609244328'
            data: null
        - name: allDevicesWithEmptyArray
          payload:
            type: SubscribeAllRequest
            version: v1
            msgId: '1751609244329'
            data: []
        - name: specifiedDevices
          payload:
            type: SubscribeAllRequest
            version: v1
            msgId: '1751609244328'
            data:
              - deviceId
    SubscribeAllResponse:
      name: SubscribeAllResponse
      title: 全量/设备级订阅响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/SubscribeAllResponseMessage'
    UnsubscribeAllRequest:
      name: UnsubscribeAllRequest
      title: 取消全量/设备级订阅
      description: |
        清理全部或指定设备的数据订阅，并同时清理当前会话的 Trait 订阅。
        不清理独立事件订阅、精确对象事件订阅，也不关闭认证连接默认接收的 DEVICE_ADDED、DEVICE_REMOVED。
      payload:
        $ref: '#/components/schemas/UnsubscribeAllRequestMessage'
    UnsubscribeAllResponse:
      name: UnsubscribeAllResponse
      title: 取消全量/设备级订阅响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/UnsubscribeAllResponseMessage'
    SubscribeTraitValueRequest:
      name: SubscribeTraitValueRequest
      title: 订阅指定 Trait 功能值
      payload:
        $ref: '#/components/schemas/SubscribeTraitValueRequestMessage'
      examples:
        - name: subscribeTrait
          payload:
            type: SubscribeTraitValueRequest
            version: v1
            msgId: get_devices_1751609244328
            data:
              - deviceId: '57190441014857'
                endpointId: 3
                functionCode: MediaPlayback
                traitCodes:
                  - TargetPlaybackState
    SubscribeTraitValueResponse:
      name: SubscribeTraitValueResponse
      title: 订阅指定 Trait 功能值响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/SubscribeTraitValueResponseMessage'
    UnsubscribeTraitValueRequest:
      name: UnsubscribeTraitValueRequest
      title: 取消订阅指定 Trait 功能值
      payload:
        $ref: '#/components/schemas/UnsubscribeTraitValueRequestMessage'
    UnsubscribeTraitValueResponse:
      name: UnsubscribeTraitValueResponse
      title: 取消订阅指定 Trait 功能值响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/UnsubscribeTraitValueResponseMessage'
    SubscribeEventRequest:
      name: SubscribeEventRequest
      title: 订阅告警请求
      payload:
        $ref: '#/components/schemas/SubscribeEventRequestMessage'
      description: 鉴权后发送，data 必须是非空事件类型数组，普通客户端使用 ALARM。订阅以当前会话为单位，重复操作幂等；不影响设备、Trait 和对象事件订阅。
      examples:
      - name: subscribeAlarmRequest
        payload:
          type: SubscribeEventRequest
          version: v1
          msgId: alarm-subscribe-1
          data:
          - ALARM
    SubscribeEventResponse:
      name: SubscribeEventResponse
      title: 订阅告警响应
      payload:
        $ref: '#/components/schemas/SubscribeEventResponseMessage'
      correlationId:
        location: $message.payload#/msgId
      examples:
      - name: subscribeAlarmResponse
        payload:
          type: SubscribeEventResponse
          version: v1
          msgId: alarm-subscribe-1
          data: ''
          code: 0
          message: success
    UnsubscribeEventRequest:
      name: UnsubscribeEventRequest
      title: 取消订阅告警请求
      payload:
        $ref: '#/components/schemas/UnsubscribeEventRequestMessage'
      description: 鉴权后发送，data 必须是非空事件类型数组，普通客户端使用 ALARM。订阅以当前会话为单位，重复操作幂等；不影响设备、Trait 和对象事件订阅。
      examples:
      - name: unsubscribeAlarmRequest
        payload:
          type: UnsubscribeEventRequest
          version: v1
          msgId: alarm-unsubscribe-1
          data:
          - ALARM
    UnsubscribeEventResponse:
      name: UnsubscribeEventResponse
      title: 取消订阅告警响应
      payload:
        $ref: '#/components/schemas/UnsubscribeEventResponseMessage'
      correlationId:
        location: $message.payload#/msgId
      examples:
      - name: unsubscribeAlarmResponse
        payload:
          type: UnsubscribeEventResponse
          version: v1
          msgId: alarm-unsubscribe-1
          data: ''
          code: 0
          message: success
    AlarmEvent:
      name: AlarmEvent
      title: 原始告警推送
      description: 仅投递给显式订阅 ALARM 的会话，SubscribeAllRequest 和对象事件订阅不隐式开启。告警独立于 App 通知栏推送；不只限于 OFF_NORMAL，按告警源实际发布的 sourceState
        消费。仅实时推送，不补发历史；断线后须重新订阅。msgId 仅供追踪，不是全局唯一事件 ID。
      payload:
        $ref: '#/components/schemas/PushAlarmEventMessageV1'
      examples:
      - name: alarmTriggered
        payload:
          version: v1
          msgId: alarm-notify-alarm-1
          type: AlarmEvent
          data:
            uuid: alarm-1
            deviceName: Smoke sensor
            deviceId: device-1
            devicePointName: 烟雾浓度
            alarmClass: Critical
            alarmRuleName: Smoke rule
            alarmText: 检测到烟雾
            alarmValue: 开启
            sourceState: OFF_NORMAL
            alarmTime: 1793577600000
            localized:
              zh-CN:
                devicePointName: 烟雾浓度
                alarmText: 检测到烟雾
                alarmValue: 开启
                sourceStateText: 触发
              en-US:
                devicePointName: Smoke concentration
                alarmText: Smoke detected
                alarmValue: 'On'
                sourceStateText: Triggered
          code: 0
          message: success
    SubscribeObjectEventRequest:
      name: SubscribeObjectEventRequest
      title: 订阅空间、设备空间关系和自动化对象事件
      summary: 按当前 WebSocket 会话增量增加对象事件订阅；重复订阅幂等。
      description: |
        objectIds 不传、为 null 或空数组时订阅对应 eventTypes 下当前可访问的全部对象；非空时订阅指定对象。
        后续订阅请求与已有规则合并，不会覆盖之前的指定对象规则。订阅全部对象会覆盖同一事件类型已有的 ID 列表。
        App 可使用全部对象订阅维护完整列表；带屏设备和第三方服务通常按业务范围订阅指定对象。
      payload:
        $ref: '#/components/schemas/SubscribeObjectEventRequestMessage'
      examples:
        - name: subscribeAllPreciseObjectEvents
          payload:
            type: SubscribeObjectEventRequest
            version: v1
            msgId: object-subscribe-1
            data:
              - eventTypes:
                  - SPACE_ADDED
                  - SPACE_REMOVED
                  - SPACE_UPDATED
                  - AUTOMATION_ADDED
                  - AUTOMATION_REMOVED
                  - AUTOMATION_UPDATED
                  - AUTOMATION_SPACE_UPDATED
                  - DEVICE_SPACE_UPDATED
                objectIds: []
        - name: subscribeSelectedObjects
          payload:
            type: SubscribeObjectEventRequest
            version: v1
            msgId: object-subscribe-2
            data:
              - eventTypes:
                  - DEVICE_SPACE_UPDATED
                objectIds:
                  - device-1
                  - device-2
              - eventTypes:
                  - AUTOMATION_REMOVED
                  - AUTOMATION_UPDATED
                  - AUTOMATION_SPACE_UPDATED
                objectIds:
                  - automation-1
    SubscribeObjectEventResponse:
      name: SubscribeObjectEventResponse
      title: 对象事件订阅响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/SubscribeObjectEventResponseMessage'
    UnsubscribeObjectEventRequest:
      name: UnsubscribeObjectEventRequest
      title: 取消空间、设备空间关系和自动化对象事件订阅
      summary: 按当前 WebSocket 会话移除指定对象规则或清空指定事件类型。
      description: |
        objectIds 非空时只移除指定对象；不传、为 null 或空数组时清空对应 eventTypes 的全部对象规则。
        全量订阅不支持排除部分对象；要从全量切换为指定对象，应先清空事件类型，再发送新的指定对象订阅。
      payload:
        $ref: '#/components/schemas/UnsubscribeObjectEventRequestMessage'
      examples:
        - name: unsubscribeSelectedObject
          payload:
            type: UnsubscribeObjectEventRequest
            version: v1
            msgId: object-unsubscribe-1
            data:
              - eventTypes:
                  - AUTOMATION_UPDATED
                objectIds:
                  - automation-1
        - name: clearEventType
          payload:
            type: UnsubscribeObjectEventRequest
            version: v1
            msgId: object-unsubscribe-2
            data:
              - eventTypes:
                  - AUTOMATION_UPDATED
                objectIds: []
    UnsubscribeObjectEventResponse:
      name: UnsubscribeObjectEventResponse
      title: 取消对象事件订阅响应
      correlationId:
        location: $message.payload#/msgId
      payload:
        $ref: '#/components/schemas/UnsubscribeObjectEventResponseMessage'
    TraitValueUpdate:
      name: TraitValueUpdate
      title: Trait 功能值变化推送
      payload:
        $ref: '#/components/schemas/PushTraitValueUpdateMessageV1'
      examples:
        - name: traitValueUpdate
          payload:
            type: TraitValueUpdate
            version: v1
            msgId: '1754469720110'
            data:
              - deviceId: '57190441014857'
                endpointId: 3
                functionCode: MediaPlayback
                traitCode: TargetPlaybackState
                value: '0'
                time: 1754469720110
            code: 0
            message: ''
        - name: deviceNameUpdated
          payload:
            type: TraitValueUpdate
            version: v1
            msgId: '1789113600000'
            data:
              - deviceId: device-1
                endpointId: 0
                functionCode: EndpointLabel
                traitCode: EndpointName
                value: 客厅灯
                time: 1789113600000
            code: 0
            message: ''
    ObjectEvent:
      name: objectEvent
      title: 对象事件推送
      summary: 设备增删默认推送；空间、自动化和空间关联变化按精确对象订阅投递。当前 13 类对象事件均提供示例。
      description: |
        DEVICE_ADDED、DEVICE_REMOVED 在认证连接建立后默认推送。
        
        SPACE_*、AUTOMATION_*、DEVICE_SPACE_UPDATED 仅投递给命中 eventType、objectId 和当前权限的 SubscribeObjectEventRequest 会话。
        
        DEVICE_ENDPOINT_*、DEVICE_TRAIT_PARAMETER_UPDATE 继续跟随现有设备数据订阅。

        独立场景通过 /scenes 管理，变化通知沿用 AUTOMATION_* 事件族；对象分类以 /automations 和 /scenes 查询结果为准。数量变化不提供独立事件。新增、删除自动化只发送对应生命周期快照，不额外发送空间关系事件；已有对象仅空间关系变化时发送 AUTOMATION_SPACE_UPDATED，内容与关系同时变化时两类事件都可能收到。

        自动化快照的 manualTriggers 包含 triggerNodeId 和 triggerName；手动触发入口添加、删除或重命名通过 AUTOMATION_UPDATED 返回完整列表。按完整列表替换缓存，空数组清空旧入口；无需新增事件订阅类型。

        协议不提供全局唯一的事件 ID；推送 msgId 只用于链路追踪，调用端应按对象状态幂等处理，不应仅按 objectId、eventType、time 去重。
      payload:
        $ref: '#/components/schemas/PushObjectEventMessageV1'
      examples:
        - name: deviceAdded
          payload:
            type: objectEvent
            version: v1
            msgId: '2'
            data:
              eventType: DEVICE_ADDED
              objectId: 14d3b91
              time: 1754469720110
              data:
                deviceId: 14d3b91
                name: ''
                deviceTypesList:
                  - Light
                endpointIds:
                  - 0
                  - 2
                  - 3
                time: 1754469720110
            code: 0
            message: success
        - name: deviceSpaceUpdated
          payload:
            type: objectEvent
            version: v1
            msgId: object-event-1
            data:
              eventType: DEVICE_SPACE_UPDATED
              objectId: device-1
              time: 1789113600000
              data:
                deviceId: device-1
                oldSpaceId: space-1
                space:
                  spaceId: space-2
                  name: 卧室
                  spatialMarking: room
                  parentSpaceId: home-1
            code: 0
            message: success
        - name: automationUpdated
          payload:
            type: objectEvent
            version: v1
            msgId: object-event-2
            data:
              eventType: AUTOMATION_UPDATED
              objectId: automation-1
              time: 1789113600000
              data:
                automationId: automation-1
                definitionType: SCRIPT_JSON
                name: 回家模式
                enabled: true
                createTime: 1789000000000
                manualTriggers:
                  - triggerNodeId: trigger-1
                    triggerName: 手动回家
            code: 0
            message: success
        - name: automationSpaceUnassigned
          payload:
            type: objectEvent
            version: v1
            msgId: object-event-3
            data:
              eventType: AUTOMATION_SPACE_UPDATED
              objectId: automation-1
              time: 1789113600000
              data:
                automationId: automation-1
                oldSpaceId: space-2
                space: null
            code: 0
            message: success
        - name: device_removed
